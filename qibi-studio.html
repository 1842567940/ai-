      panelBody.innerHTML = '<div class="empty">正在读取记忆…</div>';
      fetch('/api/projects/' + QB_PROJ + '/memory').then(function (r) { return r.json(); }).then(function (m) { QB_MEM = m; renderMemory(); }).catch(function () { panelBody.innerHTML = '<div class="empty">记忆读取失败</div>'; });
      return;
    }
    var m = QB_MEM, st = m.state || {};
    var charRows = (m.characters || []).map(function (c) {
      return '<div class="lrow"><span class="nm">' + escHtml(c.name || '未命名') + '</span><span class="sub">' + escHtml([c.role, c.status].filter(Boolean).join(' · ')) + '</span></div>';
    }).join('') || '<div class="empty">还没有人物记忆</div>';
    var tlRows = CHAPTERS.map(function (c) {
      var rec = m.chapters && m.chapters[c.id];
      if (!rec || !rec.timeline) return '';
      var t = rec.timeline;
      return '<div class="lrow"><span class="sub" style="width:64px;flex:none">' + escHtml(t.time || '—') + '</span><span class="nm" style="white-space:normal">' + escHtml((t.place ? t.place + ' · ' : '') + (t.event || c.t)) + '</span></div>';
    }).join('') || '<div class="empty">还没有时间线</div>';
    var threadRows = (m.threads || []).map(function (t) {
      return '<div class="lrow"><span class="nm">' + escHtml(t.title) + '</span><span class="sub">' + (t.status === 'resolved' ? '已回收 · ' + escHtml(t.payoffChapter || '') : '待回收 · ' + escHtml(t.plantedChapter || '')) + '</span></div>';
    }).join('') || '<div class="empty">还没有伏笔记录</div>';
    var sumRows = CHAPTERS.map(function (c) {
      var rec = m.chapters && m.chapters[c.id];
      if (!rec || !rec.summary) return '';
      return '<div style="padding:6px 0;border-bottom:1px solid var(--border)"><b style="font-size:11.5px">' + escHtml(c.t) + '</b><div class="cand-note" style="margin-top:3px">' + escHtml(rec.summary) + '</div></div>';
    }).join('') || '<div class="empty">还没有章节摘要</div>';
    var stateLine = [st.time && ('时间 ' + st.time), st.place && ('地点 ' + st.place), st.protagonist && ('主角 ' + st.protagonist)].filter(Boolean).join(' · ') || '尚未记录';
    var sub = function (title, body) { return '<div style="margin-bottom:12px"><div class="minimeta" style="margin-bottom:6px"><b>' + title + '</b></div>' + body + '</div>'; };
    panelBody.innerHTML = '<div style="padding:2px 2px 10px">'
      + '<div class="acts" style="margin-bottom:10px"><button class="mini-btn" id="memBuildCur">更新本章摘要</button><button class="mini-btn" id="memBuildAll">重建全部记忆</button><button class="mini-btn" id="memCheck">一致性检查</button></div>'
      + sub('全书梗概', '<textarea class="ta" id="memBook" style="min-height:84px">' + escHtml(m.book || '') + '</textarea><div class="cand-note">失焦自动保存；重建记忆会重写这里</div>')
      + sub('当前状态', '<div class="cand-note">' + escHtml(stateLine) + '</div>')
      + sub('人物', charRows)
      + sub('时间线', tlRows)
      + sub('伏笔', threadRows)
      + sub('章节摘要', '<div style="max-height:220px;overflow:auto">' + sumRows + '</div>')
      + '<div id="memIssues"></div>'
      + '</div>';
    var book = $('#memBook', panelBody);
    if (book) book.addEventListener('blur', function () {
      var val = book.value.trim();
      if (!QB_MEM) return;
      QB_MEM.book = val;
      fetch('/api/projects/' + QB_PROJ + '/memory', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ book: val }) }).catch(function () { });
    });
    var b1 = $('#memBuildCur', panelBody), b2 = $('#memBuildAll', panelBody), b3 = $('#memCheck', panelBody);
    function build(payload, label) {
      if (memBusy) return;
      memBusy = true;
      panelBody.insertAdjacentHTML('afterbegin', '<div class="cand-note" id="memBusyNote">' + label + '…（AI 正在整理，可能需要十几秒）</div>');
      fetch('/api/projects/' + QB_PROJ + '/memory/build', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) })
        .then(function (r) { return r.json(); }).then(function (j) {
          if (j && j.memory) { QB_MEM = j.memory; memBusy = false; renderMemory(); toast(label + '完成 · 处理 ' + (j.processed || 0) + ' 章'); }
          else { memBusy = false; toast(label + '失败'); }
        }).catch(function () { memBusy = false; toast(label + '失败'); });
    }
    if (b1) b1.addEventListener('click', function () { build({ chapterId: state.ch }, '更新本章摘要'); });
    if (b2) b2.addEventListener('click', function () { build({ all: true }, '重建全部记忆'); });
    if (b3) b3.addEventListener('click', function () {
      if (memBusy) return;
      memBusy = true;
      var host = $('#memIssues', panelBody);
      host.innerHTML = '<div class="cand-note">正在检查一致性…</div>';
      fetch('/api/projects/' + QB_PROJ + '/memory/check', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ chapterId: state.ch }) })
        .then(function (r) { return r.json(); }).then(function (j) {
          memBusy = false;
          var issues = (j && j.issues) || [];
          host.innerHTML = '<div class="minimeta" style="margin-bottom:6px"><b>一致性检查</b><span>' + issues.length + ' 处</span></div>'
            + (issues.length ? issues.map(function (it) {
              return '<div class="lrow" style="align-items:flex-start"><span class="sub" style="width:52px;flex:none">' + escHtml(it.type || '问题') + '</span><span class="nm" style="white-space:normal">' + escHtml(it.why || '') + (it.quote ? '<span class="tag" style="display:inline-block;margin-top:4px">' + escHtml(it.quote) + '</span>' : '') + (it.fix ? '<span class="cand-note">建议：' + escHtml(it.fix) + '</span>' : '') + '</span></div>';
            }).join('') : '<div class="empty">未发现明显矛盾</div>');
        }).catch(function () { memBusy = false; host.innerHTML = '<div class="empty">检查失败</div>'; });
    });
  }
  var memTimer = 0;
  function scheduleMemory() {
    if (!QB_PROJ) return;
    clearTimeout(memTimer);
    memTimer = setTimeout(function () {
      var c = chapterById(state.ch);
      if (!c || !c.body) return;
      fetch('/api/projects/' + QB_PROJ + '/memory/build', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ chapterId: c.id }) })
        .then(function (r) { return r.json(); }).then(function (j) {

  function renderStats() {
    panelTitle.textContent = '统计';
    panelCount.textContent = '实时计算';

    var out = '<div class="stat-wrap">';
    out += '<div class="stat-hero"><div class="stat-hero-k">全书累计 · TOTAL</div>'
      + '<b>' + d.total + '<small>字</small></b>'

      + '<input id="statGoal" type="number" min="500" max="20000" step="100" value="' + style.goal + '" aria-label="单章目标字数" />'
      + '<span>字</span><span style="margin-left:auto">本章 ' + d.curWc + ' · ' + goalPct + '%</span></div>'
      + '<div class="stat-track"><i style="width:' + goalPct + '%"></i></div></div></div>';

      + '<div class="stat-cell"><span>章节总数</span><b>' + d.chapters + '<small> 章</small></b></div>'

  function renderPanel() {
    if (state.mod === 'style' || state.mod === 'stats' || state.mod === 'recipe' || state.mod === 'memory') {
      if (libLink) libLink.hidden = true;
      fileTools.hidden = true;

        panelTitle.textContent = '风格';
        panelCount.textContent = '节奏 · 文风';

      } else if (state.mod === 'recipe') {
        panelTitle.textContent = '配方';
        panelCount.textContent = '钩子 · 配比 · 因素';
        renderRecipe();
      } else if (state.mod === 'memory') {
        panelTitle.textContent = '记忆';
        panelCount.textContent = '人物 · 时间线 · 伏笔';
        renderMemory();
      } else {
        renderStats();

  /* ── 稿纸 ───────────────────────────────────────────────────────── */

    wCount.textContent = n; wCountTop.textContent = n; wPara.textContent = paras;

  function streamChapter(c, beats, words) {
    return new Promise(function (resolve, reject) {
      fetch('/api/ai/novel/chapter/stream', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ project: QB_PROJ || undefined, chapterId: c.id, beats: beats, words: words })
      }).then(function (r) {
        if (!r.ok || !r.body) throw new Error('stream ' + r.status);
        var reader = r.body.getReader();
        var dec = new TextDecoder();
        var buf = '', full = '', last = 0;
        function pump() {
          reader.read().then(function (x) {
            if (x.done) { resolve(full); return; }
            buf += dec.decode(x.value, { stream: true });
            var idx;
            while ((idx = buf.indexOf('\n')) >= 0) {
              var line = buf.slice(0, idx).trim();
              buf = buf.slice(idx + 1);
              if (line.indexOf('data:') !== 0) continue;
              var data = line.slice(5).trim();
              if (!data) continue;
              var j = null;
              try { j = JSON.parse(data); } catch (e) { continue; }
              if (j.error) { reject(new Error(j.error)); return; }
              if (j.delta) {
                full += j.delta;
                var now = Date.now();
                if (now - last > 250 && state.ch === c.id) {
                  last = now;
                  try { editor.innerHTML = chapterHtmlFromText(full); recount(); } catch (e2) { }
                }
              }
            }
            pump();
          }).catch(reject);
        }
        pump();
      }).catch(reject);
    });
  }

    if (rw) { rwForm.strength = rw; renderModOpts(); return; }
    if (o.getAttribute('data-mats-sync')) {
      syncDerivedMaterials(false);
      renderModOpts();
    }
  });
  ctxLine.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('#chatClear') : null;
    if (!b) return;
    chatLog.length = 0; chatLogSave();
    chatStream.innerHTML = ''; chatSeeded = false; seedChat();
    renderCtx();
    toast('对话已清空');
  });
  chatSend.addEventListener('click', sendChat);
  chatInput.addEventListener('input', autoGrowChat);
  chatInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });
  chatChips.addEventListener('click', function (e) {
    var chip = e.target.closest ? e.target.closest('.chip') : null;
    if (!chip) return;
    chatInput.value = chip.textContent;
    sendChat();
  });
  chatStream.addEventListener('click', function (e) {
    var autoPick = e.target.closest ? e.target.closest('[data-auto-pick]') : null;
    if (autoPick) { resumeAuto(parseInt(autoPick.getAttribute('data-auto-pick'), 10)); return; }
    var autoStop = e.target.closest ? e.target.closest('[data-auto-stop]') : null;
    if (autoStop) { stopAuto(false); return; }
    var autoUndoBtn = e.target.closest ? e.target.closest('[data-auto-undo]') : null;
    if (autoUndoBtn) { autoUndo(); return; }
    var rwApply = e.target.closest ? e.target.closest('[data-rwapply]') : null;
    if (rwApply) { applyPendingRewrite(); return; }
    var rwCopy = e.target.closest ? e.target.closest('[data-rwcopy]') : null;
    if (rwCopy) { if (pendingRewrite) copyText(pendingRewrite.text); return; }
    var matsSync = e.target.closest ? e.target.closest('[data-mats-sync]') : null;
    if (matsSync) {
      syncDerivedMaterials(false);
      if (state.sel === 'mats') renderModOpts();
      return;
    }
    var sug = e.target.closest ? e.target.closest('[data-sug]') : null;
    if (sug) { handleSug(sug.getAttribute('data-sug')); return; }
    var ins = e.target.closest ? e.target.closest('[data-ins]') : null;
    if (ins) { insertCand(parseInt(ins.getAttribute('data-ins'), 10)); return; }
    var cp = e.target.closest ? e.target.closest('[data-cp]') : null;
    if (cp) {
      var i = parseInt(cp.getAttribute('data-cp'), 10);
      var cl = (AI_CANDS.length ? AI_CANDS : CAND_DEMOS)[i];
      if (cl) copyText(cl.text);
      return;
    }
    var ap = e.target.closest ? e.target.closest('[data-apply]') : null;
    if (ap) { applyPendingPolish(); return; }
    var pc = e.target.closest ? e.target.closest('[data-pcopy]') : null;
    if (pc && pendingPolish) copyText(pendingPolish.text);
  });

  /* ── 事件：划选、查找、专注 ────────────────────────────────────── */
  document.addEventListener('selectionchange', function () {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) { hideSelTools(); return; }
    var r = sel.getRangeAt(0);
    var node = r.commonAncestorContainer;
    var host = node && node.nodeType === 1 ? node : (node ? node.parentNode : null);
    var inside = host && editor.contains(host);
    if (inside && !r.collapsed && sel.toString().trim()) {
      savedRange = r.cloneRange();
      var rect = r.getBoundingClientRect();
      if (rect && (rect.width || rect.height)) showSelTools(rect);
    } else {
      hideSelTools();
    }
  });
  sheet.addEventListener('scroll', hideSelTools);
  selTools.addEventListener('mousedown', function (e) { e.preventDefault(); });
  selTools.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-sel]') : null;
    if (!b) return;
    var act = b.getAttribute('data-sel');
    if (act === 'polish') applySelectionPolish();
    else if (act === 'typo') applySelectionTypo();
    else if (act === 'rename') openRename();
    else if (act === 'hl') markSelection();
    else if (act === 'copy') { var r = currentSelectionRange(); if (r) copyText(r.toString()); }
    else if (act === 'ask') {
      var r2 = currentSelectionRange();
      focusChat(r2 ? '关于这段：「' + cut(r2.toString().replace(/\s+/g, ' '), 36) + '」结合全书，你怎么看？' : '结合全书和当前章节，聊聊接下来怎么走？');
    }
  });

  document.getElementById('selCancel').addEventListener('click', function () { selPop.hidden = true; });
  document.getElementById('selOnlyCh').addEventListener('click', function () { applyRename(false); });
  document.getElementById('selAllCh').addEventListener('click', function () { applyRename(true); });

  findBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    toggleFind(findPop.hidden);
  });
  findNextBtn.addEventListener('click', doFindNext);
  findReplaceAllBtn.addEventListener('click', doReplaceAll);
  findInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); doFindNext(); } });
  replaceInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); doReplaceAll(); } });
  focusBtn.addEventListener('click', function () {
    setFocus(!studio.classList.contains('focus'));
  });

  /* ── 事件：AI 面板显隐 / 通知 / 新建 ────────────────────────────── */
  function aiNarrow() { return window.matchMedia('(max-width: 1240px)').matches; }
  function aiVisible() {
    return aiNarrow() ? studio.classList.contains('show-ai') : !studio.classList.contains('ai-off');
  }
  function syncAiBtn() { var on = aiVisible(); aiToggle.classList.toggle('is-on', on); aiToggle.setAttribute('aria-pressed', on ? 'true' : 'false'); }
  aiToggle.addEventListener('click', function () {
    if (studio.classList.contains('focus')) setFocus(false);
    if (aiNarrow()) studio.classList.toggle('show-ai');
    else studio.classList.toggle('ai-off');
    syncAiBtn();
  });
  window.addEventListener('resize', function () {
    studio.classList.remove('show-ai', 'ai-off');
    hideSelTools();
    syncAiBtn();
  });

  if (autoPause) autoPause.addEventListener('click', function () {
    if (autoWrite.paused) resumeAutoWrite();
    else pauseAutoWrite();
  });
  if (autoToggle) autoToggle.addEventListener('click', function () {
    if (autoWrite.running) {
      autoWrite.stop = true;
      autoWrite.awaiting = false;
      autoWrite.resume = null;
      autoStatus('停止中 · 写完当前章就停…', 'busy');
      toast('AI 托管将在本章写完后停止');
      return;
    }
    if (auto.on || auto.paused) stopAuto(false);
    else startAutoFlow();
  });

  if (exportBtn) exportBtn.addEventListener('click', function (e) {
    if (e) e.stopPropagation();
    var open = !exportPop.classList.contains('open');
    exportPop.classList.toggle('open', open);
    exportBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) renderExport();
  });
  function expSegClick(e) {
    var b = e.target.closest ? e.target.closest('.exp-opt') : null;
    if (!b || b.disabled) return;
    var key = b.getAttribute('data-fmt') ? 'fmt' : b.getAttribute('data-scope') ? 'scope' : b.getAttribute('data-split') ? 'split' : '';
    if (!key) return;
    expForm[key] = b.getAttribute('data-' + key);
    renderExport();
  }
  [expFmtEl, expScopeEl, expSplitEl].forEach(function (el) {
    if (el) el.addEventListener('click', expSegClick);
  });
  if (expGo) expGo.addEventListener('click', runExport);

  if (readerBtn) readerBtn.addEventListener('click', function () {
    if (reader.hidden) openReader();
    else closeReader();
  });
  if (readerClose) readerClose.addEventListener('click', closeReader);
  if (readerMode) readerMode.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-turn]') : null;
    if (b) setReadTurn(b.getAttribute('data-turn'));
  });
  if (readerPrev) readerPrev.addEventListener('click', function () { readerGo(-1); });
  if (readerNext) readerNext.addEventListener('click', function () { readerGo(1); });
  if (readerPrevBtn) readerPrevBtn.addEventListener('click', function () { readerGo(-1); });
  if (readerNextBtn) readerNextBtn.addEventListener('click', function () { readerGo(1); });
  var sheetPrev = $('sheetPrev'), sheetNext = $('sheetNext');
  if (sheetPrev) sheetPrev.addEventListener('click', function () { flipChapter(-1); });
  if (sheetNext) sheetNext.addEventListener('click', function () { flipChapter(1); });
  if (readerBody) readerBody.addEventListener('scroll', readerScrollSync);

  var bell = $('bell'), pop = $('bellPop');
  bell.addEventListener('click', function (e) {
    e.stopPropagation();
    var open = pop.classList.toggle('open');
    bell.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  document.addEventListener('click', function (e) {
    if (!pop.contains(e.target) && e.target !== bell) { pop.classList.remove('open'); bell.setAttribute('aria-expanded', 'false'); }
    if (exportPop.classList.contains('open') && !exportPop.contains(e.target) && !exportBtn.contains(e.target)) {
      exportPop.classList.remove('open');
      exportBtn.setAttribute('aria-expanded', 'false');
    }
    if (!selPop.hidden && !selPop.contains(e.target) && !selTools.contains(e.target)) selPop.hidden = true;
    if (!findPop.hidden && !findPop.contains(e.target) && !findBtn.contains(e.target)) toggleFind(false);
  });

  document.addEventListener('keydown', function (e) {
    if (reader && !reader.hidden) {
      if (e.key === 'Escape') { e.preventDefault(); closeReader(); return; }
      if (e.key === 'ArrowRight') { e.preventDefault(); readerGo(1); return; }
      if (e.key === 'ArrowLeft') { e.preventDefault(); readerGo(-1); return; }
      return;
    }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
      if (window.getSelection && String(window.getSelection())) return;
      e.preventDefault();
      flipChapter(e.key === 'ArrowRight' ? 1 : -1);
      return;
    }
    if (e.key !== 'Escape') return;
    if (exportPop.classList.contains('open')) {
      exportPop.classList.remove('open');
      exportBtn.setAttribute('aria-expanded', 'false');
      return;
    }
    if (!findPop.hidden) toggleFind(false);
    if (!selPop.hidden) selPop.hidden = true;
    hideSelTools();
    if (studio.classList.contains('focus')) setFocus(false);
  });

  panelAdd.addEventListener('click', function () {
    if (state.mod === 'files') addChapter();
  });

  /* ── 模式：读取开书向导带进来的题材设定 ─────────────────────────── */
  var MOD_ICONS = { files: ICON_BOOK, people: ICON_PERSON, lore: ICON_GLOBE, mats: ICON_BOX, notes: ICON_NOTE };
  var MOD_NAMES = { files: '文稿', people: '人物', lore: '设定', mats: '素材', notes: '笔记' };
  function applyMode() {
    var raw = null;
    try { raw = localStorage.getItem('qibi.mode.draft'); } catch (e) {}
    if (!raw) return;
    var d; try { d = JSON.parse(raw); } catch (e) { return; }
    if (!d || !d.mode) return;
    var chip = document.getElementById('modeChip');
    var strip = document.getElementById('modeStrip');
    var chips = document.getElementById('modeChips');
    chip.hidden = false;
    var chipTag = d.kind === 'viral' ? '仿写' : d.kind === 'free' ? '创作' : '模式';
    var chipName = d.kind === 'free' ? (d.title || '创作稿') : d.mode;
    chip.innerHTML = '<i>' + chipTag + '</i><b>' + escHtml(chipName) + '</b>';
    var mods = Array.isArray(d.mods) ? d.mods : [];
    var out = '';
    mods.forEach(function (m) { if (MOD_ICONS[m]) out += '<button type="button" class="mstrip-chip" data-gomod="' + m + '">' + MOD_ICONS[m] + '<span>' + MOD_NAMES[m] + '</span></button>'; });
    if (out) { chips.innerHTML = out; strip.classList.add('is-on'); }
    var plan = d.span === 'book' ? '整本长篇' : ('先写 ' + (d.n || 3) + ' 章 · 每章约 ' + (d.w || 3000) + ' 字');
    var feats = mods.map(function (m) { return MOD_NAMES[m]; }).filter(Boolean).join('、');
    var line = d.kind === 'free'
      ? ('已开一张创作稿：' + (d.startLabel ? escHtml(d.startLabel) + '，' : '') + (d.lead ? '「' + escHtml(d.lead) + '」' : '不设题材与框架') + '。')
      : ('已按「' + escHtml(d.mode) + '」开书：' + plan + (feats ? '，随书打开 ' + feats + ' 面板' : '') + '。');
    var extra = [];
    if (d.tpls && d.tpls.length) extra.push('模板：' + d.tpls.join('、'));
    if (d.refs && d.refs.length) extra.push('参考资料 ' + d.refs.length + ' 条已就位');
    chatPush('开书', escHtml(line).replace(/\n/g, '<br>') + (extra.length ? '<br>' + escHtml(extra.join('；')) : ''));
    Array.prototype.slice.call(chips.querySelectorAll('[data-gomod]')).forEach(function (b) {
      b.addEventListener('click', function () {
        switchMod(b.getAttribute('data-gomod'));
        Array.prototype.slice.call(chips.querySelectorAll('[data-gomod]')).forEach(function (y) { y.classList.toggle('is-cur', y === b); });
      });
      b.classList.toggle('is-cur', b.getAttribute('data-gomod') === state.mod);
    });
  }

  /* ── boot ────────────────────────────────────────────────────────── */
  var startMod = state.mod;
  if (startMod !== 'files' && startMod !== 'style' && startMod !== 'stats' && startMod !== 'recipe' && !PANELS[startMod]) startMod = 'files';
  state.mod = startMod;
  updateRail(startMod);
  renderPanel();
  var startCh = preferredChapterId();
  if (!chapterById(startCh)) startCh = CHAPTERS.length ? CHAPTERS[0].id : 'c1';
  loadChapter(startCh);
  renderMods();
  renderChatChips();
  seedChat();
  applyMode();
  autoStatus(AUTO_IDLE);
  autoUi();
  syncAiBtn();
})();

</script>
  <script src="qibi-avatar.js?v=3"></script>
</body>
</html>
