<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>启笔 QIBI · 创作台</title>
<link rel="icon" type="image/png" href="app-icon.png" />
<style>
  /* ─── tokens — 沿用工作台 (ai-novel-editor-home.html) 的夜色水墨令牌 ──
        The user's 水墨夜色 painting sits under the whole studio. 创作台 =
        左栏（目录/人物/设定/素材/笔记）· 中栏稿纸 · 右栏 AI 写作助手，
        顶栏为作品与章节。Rice-white type on night ink, a single 朱砂 accent.
        One screen; only the 稿纸 / 目录 / AI 流 themselves scroll. */
  :root {
    --bg:      oklch(15% 0.010 262);
    --surface: oklch(23% 0.011 262);
    --fg:      oklch(94% 0.006 90);
    --muted:   oklch(73% 0.010 90);
    --border:  oklch(96% 0.006 90 / 0.13);
    --accent:  oklch(55% 0.17 28);

    --ink-soft:      oklch(96% 0.006 90 / 0.055);
    --ink-hair:      oklch(96% 0.006 90 / 0.16);
    --ink-dash:      oklch(96% 0.006 90 / 0.26);
    --accent-soft:   oklch(60% 0.17 28 / 0.17);
    --accent-line:   oklch(62% 0.17 28 / 0.44);
    --accent-ink:    oklch(98% 0.008 30);
    --accent-deep:   oklch(47% 0.16 28);
    --accent-bright: oklch(73% 0.15 32);
    --scrim:         oklch(11% 0.012 262);

    --font-display: 'Iowan Old Style', 'Charter', Georgia, 'Songti SC', 'STSong', 'Source Han Serif SC', 'Noto Serif SC', 'SimSun', serif;
    --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    --font-mono:    ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;

    --r-sm: 9px; --r-md: 12px; --r-lg: 15px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .bg-photo {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: var(--bg) url("%E6%B0%B4%E5%A2%A8%E5%B0%91%E5%A5%B3-%E5%A4%9C%E8%89%B2.png") center / cover no-repeat;
  }
  .bg-scrim {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      linear-gradient(180deg, oklch(9% 0.012 262 / 0.05), transparent 60%, oklch(10% 0.012 262 / 0.03)),
      linear-gradient(103deg, oklch(8% 0.012 262 / 0.05) 0%, oklch(10% 0.012 262 / 0.02) 52%, oklch(12% 0.012 262 / 0) 100%);
  }
  img, svg { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  h1, h2, h3, h4, p { margin: 0; }
  ::selection { background: var(--accent-soft); }

  /* ─── studio shell ───────────────────────────────────────────────── */
  .studio {
    position: relative; z-index: 1;
    height: 100vh;
    display: grid;
    grid-template-columns: 66px 290px minmax(0, 1fr) 340px;
    grid-template-rows: 58px minmax(0, 1fr);
  }
  /* wide screens: the AI panel sits in the grid; the toggle collapses it */
  .studio.ai-off { grid-template-columns: 66px 290px minmax(0, 1fr); }
  .studio.ai-off .ai { display: none; }
  .appbar {
    grid-column: 1 / -1; grid-row: 1;
    display: flex; align-items: center; gap: 14px; padding: 0 18px 0 20px;
    border-bottom: 1px solid var(--border);
    background: var(--scrim);
  }
  .brand { display: flex; align-items: center; gap: 10px; flex: none; }
  .app-icon {
    width: 34px; height: 34px; flex: none; display: block;
    border-radius: 9px; object-fit: contain;
    box-shadow: 0 1px 3px oklch(0% 0 0 / 0.45), 0 0 0 1px var(--border);
  }
  .brand-name { font-family: var(--font-display); font-size: 16px; font-weight: 600; letter-spacing: 0.02em; line-height: 1.1; }
  .brand-sub { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--muted); letter-spacing: 0.14em; margin-top: 1px; }
  .home-link { display: inline-flex; align-items: center; gap: 6px; flex: none; padding: 6px 10px; border-radius: var(--r-sm); border: 1px solid var(--border); color: var(--muted); font-size: 12px; transition: background .14s, color .14s, border-color .14s; }
  .home-link:hover { background: var(--ink-soft); color: var(--fg); border-color: var(--ink-hair); }
  .home-link svg { width: 14px; height: 14px; }
  .crumb { display: flex; align-items: center; gap: 8px; flex: none; padding-left: 14px; border-left: 1px solid var(--border); font-size: 12.5px; color: var(--muted); }
  .crumb-cur { color: var(--fg); font-weight: 500; }
  .appbar-right { display: flex; align-items: center; gap: 9px; flex: none; margin-left: auto; }
  .save-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; color: var(--muted); background: var(--surface); }
  .save-chip i { width: 6px; height: 6px; border-radius: 999px; background: var(--ink-dash); transition: background .2s; }
  .save-chip.is-dirty i { background: var(--accent-bright); }
  .save-chip.is-saved i { background: var(--muted); }
  .wchip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; color: var(--muted); background: var(--surface); font-variant-numeric: tabular-nums; }
  .wchip b { color: var(--fg); font-weight: 600; font-family: var(--font-mono); }

  .icon-btn {
    width: 36px; height: 36px; border-radius: var(--r-sm); flex: none; position: relative;
    display: grid; place-items: center; background: transparent; border: 1px solid var(--border); color: var(--muted);
    transition: background .14s ease, color .14s ease, border-color .14s ease;
  }
  .icon-btn:hover { background: var(--ink-soft); color: var(--fg); border-color: var(--ink-hair); }
  .icon-btn.is-on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-bright); }
  .icon-btn svg { width: 17px; height: 17px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    padding: 8px 15px; border-radius: var(--r-sm);
    border: 1px solid transparent; font-size: 13.5px; font-weight: 500;
    transition: background .15s ease, border-color .15s ease, color .15s ease, transform .05s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn svg { width: 15px; height: 15px; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
  .btn-ghost { background: transparent; border-color: var(--border); color: var(--fg); }
  .btn-ghost:hover { background: var(--ink-soft); border-color: var(--ink-hair); }
  .btn-sm { padding: 6px 12px; font-size: 12.5px; }

  :where(.btn, .icon-btn, .rail-btn, .home-link, .ch, .vol-head, .chip, .ai-tab, .add-btn, .res-act):focus-visible {
    outline: 2px solid var(--accent-bright); outline-offset: 2px;
  }

  /* ─── left rail ──────────────────────────────────────────────────── */
  .rail {
    grid-column: 1; grid-row: 2;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 12px 0 14px; overflow: hidden;
    border-right: 1px solid var(--border);
    background: color-mix(in oklch, var(--scrim) 34%, transparent);
  }
  .rail-btn {
    width: 54px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 0; border-radius: 12px; border: 1px solid transparent;
    background: transparent; color: var(--muted); font-size: 10px; letter-spacing: 0.02em;
    transition: background .14s ease, color .14s ease, border-color .14s ease;
  }
  .rail-btn svg { width: 19px; height: 19px; }
  .rail-btn:hover { background: var(--ink-soft); color: var(--fg); }
  .rail-btn.is-active { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-bright); }
  .rail-spacer { flex: 1; }
  .rail-avatar { width: 34px; height: 34px; border-radius: 999px; flex: none; display: grid; place-items: center; color: var(--muted); background: var(--ink-soft); border: 1px dashed var(--ink-dash); }
  .rail-avatar svg { width: 17px; height: 17px; }

  /* ─── shared panel chrome ────────────────────────────────────────── */
  .panel-head {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 13px 16px 11px; border-bottom: 1px solid var(--border);
  }
  .panel-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: 0.04em; }
  .panel-count { font-family: var(--font-mono); font-size: 10px; color: var(--muted); letter-spacing: 0.08em; }
  .panel-head .spacer { flex: 1; }
  .add-btn {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 8px;
    border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 11.5px;
    transition: background .14s, color .14s, border-color .14s;
  }
  .add-btn:hover { background: var(--ink-soft); color: var(--fg); border-color: var(--ink-hair); }
  .add-btn svg { width: 12px; height: 12px; }
  .add-btn[hidden] { display: none; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 8px 10px 16px; scrollbar-width: thin; scrollbar-color: var(--ink-hair) transparent; }
  .scroll::-webkit-scrollbar { width: 8px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--ink-hair); border-radius: 999px; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
  .file-tools { flex: none; padding: 9px 14px 3px; }
  .file-tools[hidden] { display: none; }
  .file-tools input {
    width: 100%; padding: 6px 9px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--ink-soft); color: var(--fg); font: inherit; font-size: 11.5px;
  }
  .file-tools input::placeholder { color: var(--muted); opacity: .8; }
  .file-tools input:focus { outline: 0; border-color: var(--accent-line); }

  /* ─── left: 文稿目录 / 人物 / 设定 / 素材 / 笔记 ───────────────────── */
  .files {
    grid-column: 2; grid-row: 2; min-height: 0; display: flex; flex-direction: column;
    border-right: 1px solid var(--border);
    background: color-mix(in oklch, var(--scrim) 44%, transparent);
  }
  .vol { margin-bottom: 4px; }
  .vol-head {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 7px 8px; border: 0; border-radius: var(--r-sm); background: transparent;
    transition: background .14s ease;
  }
  .vol-head:hover { background: var(--ink-soft); }
  .vol-mark { width: 6px; height: 6px; flex: none; border-radius: 1px; background: var(--fg); opacity: .5; transform: rotate(45deg); }
  .vol-name { font-family: var(--font-display); font-size: 12.5px; font-weight: 600; letter-spacing: 0.05em; white-space: nowrap; }
  .vol-line { flex: 1; min-width: 10px; height: 1px; background: var(--border); }
  .vol-count { font-family: var(--font-mono); font-size: 9.5px; color: var(--muted); }
  .vol-caret { width: 12px; height: 12px; color: var(--muted); transition: transform .18s ease; }
  .vol-caret svg { width: 12px; height: 12px; }
  .vol.is-collapsed .vol-caret { transform: rotate(-90deg); }
  .vol.is-collapsed .vol-list { display: none; }

  .ch {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    padding: 7px 8px 7px 14px; border: 0; border-radius: var(--r-sm); background: transparent;
    transition: background .14s ease;
  }
  .ch:hover { background: var(--ink-soft); }
  .ch.is-cur { background: var(--accent-soft); }
  .ch-idx { font-family: var(--font-mono); font-size: 9.5px; color: var(--muted); flex: none; width: 16px; font-variant-numeric: tabular-nums; }
  .ch.is-cur .ch-idx { color: var(--accent-bright); }
  .ch-title { flex: 1; min-width: 0; font-size: 13px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch-meta { flex: none; font-family: var(--font-mono); font-size: 9.5px; color: var(--muted); letter-spacing: 0.04em; }
  .ch.is-cur .ch-meta { color: var(--accent-bright); }

  .plist { display: flex; flex-direction: column; }
  .prow {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 9px 8px; border: 0; border-bottom: 1px solid var(--border); background: transparent;
    transition: background .14s ease;
  }
  .prow:hover { background: var(--ink-soft); }
  .prow-ic { width: 26px; height: 26px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--ink-soft); color: var(--muted); }
  .prow-ic svg { width: 15px; height: 15px; }
  .prow:hover .prow-ic { color: var(--fg); }
  .prow-txt { font-size: 13px; color: var(--muted); }

  /* ─── 创作页 → 左栏同步 ──────────────────────────────────────────── */
  .sync-card { margin: 2px 2px 10px; padding: 10px 11px; border: 1px solid var(--border); border-radius: 10px; background: linear-gradient(150deg, var(--accent-soft), var(--ink-soft) 66%); }
  .sync-k { font-family: var(--font-mono); font-size: 7.5px; letter-spacing: .12em; color: var(--muted); }
  .sync-card b { display: block; margin-top: 3px; font-family: var(--font-display); font-size: 13.5px; font-weight: 600; }
  .sync-card p { margin-top: 3px; font-size: 9.5px; line-height: 1.6; color: var(--muted); }
  .sync-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .sync-tag { padding: 2px 6px; border-radius: 5px; border: 1px solid var(--border); background: color-mix(in oklch, var(--surface) 40%, transparent); font-size: 8px; color: var(--muted); }
  .sync-empty { margin: 4px 2px; padding: 20px 14px; text-align: center; border: 1px dashed var(--ink-dash); border-radius: 10px; }
  .sync-empty b { display: block; font-size: 12px; font-weight: 600; color: var(--fg); }
  .sync-empty p { margin-top: 4px; font-size: 9.5px; line-height: 1.65; color: var(--muted); }
  .sync-empty a { display: inline-flex; margin-top: 8px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 9.5px; color: var(--accent-bright); text-decoration: none; }
  .sync-foot { margin: 0 2px 8px; display: flex; align-items: center; gap: 6px; font-size: 9px; color: var(--muted); }
  .sync-foot a { margin-left: auto; color: var(--accent-bright); text-decoration: none; }

  /* ─── center: 稿纸 ───────────────────────────────────────────────── */
  .paper {
    grid-column: 3; grid-row: 2; min-height: 0; display: flex; flex-direction: column;
    background: color-mix(in oklch, var(--scrim) 46%, transparent);
  }
  .paper-head {
    flex: none; display: flex; align-items: flex-end; gap: 12px;
    padding: 16px 30px 12px; border-bottom: 1px solid var(--border);
  }
  .doc-title {
    font-family: var(--font-display); font-size: 21px; font-weight: 600; letter-spacing: 0.03em;
    background: transparent; border: 0; outline: 0; color: var(--fg); min-width: 0; flex: 1;
    padding: 2px 0;
  }
  .doc-title::placeholder { color: var(--muted); }
  .doc-tag { flex: none; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 3px 9px; }

  .sheet { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 34px 30px 80px; scrollbar-width: thin; scrollbar-color: var(--ink-hair) transparent; }
  .sheet::-webkit-scrollbar { width: 8px; }
  .sheet::-webkit-scrollbar-thumb { background: var(--ink-hair); border-radius: 999px; }
  .editor {
    max-width: 720px; margin: 0 auto; outline: 0;
    font-family: var(--font-display); font-size: 16.5px; line-height: 2.0; letter-spacing: 0.02em;
    color: var(--fg); caret-color: var(--accent-bright);
  }
  .editor p { margin: 0 0 1.15em; text-indent: 2em; }
  .editor p:last-child { margin-bottom: 0; }
  .editor:empty::before { content: attr(data-ph); color: var(--muted); font-style: italic; }
  .editor .ph-note { color: var(--muted); }
  .editor mark.hl { background: var(--accent-soft); color: inherit; border-radius: 2px; padding: 0 1px; }

  .statusbar {
    flex: none; display: flex; align-items: center; gap: 16px;
    padding: 8px 30px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted);
  }
  .statusbar .spacer { flex: 1; }
  .statusbar b { color: var(--fg); font-weight: 600; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* ─── right: AI 写作助手 · 上模块 / 下对话 ───────────────────────── */
  .ai {
    grid-column: 4; grid-row: 2; min-height: 0; display: flex; flex-direction: column;
    border-left: 1px solid var(--border);
    background: color-mix(in oklch, var(--scrim) 44%, transparent);
  }
  .ai-head { flex: none; display: flex; align-items: center; gap: 7px; padding: 10px 12px 9px; border-bottom: 1px solid var(--border); }
  .ai-title { font-family: var(--font-display); font-size: 14px; font-weight: 600; letter-spacing: .04em; }
  .ai-head .spacer { flex: 1; }
  .model-chip { font-family: var(--font-mono); font-size: 9px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 7px; letter-spacing: .04em; white-space: nowrap; }
  .sug-toggle { flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px 2px 4px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: var(--font-mono); font-size: 8px; letter-spacing: .08em; transition: .14s; }
  .sug-toggle:hover { border-color: var(--ink-hair); color: var(--fg); }
  .sug-toggle .dot { position: relative; width: 16px; height: 8px; border-radius: 999px; background: var(--ink-soft); border: 1px solid var(--border); transition: .14s; }
  .sug-toggle .dot i { position: absolute; top: 1px; left: 1px; width: 4px; height: 4px; border-radius: 999px; background: var(--muted); transition: .14s; }
  .sug-toggle.is-on { border-color: var(--accent-line); color: var(--accent-bright); background: var(--accent-soft); }
  .sug-toggle.is-on .dot { border-color: var(--accent-line); background: color-mix(in oklch, var(--accent) 30%, transparent); }
  .sug-toggle.is-on .dot i { left: 9px; background: var(--accent-bright); }

  .ai-mods { flex: 0 0 33%; min-height: 0; display: flex; flex-direction: column; border-bottom: 1px solid var(--border); }
  .ai-mods-head { flex: none; display: flex; align-items: baseline; gap: 6px; padding: 8px 12px 0; }
  .ai-mods-k { font-family: var(--font-mono); font-size: 8px; letter-spacing: .12em; color: var(--muted); }
  .ai-mods-s { margin-left: auto; font-size: 8.5px; color: var(--accent-bright); }
  .ai-mod-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 7px 12px 10px; display: flex; flex-direction: column; gap: 7px; scrollbar-width: thin; scrollbar-color: var(--ink-hair) transparent; }
  .ai-mod-body::-webkit-scrollbar { width: 7px; }
  .ai-mod-body::-webkit-scrollbar-thumb { background: var(--ink-hair); border-radius: 999px; }
  .mod-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
  .mod { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: transparent; text-align: left; transition: .14s; }
  .mod b { font-size: 11.5px; font-weight: 600; color: var(--fg); }
  .mod small { font-family: var(--font-mono); font-size: 7px; letter-spacing: .04em; color: var(--muted); }
  .mod:hover { border-color: var(--ink-hair); background: var(--ink-soft); }
  .mod.is-on { border-color: var(--accent-line); background: var(--accent-soft); }
  .mod.is-on b { color: var(--accent-bright); }
  .mod-opts { display: flex; flex-wrap: wrap; gap: 4px; }
  .mod-opt { padding: 3px 7px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 9.5px; transition: .14s; }
  .mod-opt:hover { border-color: var(--ink-hair); color: var(--fg); }
  .mod-opt.is-on { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-bright); }
  .mod-opt-k { align-self: center; font-family: var(--font-mono); font-size: 7.5px; letter-spacing: .08em; color: var(--muted); margin-right: 1px; }
  .mod-note { font-size: 9px; line-height: 1.55; color: var(--muted); }
  .mod-note b { color: var(--fg); font-weight: 600; }

  .ai-chat { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .ctx-line { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: 8px; letter-spacing: .04em; color: var(--muted); }
  .ctx-line b { color: var(--fg); font-weight: 500; }
  .ctx-line > span { flex: none; }
  .ctx-line > span:nth-child(3) { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ctx-line .ctx-tag { flex: none; }
  .ctx-line .chat-clear { flex: none; margin-left: auto; }

  /* ─── 风格面板：节奏 / 文笔文风 / 视角 ─────────────────────────── */
  .fs-wrap { display: flex; flex-direction: column; gap: 15px; padding: 4px 2px 14px; }
  .fs-summary { padding: 11px 12px; border: 1px solid var(--border); border-radius: var(--r-md); background: linear-gradient(150deg, var(--accent-soft), var(--ink-soft) 62%); }
  .fs-summary-k { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .12em; color: var(--muted); }
  .fs-summary b { display: block; margin-top: 4px; font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: .04em; }
  .fs-summary p { margin-top: 3px; font-size: 10.5px; line-height: 1.65; color: var(--muted); }
  .fs-group { display: flex; flex-direction: column; gap: 7px; }
  .fs-head { display: flex; align-items: baseline; gap: 6px; }
  .fs-label { font-size: 11.5px; font-weight: 600; letter-spacing: .03em; }
  .fs-sub { margin-left: auto; font-family: var(--font-mono); font-size: 8px; letter-spacing: .1em; color: var(--muted); }
  .fs-opts { display: flex; flex-wrap: wrap; gap: 5px; }
  .fs-opt { padding: 4px 9px; border-radius: 7px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 10.5px; transition: .14s; }
  .fs-opt:hover { border-color: var(--ink-hair); color: var(--fg); }
  .fs-opt.is-on { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-bright); }
  .fs-slider { display: grid; grid-template-columns: 62px minmax(0, 1fr) 30px; align-items: center; gap: 8px; padding: 3px 0; }
  .fs-slider span { font-size: 10px; color: var(--muted); }
  .fs-slider b { font-family: var(--font-mono); font-size: 9px; font-weight: 500; color: var(--fg); text-align: right; }
  .fs-slider input[type="range"] { width: 100%; accent-color: var(--accent); }
  .fs-note { font-size: 9.5px; line-height: 1.65; color: var(--muted); opacity: .9; }

  /* ─── 配方面板：钩子 / 叙事配比 / 特殊因素 ─────────────────────── */
  .rcp-wrap { display: flex; flex-direction: column; gap: 11px; padding: 4px 2px 14px; }
  .rcp-card { border: 1px solid var(--border); border-radius: var(--r-md); background: color-mix(in oklch, var(--surface) 38%, transparent); overflow: hidden; }
  .rcp-head { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-bottom: 1px solid var(--border); background: var(--ink-soft); }
  .rcp-no { flex: none; font-family: var(--font-mono); font-size: 8px; color: var(--accent-bright); letter-spacing: .06em; }
  .rcp-title { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .rcp-title b { font-family: var(--font-display); font-size: 12.5px; font-weight: 600; }
  .rcp-title span { font-size: 8px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rcp-badge { flex: none; font-family: var(--font-mono); font-size: 7.5px; letter-spacing: .04em; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 6px; }
  .rcp-body { padding: 9px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
  .rcp-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .rcp-chip { padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 9.5px; transition: .14s; }
  .rcp-chip:hover { border-color: var(--ink-hair); color: var(--fg); }
  .rcp-chip.is-on { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-bright); }
  .rcp-input { display: flex; align-items: center; gap: 5px; }
  .rcp-input input { flex: 1; min-width: 0; padding: 5px 8px; border: 1px solid var(--border); border-radius: 7px; background: var(--ink-soft); color: var(--fg); font: inherit; font-size: 10.5px; }
  .rcp-input input::placeholder { color: var(--muted); opacity: .8; }
  .rcp-input input:focus { outline: 0; border-color: var(--accent-line); }
  .rcp-input .rcp-save { flex: none; padding: 5px 9px; border-radius: 7px; border: 1px solid var(--accent-line); background: var(--accent-soft); color: var(--accent-bright); font-size: 10px; }
  .rcp-bar { display: flex; gap: 1px; height: 7px; border-radius: 999px; overflow: hidden; background: var(--ink-soft); }
  .rcp-bar i { display: block; height: 100%; transition: width .16s ease; }
  .rcp-bar i:nth-child(1) { background: var(--accent); }
  .rcp-bar i:nth-child(2) { background: color-mix(in oklch, var(--accent-bright) 55%, var(--surface)); }
  .rcp-bar i:nth-child(3) { background: var(--accent-bright); }
  .rcp-bar i:nth-child(4) { background: color-mix(in oklch, var(--fg) 44%, transparent); }
  .rcp-bar i:nth-child(5) { background: color-mix(in oklch, var(--muted) 36%, transparent); }
  .rcp-ratios { display: flex; flex-direction: column; gap: 1px; }
  .rcp-ratio { display: grid; grid-template-columns: 30px minmax(0, 1fr) 34px; align-items: center; gap: 7px; }
  .rcp-ratio span { font-size: 9.5px; color: var(--muted); }
  .rcp-ratio input[type="range"] { width: 100%; accent-color: var(--accent); }
  .rcp-ratio b { font-family: var(--font-mono); font-size: 8.5px; font-weight: 500; text-align: right; color: var(--fg); font-variant-numeric: tabular-nums; }
  .rcp-ratio-foot { display: flex; align-items: center; gap: 6px; }
  .rcp-ratio-foot span { flex: 1; font-size: 8.5px; line-height: 1.55; color: var(--muted); }
  .rcp-reset { flex: none; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 8.5px; }
  .rcp-reset:hover { border-color: var(--accent-line); color: var(--accent-bright); }
  .rcp-total { display: flex; align-items: center; justify-content: space-between; padding-top: 7px; border-top: 1px dashed var(--border); font-size: 8.5px; color: var(--muted); }
  .rcp-total b { font-family: var(--font-mono); font-size: 10px; color: var(--accent-bright); font-weight: 600; }
  .rcp-specs { display: flex; flex-wrap: wrap; gap: 4px; }
  .rcp-spec { display: inline-flex; align-items: center; gap: 2px; padding: 2px 3px 2px 7px; border-radius: 999px; border: 1px solid var(--border); background: var(--ink-soft); font-size: 9.5px; color: var(--fg); }
  .rcp-spec button { width: 14px; height: 14px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-size: 11px; line-height: 1; }
  .rcp-spec button:hover { color: var(--accent-bright); background: var(--accent-soft); }
  .rcp-empty { font-size: 9px; color: var(--muted); }
  .rcp-add { display: flex; gap: 5px; }
  .rcp-add input { flex: 1; min-width: 0; padding: 5px 8px; border: 1px solid var(--border); border-radius: 7px; background: var(--ink-soft); color: var(--fg); font: inherit; font-size: 10.5px; }
  .rcp-add input::placeholder { color: var(--muted); opacity: .8; }
  .rcp-add input:focus { outline: 0; border-color: var(--accent-line); }
  .rcp-add .rcp-addbtn { flex: none; padding: 5px 9px; border-radius: 7px; border: 1px solid var(--border); background: transparent; color: var(--accent-bright); font-size: 9.5px; }
  .rcp-add .rcp-addbtn:hover { border-color: var(--accent-line); background: var(--accent-soft); }
  .rcp-hint { font-size: 8.5px; line-height: 1.6; color: var(--muted); }

  /* ─── 统计面板 ─────────────────────────────────────────────────── */
  .stat-wrap { display: flex; flex-direction: column; gap: 12px; padding: 4px 2px 14px; }
  .stat-hero { padding: 12px; border: 1px solid var(--border); border-radius: var(--r-md); background: linear-gradient(150deg, var(--accent-soft), var(--ink-soft) 64%); }
  .stat-hero-k { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .12em; color: var(--muted); }
  .stat-hero b { display: block; margin-top: 2px; font-family: var(--font-mono); font-size: 30px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat-hero small { font-size: 10px; color: var(--muted); margin-left: 4px; }
  .stat-goal { margin-top: 9px; display: flex; flex-direction: column; gap: 5px; }
  .stat-goal-line { display: flex; align-items: center; gap: 6px; font-size: 9.5px; color: var(--muted); }
  .stat-goal-line input { width: 66px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--ink-soft); color: var(--fg); font-family: var(--font-mono); font-size: 9.5px; }
  .stat-goal-line input:focus { outline: 0; border-color: var(--accent-line); }
  .stat-track { height: 4px; border-radius: 999px; background: var(--ink-soft); overflow: hidden; }
  .stat-track i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .stat-cell { padding: 8px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--ink-soft); }
  .stat-cell span { display: block; font-size: 8.5px; color: var(--muted); letter-spacing: .04em; }
  .stat-cell b { display: block; margin-top: 2px; font-family: var(--font-mono); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat-cell small { font-size: 8px; color: var(--muted); font-weight: 400; }
  .stat-chart { display: flex; flex-direction: column; gap: 5px; }
  .stat-chart-head { display: flex; align-items: baseline; justify-content: space-between; font-size: 10px; color: var(--muted); }
  .stat-chart-head b { color: var(--fg); font-weight: 600; }
  .stat-bar-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) 40px; align-items: center; gap: 7px; }
  .stat-bar-row span { font-family: var(--font-mono); font-size: 8.5px; color: var(--muted); }
  .stat-bar-row em { font-family: var(--font-mono); font-size: 8.5px; font-style: normal; color: var(--muted); text-align: right; }
  .stat-bar-track { height: 5px; border-radius: 999px; background: var(--ink-soft); overflow: hidden; }
  .stat-bar-track i { display: block; height: 100%; border-radius: inherit; background: color-mix(in oklch, var(--accent) 74%, var(--fg)); }
  .stat-bar-row.is-cur .stat-bar-track i { background: var(--accent-bright); }
  .stat-bar-row.is-cur span, .stat-bar-row.is-cur em { color: var(--fg); }
  .stat-note { font-size: 9px; line-height: 1.6; color: var(--muted); opacity: .9; }

  /* ─── AI 模块：候选 / 建议 / 对话 ────────────────────────────────── */
  .chat-clear { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 9px; }
  .chat-clear:hover { border-color: var(--accent-line); color: var(--accent-bright); }
  .cand-list { display: flex; flex-direction: column; gap: 7px; }
  .cand { padding: 8px 9px; border: 1px solid var(--border); border-radius: 9px; background: color-mix(in oklch, var(--surface) 45%, transparent); }
  .cand-top { display: flex; align-items: center; gap: 6px; }
  .cand-idx { flex: none; width: 16px; height: 16px; display: grid; place-items: center; border-radius: 4px; border: 1px solid var(--border); font-family: var(--font-mono); font-size: 7.5px; color: var(--muted); }
  .cand-title { flex: 1; min-width: 0; font-size: 11px; font-weight: 600; }
  .cand-tags { flex: none; font-family: var(--font-mono); font-size: 7.5px; color: var(--muted); }
  .cand-note { margin-top: 4px; font-size: 9px; line-height: 1.5; color: var(--muted); }
  .cand-text { margin-top: 6px; padding: 6px 8px; border-left: 2px solid var(--accent-line); background: var(--ink-soft); font-family: var(--font-display); font-size: 11.5px; line-height: 1.8; color: var(--fg); }
  .cand-acts { display: flex; gap: 5px; margin-top: 6px; }
  .mini-btn { display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 9px; }
  .mini-btn:hover { border-color: var(--accent-line); color: var(--accent-bright); }
  .mini-btn svg { width: 10px; height: 10px; }
  .ai-empty { padding: 16px 12px; text-align: center; border: 1px dashed var(--ink-dash); border-radius: 9px; font-size: 10px; line-height: 1.65; color: var(--muted); }
  .work-pulse { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; color: var(--muted); }
  .work-pulse i { width: 5px; height: 5px; border-radius: 999px; background: var(--accent-bright); animation: pulse .9s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  .sug { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
  .sug-k { font-family: var(--font-mono); font-size: 7.5px; letter-spacing: .1em; color: var(--muted); }
  .sug-opt { display: flex; align-items: baseline; gap: 7px; width: 100%; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--border); background: transparent; color: var(--fg); font-size: 10.5px; text-align: left; line-height: 1.5; transition: .14s; }
  .sug-opt:hover { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-bright); }
  .sug-opt i { flex: none; font-family: var(--font-mono); font-style: normal; font-size: 7.5px; color: var(--muted); letter-spacing: .04em; }
  .ctx-tag { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 5px; border: 1px solid var(--border); font-size: 8px; color: var(--muted); }
  .ctx-tag.is-on { border-color: var(--accent-line); color: var(--accent-bright); background: var(--accent-soft); }

  /* ─── 对话列 ───────────────────────────────────────────────────── */
  .chat-stream { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 11px; scrollbar-width: thin; scrollbar-color: var(--ink-hair) transparent; }
  .chat-stream::-webkit-scrollbar { width: 7px; }
  .chat-stream::-webkit-scrollbar-thumb { background: var(--ink-hair); border-radius: 999px; }
  .chat-msg { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .chat-msg.is-user { align-items: flex-end; }
  .chat-name { font-family: var(--font-mono); font-size: 8px; letter-spacing: .1em; color: var(--muted); }
  .chat-bubble { max-width: 100%; padding: 8px 10px; border-radius: 3px 10px 10px 10px; border: 1px solid var(--border); background: color-mix(in oklch, var(--surface) 55%, transparent); font-size: 11.5px; line-height: 1.75; }
  .chat-msg.is-user .chat-bubble { max-width: 92%; border-radius: 10px 3px 10px 10px; border-color: var(--accent-line); background: var(--accent-soft); }
  .chat-bubble b { color: var(--accent-bright); font-weight: 600; }
  .chat-bubble em { font-style: normal; color: var(--muted); }
  .chat-bubble .cand { margin-top: 7px; }
  .chat-bubble .cand-text { font-size: 11px; }
  .chat-chips { flex: none; display: flex; flex-wrap: wrap; gap: 5px; padding: 5px 12px 0; }
  .chip { padding: 4px 9px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 10px; transition: .14s; }
  .chip:hover { background: var(--ink-soft); color: var(--fg); border-color: var(--ink-hair); }
  .chat-composer { flex: none; padding: 7px 12px 12px; }
  .chat-web { flex: none; align-self: flex-end; margin: 0 4px 6px 0; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: var(--font-mono); font-size: 8.5px; letter-spacing: 0.06em; }
  .chat-web.is-on { color: var(--accent-bright); border-color: var(--accent-line); background: var(--accent-soft); }
  .chat-box { display: flex; align-items: flex-end; gap: 6px; padding: 7px 7px 7px 10px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); }
  .chat-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .chat-box textarea { flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; font-size: 12px; line-height: 1.6; max-height: 80px; min-height: 20px; }
  .chat-box textarea::placeholder { color: var(--muted); }
  .chat-send { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 7px; border: 1px solid var(--accent-line); background: var(--accent); color: var(--accent-ink); }
  .chat-send svg { width: 13px; height: 13px; }

  /* ─── 划选工具条 / 替换 / 查找 ─────────────────────────────────── */
  .sel-tools {
    position: fixed; z-index: 75; display: flex; align-items: center; gap: 1px; padding: 4px;
    border: 1px solid var(--ink-hair); border-radius: 10px; background: var(--surface);
    box-shadow: 0 12px 32px oklch(0% 0 0 / .48);
  }
  .sel-tools[hidden] { display: none !important; }
  .sel-btn { padding: 5px 8px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 11px; white-space: nowrap; }
  .sel-btn:hover { background: var(--ink-soft); color: var(--fg); }
  .sel-btn.is-strong { color: var(--accent-bright); }
  .sel-sep { width: 1px; height: 16px; margin: 0 3px; background: var(--border); }
  .sel-pop {
    position: fixed; z-index: 76; width: 220px; padding: 10px;
    border: 1px solid var(--ink-hair); border-radius: var(--r-md); background: var(--surface);
    box-shadow: 0 16px 40px oklch(0% 0 0 / .5);
  }
  .sel-pop[hidden] { display: none !important; }
  .sel-pop-title { font-size: 10.5px; font-weight: 600; margin-bottom: 7px; color: var(--fg); }
  .sel-pop-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .sel-pop input { width: 100%; min-width: 0; padding: 5px 7px; border: 1px solid var(--border); border-radius: 6px; background: var(--ink-soft); color: var(--fg); font: inherit; font-size: 11px; }
  .sel-pop input:focus { outline: 0; border-color: var(--accent-line); }
  .sel-pop-acts { display: flex; gap: 6px; justify-content: flex-end; }
  .find-pop {
    position: absolute; top: 46px; right: 18px; z-index: 30; width: 256px; padding: 10px;
    border: 1px solid var(--ink-hair); border-radius: var(--r-md); background: var(--surface);
    box-shadow: 0 16px 40px oklch(0% 0 0 / .5);
  }
  .find-pop[hidden] { display: none !important; }
  .find-pop-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .find-pop input { flex: 1; min-width: 0; padding: 5px 7px; border: 1px solid var(--border); border-radius: 6px; background: var(--ink-soft); color: var(--fg); font: inherit; font-size: 11px; }
  .find-pop input:focus { outline: 0; border-color: var(--accent-line); }
  .find-pop-foot { display: flex; align-items: center; gap: 6px; }
  .find-pop-note { flex: 1; font-size: 9px; line-height: 1.4; color: var(--muted); }
  .paper-head { position: relative; }
  .paper-tools { flex: none; display: flex; gap: 5px; padding-bottom: 2px; }
  .icon-btn.is-sm { width: 30px; height: 30px; }
  .icon-btn.is-sm svg { width: 15px; height: 15px; }
  .studio.focus { grid-template-columns: 66px minmax(0, 1fr); }
  .studio.focus .files, .studio.focus .ai { display: none; }
  .studio.focus .paper { grid-column: 2; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; z-index: 100; transform: translate(-50%, 10px);
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--ink-hair);
    background: var(--surface); color: var(--fg); font-size: 11.5px;
    box-shadow: 0 12px 32px oklch(0% 0 0 / .45); opacity: 0; pointer-events: none;
    transition: opacity .16s ease, transform .16s ease;
  }
  .toast.is-on { opacity: 1; transform: translate(-50%, 0); }

  /* dialogs / popover */
  .rel { position: relative; }
  .pop { position: absolute; top: 44px; right: 0; width: 280px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: 0 16px 40px oklch(0% 0 0 / 0.45); padding: 7px; z-index: 60; display: none; }
  .pop.open { display: block; }
  .pop-empty { padding: 24px 16px; text-align: center; font-size: 12.5px; color: var(--muted); border: 1px dashed var(--ink-dash); border-radius: var(--r-sm); }

  /* ─── 全自动接管条 ───────────────────────────────────────────────── */
  .auto-strip { flex: none; display: flex; align-items: center; gap: 7px; padding: 6px 12px; border-bottom: 1px solid var(--border); background: var(--ink-soft); }
  .auto-toggle { flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px 3px 5px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .06em; transition: .14s; }
  .auto-toggle:hover { border-color: var(--ink-hair); color: var(--fg); }
  .auto-toggle .dot { position: relative; width: 18px; height: 9px; border-radius: 999px; background: var(--ink-soft); border: 1px solid var(--border); transition: .14s; }
  .auto-toggle .dot i { position: absolute; top: 1px; left: 1px; width: 5px; height: 5px; border-radius: 999px; background: var(--muted); transition: .14s; }
  .auto-toggle.is-on { border-color: var(--accent-line); color: var(--accent-bright); background: var(--accent-soft); }
  .auto-toggle.is-on .dot { border-color: var(--accent-line); background: color-mix(in oklch, var(--accent) 30%, transparent); }

  .auto-pause { flex: none; display: none; align-items: center; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: var(--font-mono); font-size: 8.5px; letter-spacing: 0.06em; transition: 0.14s; }

  .outline-edit { display: flex; flex-direction: column; gap: 8px; height: 100%; padding: 4px; }
  .outline-edit textarea { flex: 1; min-height: 340px; resize: vertical; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--fg); font: inherit; font-size: 12.5px; line-height: 1.85; padding: 10px 12px; outline: none; }
  .outline-edit textarea:focus { border-color: var(--accent-line); }

  /* ─── 立意调配 ───────────────────────────────────────────────────── */
  .fs-ai { display: flex; flex-direction: column; gap: 7px; padding: 10px; border: 1px solid var(--accent-line); border-radius: var(--r-md); background: linear-gradient(155deg, var(--accent-soft), var(--ink-soft) 70%); }

  .fs-ai-btn { flex: none; padding: 5px 9px; border-radius: 7px; border: 1px solid var(--accent-line); background: var(--accent); color: var(--accent-ink); font-size: 9.5px; font-weight: 500; }

  /* ─── 素材：实时派生 ─────────────────────────────────────────────── */

  .mats-sync { display: flex; align-items: center; gap: 6px; padding: 8px 9px; border: 1px solid var(--border); border-radius: 9px; background: linear-gradient(150deg, var(--accent-soft), var(--ink-soft) 72%); }
  .mats-sync-k { flex: 1; min-width: 0; font-size: 9px; line-height: 1.45; color: var(--muted); }
  .mats-sync-k b { display: block; font-size: 10px; color: var(--fg); font-weight: 600; }
  .mats-sync-k span { display: block; margin-top: 1px; }
  .mats-auto { flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 8.5px; }
  .mats-auto.is-on { border-color: var(--accent-line); color: var(--accent-bright); background: var(--accent-soft); }
  .mats-syncbtn { flex: none; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--accent-line); background: var(--accent-soft); color: var(--accent-bright); font-size: 9px; }
  .mat-row { padding: 8px 9px; border-bottom: 1px solid var(--border); }

  .mat-top { display: flex; align-items: center; gap: 6px; }
  .mat-tag { flex: none; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border); font-family: var(--font-mono); font-size: 7.5px; color: var(--muted); letter-spacing: .04em; }
  .mat-title { flex: 1; min-width: 0; font-size: 11.5px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mat-body { margin-top: 3px; font-size: 9.5px; line-height: 1.6; color: var(--muted); }
  .mat-live-dot { flex: none; width: 5px; height: 5px; border-radius: 999px; background: var(--accent-bright); opacity: .8; }

  /* ─── 导出弹层 ───────────────────────────────────────────────────── */
  .export-pop { width: 312px; padding: 12px; }
  .exp-k { font-family: var(--font-mono); font-size: 8px; letter-spacing: .14em; color: var(--muted); }
  .exp-title { margin-top: 2px; font-family: var(--font-display); font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .exp-field { margin-top: 9px; display: flex; flex-direction: column; gap: 4px; }
  .exp-label { font-size: 9px; color: var(--muted); }
  .exp-seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .exp-opt { padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 9.5px; }
  .exp-opt:hover { border-color: var(--ink-hair); color: var(--fg); }
  .exp-opt.is-on { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-bright); }
  .exp-note { margin-top: 8px; font-size: 8.5px; line-height: 1.55; color: var(--muted); }
  .exp-go { width: 100%; margin-top: 9px; padding: 7px; border-radius: 8px; border: 1px solid var(--accent-line); background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 600; }
  .exp-go:hover { background: var(--accent-deep); }
  .exp-foot { margin-top: 6px; text-align: center; font-size: 8px; color: var(--muted); }

  /* ─── 阅读模式：默认右翻，可切上下翻 ─────────────────────────────── */
  .reader { position: fixed; inset: 0; z-index: 90; display: flex; flex-direction: column; background: color-mix(in oklch, var(--bg) 94%, transparent); }
  .reader[hidden] { display: none !important; }
  .reader-head { flex: none; display: flex; align-items: center; gap: 14px; padding: 12px 22px; border-bottom: 1px solid var(--border); background: color-mix(in oklch, var(--scrim) 48%, transparent); }
  .reader-meta { flex: 1; min-width: 0; }
  .reader-book { font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reader-ch { margin-top: 1px; font-family: var(--font-mono); font-size: 9px; color: var(--muted); letter-spacing: .06em; }
  .reader-tools { flex: none; display: flex; align-items: center; gap: 9px; }
  .reader-mode { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 999px; }
  .reader-mode-btn { padding: 3px 9px; border-radius: 999px; border: 0; background: transparent; color: var(--muted); font-size: 9.5px; }
  .reader-mode-btn.is-on { background: var(--accent-soft); color: var(--accent-bright); }
  .reader-progress { font-family: var(--font-mono); font-size: 9px; color: var(--muted); letter-spacing: .04em; }
  .reader-body { position: relative; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--ink-hair) transparent; }
  .reader-body::-webkit-scrollbar { width: 8px; }
  .reader-body::-webkit-scrollbar-thumb { background: var(--ink-hair); border-radius: 999px; }
  .reader-sheet { max-width: 760px; margin: 0 auto; padding: 48px 64px 96px; }
  .reader-sheet h1 { font-family: var(--font-display); font-size: 26px; font-weight: 600; letter-spacing: .05em; margin-bottom: 10px; }
  .reader-sheet h2 { margin: 42px 0 14px; padding-bottom: 7px; border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: 9px; font-weight: 500; letter-spacing: .14em; color: var(--muted); }
  .reader-sheet .reader-vol { margin-top: 30px; }
  .reader-sheet .reader-chapter { margin-top: 16px; }
  .reader-sheet h3 { margin: 34px 0 12px; font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: .04em; }
  .reader-sheet p { margin: 0 0 1.25em; font-family: var(--font-display); font-size: 17px; line-height: 2.05; letter-spacing: .025em; color: var(--fg); text-indent: 2em; }
  .reader-sheet .ph-note, .reader-sheet .reader-empty { color: var(--muted); font-style: italic; }
  .reader-sheet .reader-empty { padding: 30px 0; font-size: 13px; }
  .reader-page { animation: readerIn .28s ease; }
  @keyframes readerIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
  .reader-turn { position: absolute; top: 0; bottom: 0; width: 13%; z-index: 2; display: grid; place-items: center; border: 0; background: transparent; color: var(--muted); opacity: 0; transition: opacity .16s ease; }
  .reader-turn:hover { opacity: .75; background: linear-gradient(90deg, var(--ink-soft), transparent); }
  .reader-turn.right:hover { background: linear-gradient(270deg, var(--ink-soft), transparent); }
  .reader-turn.left { left: 0; }
  .reader-turn.right { right: 0; }
  .reader-turn svg { width: 26px; height: 26px; }
  .reader.is-scroll .reader-turn { display: none; }
  .reader.is-scroll .reader-sheet { padding-top: 32px; }
  .reader-foot { flex: none; display: flex; align-items: center; gap: 8px; padding: 9px 22px; border-top: 1px solid var(--border); background: color-mix(in oklch, var(--scrim) 46%, transparent); font-size: 9px; color: var(--muted); }
  .reader-foot .spacer { flex: 1; }
  .reader.is-scroll .reader-foot .mini-btn { opacity: .55; }
  .reader-turn:disabled { opacity: 0; pointer-events: none; }
  .reader-foot .mini-btn:disabled { opacity: .4; pointer-events: none; }

  /* ─── adapt ──────────────────────────────────────────────────────── */
  @media (max-width: 1380px) { .studio { grid-template-columns: 66px 268px minmax(0, 1fr) 312px; } }
  @media (max-width: 1240px) {
    /* AI panel leaves the grid and becomes a toggled overlay */
    .studio { grid-template-columns: 66px 262px minmax(0, 1fr); }
    .ai {
      position: absolute; top: 58px; right: 0; bottom: 0; width: 336px; z-index: 40;
      box-shadow: -20px 0 44px oklch(0% 0 0 / 0.5);
      transform: translateX(102%); transition: transform .2s ease;
    }
    .studio.show-ai .ai { transform: none; }
  }
  @media (max-width: 900px) {
    .studio { grid-template-columns: 62px minmax(0, 1fr); grid-template-rows: 56px minmax(0, 1fr); }
    .files { display: none; }
    .paper { grid-column: 2; }
    .doc-title { font-size: 18px; }
    .paper-head, .sheet, .statusbar { padding-left: 18px; padding-right: 18px; }
  }
  @media (max-width: 620px) {
    body { overflow: auto; }
    .studio { height: auto; min-height: 100vh; }
    .sheet, .ai-stream { overflow: visible; }
    .bg-photo, .bg-scrim { position: absolute; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ─── 模式：从开书向导带进来的题材特色 ─────────────────────────── */
  .mode-chip { display: inline-flex; align-items: center; gap: 6px; flex: none; max-width: 220px;
    padding: 4px 11px; border-radius: 999px; border: 1px solid var(--accent-line);
    background: var(--accent-soft); font-size: 12px; color: var(--fg); }
  .mode-chip[hidden] { display: none; }
  .mode-chip b { font-weight: 600; color: var(--accent-bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mode-chip i { font-style: normal; color: var(--muted); font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; }
  .mode-strip { flex: none; display: none; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .mode-strip.is-on { display: flex; }
  .ms-label { flex: none; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; color: var(--muted); }
  .ms-chips { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
  .mstrip-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--ink-soft); color: var(--fg); font-size: 11.5px;
    transition: border-color 0.14s ease, background 0.14s ease, color 0.14s ease; }
  .mstrip-chip svg { width: 13px; height: 13px; color: var(--muted); }
  .mstrip-chip:hover { border-color: var(--ink-hair); }
  .mstrip-chip.is-cur { border-color: var(--accent-line); background: var(--accent-soft); }
  .mstrip-chip.is-cur svg { color: var(--accent-bright); }
</style>

<script>
(function () {

  var ICON_BOX = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8h16v11H4z"/><path d="M4 8l2-3h12l2 3M9 12h6"/></svg>';
  var ICON_NOTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h14v16H5z"/><path d="M9 8h6M9 12h6"/></svg>';
  var ICON_PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>';
  var ICON_INSERT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v10M8 10l4 4 4-4"/><path d="M5 18h14"/></svg>';
  var ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M5 15V6a1 1 0 0 1 1-1h9"/></svg>';
  var CARET = '<span class="vol-caret"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></span>';

  /* ── 作品与章节（默认空稿；有创作页草稿时按下文同步） ───────────── */
  var BOOK = {
    name: '未命名作品',
    volumes: [
      { v: '第一卷 · 起', ch: [
        { id: 'c1', t: '第一章 · 未命名', body: '' }
      ]}
    ]
  };
  // 旧版设计稿里的示例占位段，载入真实项目时自动当作空章清理
  var DEMO_BODY = '<p class="ph-note">（示例占位段落——开始写作后可直接覆盖。）</p><p>天色渐沉时，他回到了那条旧街。石板缝里积着水，映出一线灰白的天。风从巷口吹过来，带着远处市集的嘈杂，又慢慢散在屋瓦之间。</p><p>他站了一会儿，没有急着推门。</p>';

  /* ── 后端接入：项目数据 + AI ───────────────────────────────────── */
  var QB_PROJ = ''; try { QB_PROJ = new URLSearchParams(location.search).get('project') || localStorage.getItem('qibi.project') || ''; } catch (e) { }
  var QB_AUTOWRITE = 0; try { QB_AUTOWRITE = parseInt(new URLSearchParams(location.search).get('autowrite'), 10) || 0; } catch (e) { }
  // 等后端项目载入完成后再允许回写，避免把默认空稿/旧示例写进真实项目
  var QB_READY = !QB_PROJ;
  function apiJSON(path, opt) {
    return fetch('' + path, opt).then(function (r) { return r.json(); });
  }

  /* ── 创作页 → 左栏 1:1 数据源 ───────────────────────────────────── */
  var FREE_KEY = 'qibi.free.setup';
  var FREE_BOOK_KEY = 'qibi.free.book';
  var PANELS = {
    people: { title: '人物', add: '添加人物', field: '人物设定' },
    lore: { title: '设定', add: '新建设定', field: '世界观与设定' },
    outline: { title: '大纲', add: '编辑大纲', field: '大纲' },
    mats: { title: '素材', add: '新建素材', field: '参考素材' },
    notes: { title: '笔记', add: '新建笔记', field: '大纲与笔记' }
  };
  function readCreation() {
    var c = {
      has: false, title: '', intro: '', cast: '', world: '', outline: '', hookLine: '',
      hookTypes: [], hookTypesSet: false, hookDensity: '每章', ratios: null,
      refs: [], tplImports: [], genres: [], templates: [], specials: [],
      span: 'chapters', n: 0, w: 0, mode: '', imported: null
    };
    var d = null;
    try { var raw = localStorage.getItem(FREE_KEY); if (raw) d = JSON.parse(raw); } catch (e) {}
    if (d && typeof d === 'object') {
      c.mode = d.mode === 'continue' ? 'continue' : 'zero';
      c.title = typeof d.title === 'string' ? d.title.slice(0, 48) : '';
      c.intro = typeof d.intro === 'string' ? d.intro : '';
      c.cast = typeof d.cast === 'string' ? d.cast : '';
      c.world = typeof d.world === 'string' ? d.world : '';
      c.outline = typeof d.outline === 'string' ? d.outline : '';
      c.hookLine = typeof d.hookLine === 'string' ? String(d.hookLine) : '';
      c.hookTypesSet = Array.isArray(d.hookTypes);
      c.hookTypes = c.hookTypesSet ? d.hookTypes.filter(function (t) { return typeof t === 'string' && t.trim(); }).slice(0, 10) : [];
      c.hookDensity = ['每章', '每两章', '每三章', '随机'].indexOf(d.hookDensity) >= 0 ? d.hookDensity : '每章';
      c.ratios = d.ratios && typeof d.ratios === 'object' && !Array.isArray(d.ratios) ? d.ratios : null;
      if (Array.isArray(d.refs)) d.refs.forEach(function (r) { if (r && r.name) c.refs.push({ name: String(r.name).slice(0, 200), chars: Math.max(0, parseInt(r.chars, 10) || 0) }); });
      if (Array.isArray(d.tplImports)) d.tplImports.forEach(function (r) { if (r && r.name) c.tplImports.push({ name: String(r.name).slice(0, 200), chars: Math.max(0, parseInt(r.chars, 10) || 0) }); });
      c.genres = Array.isArray(d.genres) ? d.genres.slice(0, 24) : [];
      c.templates = Array.isArray(d.templates) ? d.templates.slice(0, 20) : [];
      c.specials = Array.isArray(d.specials) ? d.specials.filter(function (t) { return typeof t === 'string' && t.trim(); }).map(function (t) { return t.trim().slice(0, 24); }).filter(Boolean).slice(0, 40) : [];
      c.span = d.span === 'book' ? 'book' : 'chapters';
      c.n = Math.max(0, parseInt(d.n, 10) || 0);
      c.w = Math.max(0, parseInt(d.w, 10) || 0);
      if (d.book && d.book.name) {
        c.imported = {
          name: String(d.book.name).slice(0, 120),
          chars: Math.max(0, parseInt(d.book.chars, 10) || 0),
          chapters: Math.max(0, parseInt(d.book.chapters, 10) || 0),
          titles: Array.isArray(d.book.titles) ? d.book.titles.slice(0, 60) : []
        };
      }
    }
    c.has = !!(c.title || c.intro || c.cast || c.world || c.outline || c.refs.length || c.tplImports.length || c.genres.length || c.templates.length || c.imported);
    return c;
  }
  var CREATION = readCreation();

  /* ── 配方：钩子 / 叙事配比 / 特殊因素（与创作页 07–09 同步） ───── */
  var RATIO_KEYS = ['character', 'setting', 'psychology', 'narrative', 'narration'];
  var RATIO_NAMES = { character: '人物', setting: '环境', psychology: '心理', narrative: '叙事', narration: '旁白' };
  var RATIO_DEF = { character: 30, setting: 15, psychology: 20, narrative: 25, narration: 10 };
  var HOOK_TYPES = ['悬念', '冲突', '反差', '情感钩子', '危机', '秘密', '新人物登场', '章末断章', '内心独白'];
  var HOOK_DENSITIES = ['每章', '每两章', '每三章', '随机'];
  var HOOK_CAP = 10;

  function normRatios(r) {
    var out = {}, raw = [], sum = 0;
    RATIO_KEYS.forEach(function (k) {
      var v = Math.max(0, Math.min(100, Math.round(Number(r && r[k]) || 0)));
      out[k] = v; sum += v; raw.push(v);
    });
    if (!sum) {
      RATIO_KEYS.forEach(function (k) { out[k] = RATIO_DEF[k]; });
      return out;
    }
    var scaled = raw.map(function (v) { return v * 100 / sum; });
    var flo = scaled.map(Math.floor);
    var acc = flo.reduce(function (a, b) { return a + b; }, 0);
    var order = scaled.map(function (v, i) { return [v - Math.floor(v), i]; })
      .sort(function (a, b) { return b[0] - a[0]; });
    for (var i = 0; i < 100 - acc; i++) flo[order[i % flo.length][1]]++;
    RATIO_KEYS.forEach(function (k, i) { out[k] = flo[i]; });
    return out;
  }
  function setRecipeRatio(key, val) {
    val = Math.max(0, Math.min(100, Math.round(val)));
    var others = RATIO_KEYS.filter(function (k) { return k !== key; });
    var oldSum = others.reduce(function (s, k) { return s + recipe.ratios[k]; }, 0);
    var target = 100 - val;
    var next = {};
    next[key] = val;
    if (!target) {
      others.forEach(function (k) { next[k] = 0; });
    } else if (!oldSum) {
      var base = Math.floor(target / others.length);
      var rem = target - base * others.length;
      others.forEach(function (k, i) { next[k] = base + (i < rem ? 1 : 0); });
    } else {
      var raw = {}, flo = {}, acc = 0;
      others.forEach(function (k) {
        raw[k] = recipe.ratios[k] * target / oldSum;
        flo[k] = Math.floor(raw[k]);
        acc += flo[k];
      });
      var rem2 = target - acc;
      others.slice().sort(function (a, b) {
        return (raw[b] - flo[b]) - (raw[a] - flo[a]);
      }).forEach(function (k, i) {
        if (i < rem2) flo[k]++;
      });
      others.forEach(function (k) { next[k] = flo[k]; });
    }
    RATIO_KEYS.forEach(function (k) { recipe.ratios[k] = next[k]; });
  }

  var recipe = {
    hookLine: CREATION.hookLine,
    hookTypes: CREATION.hookTypesSet ? CREATION.hookTypes.slice() : ['悬念'],
    hookDensity: CREATION.hookDensity,
    specials: CREATION.specials.slice(),
    ratios: normRatios(CREATION.ratios)
  };
  var recipeSaveTimer = 0;

  function saveRecipeNow() {
    try {
      var raw = localStorage.getItem(FREE_KEY), d = null;
      try { if (raw) d = JSON.parse(raw); } catch (e) {}
      if (!d || typeof d !== 'object' || Array.isArray(d)) d = {};
      d.hookLine = recipe.hookLine;
      d.hookTypes = recipe.hookTypes.slice();
      d.hookDensity = recipe.hookDensity;
      d.ratios = {};
      RATIO_KEYS.forEach(function (k) { d.ratios[k] = recipe.ratios[k]; });
      d.specials = recipe.specials.slice();
      localStorage.setItem(FREE_KEY, JSON.stringify(d));
    } catch (e) {}
    CREATION.hookLine = recipe.hookLine;
    CREATION.hookTypes = recipe.hookTypes.slice();
    CREATION.hookDensity = recipe.hookDensity;
    CREATION.ratios = {};
    RATIO_KEYS.forEach(function (k) { CREATION.ratios[k] = recipe.ratios[k]; });
    CREATION.specials = recipe.specials.slice();
  }
  function saveRecipeSoon() {
    if (recipeSaveTimer) clearTimeout(recipeSaveTimer);
    recipeSaveTimer = setTimeout(function () { recipeSaveTimer = 0; saveRecipeNow(); }, 260);
  }

  function splitRows(s, cap) {
    var out = [];
    String(s || '').split(/\r?\n|[；;]/).forEach(function (line) {
      line = line.trim().replace(/^[-·•*]\s*/, '');
      if (!line) return;
      if (line.length > 64) line = line.slice(0, 64) + '…';
      if (out.length < (cap || 40)) out.push(line);
    });
    return out;
  }
  function creationPlan() {
    if (!CREATION.has) return '';
    if (CREATION.imported) return '续写《' + CREATION.imported.name + '》' + (CREATION.imported.chapters ? ' · 原书 ' + CREATION.imported.chapters + ' 章' : '');
    if (CREATION.span === 'book') return '整本长篇' + (CREATION.n ? ' · 计划 ' + CREATION.n + ' 章' : '');

  var CHAPTERS = [];
  function rebuildChapters() {
    CHAPTERS.length = 0;
    BOOK.volumes.forEach(function (vol) { vol.ch.forEach(function (c) { CHAPTERS.push(c); }); });
  }
  function chapterById(id) { for (var i = 0; i < CHAPTERS.length; i++) if (CHAPTERS[i].id === id) return CHAPTERS[i]; return null; }
  /* 每部作品单独记住「上次停在哪一章」：否则每次进创作台都退回第一章，续写也跟着写错章 */
  function lastChapterKey() { return 'qibi.studio.ch.' + (QB_PROJ || 'local'); }
  function rememberChapter(id) { try { if (id) localStorage.setItem(lastChapterKey(), id); } catch (e) { } }
  function isPlainBody(body) {
    return String(body || '').replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').replace(/\s/g, '').length > 0;
  }
  function preferredChapterId() {
    var saved = '';
    try { saved = localStorage.getItem(lastChapterKey()) || ''; } catch (e) { }
    if (saved && chapterById(saved)) return saved;
    for (var i = CHAPTERS.length - 1; i >= 0; i--) if (isPlainBody(CHAPTERS[i].body)) return CHAPTERS[i].id;
    return CHAPTERS.length ? CHAPTERS[0].id : '';
  }
  function chapterWordCount(c) {
    if (!c.body) return 0;
    return c.body.replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').replace(/\s/g, '').length;
  }
  function escHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function escAttr(s) { return escHtml(s).replace(/'/g, '&#39;'); }
  function cut(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n) + '…' : s; }

  /* ── 作品持久化 ─────────────────────────────────────────────────── */
  var BOOK_KEY = 'qibi.studio.book.v1';
  function saveBook() {
    if (QB_PROJ && !QB_READY) return;
    var payload = {
      name: BOOK.name,
      chapters: CHAPTERS.map(function (c) { return { id: c.id, t: c.t, body: c.body }; })
    };
    try { localStorage.setItem(BOOK_KEY, JSON.stringify(payload)); } catch (e) {}
    if (QB_PROJ) {
      apiJSON('/api/projects/' + QB_PROJ + '/book', {
        method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload)
      }).catch(function () { });
    }
  }
  function loadBook() {
    try {
      var raw = localStorage.getItem(BOOK_KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (!d || typeof d !== 'object') return;
      if (typeof d.name === 'string' && d.name) BOOK.name = d.name;
      var list = Array.isArray(d.chapters) ? d.chapters : [];
      list.forEach(function (pc) {
        if (!pc || typeof pc.id !== 'string') return;
        var c = chapterById(pc.id);
        if (c) {
          if (typeof pc.t === 'string' && pc.t) c.t = pc.t;
          if (typeof pc.body === 'string') c.body = pc.body;
        } else {
          var vol = BOOK.volumes[BOOK.volumes.length - 1];
          var ch = { id: pc.id, t: (typeof pc.t === 'string' && pc.t) ? pc.t : '未命名', body: typeof pc.body === 'string' ? pc.body : '' };
          vol.ch.push(ch); CHAPTERS.push(ch);
        }
      });
    } catch (e) {}
  }
  rebuildChapters();
  var hadBook = false;
  try { hadBook = !!localStorage.getItem(BOOK_KEY); } catch (e) {}
  loadBook();
  if (!hadBook) applyCreationBook();
  rebuildChapters();
  crumbBook.textContent = BOOK.name;

  /* 从后端载入真实作品（覆盖本地示例） */
  var ensuringProject = false;
  /* 只把「名称：描述」这类实体行导入后端；markdown 标题、分割线、字段名不算人物/设定，
     否则左栏会被「## 主角组」「性格」「---」这种行塞满，AI 读到的人物设定也就成了碎屑 */
  function pickEntityLines(text, max) {
    var dup = {};
    var NOISE = /^(性格|异能|口头禅|形象|真实嘴脸|隐藏设定|上辈子|重生后|这辈子|她的悲剧在于|最讽刺的一点|任务逻辑|奖励|惩罚|致命弱点|主角组|系统组|反派组|配角|简介|备注|年龄|身份|外貌|能力|弱点|结局|设定|世界观|时间|地点|持有|伤势|未决)$/;
    return String(text || '').split(/\r?\n/).map(function (s) {
      return s.replace(/^\s*[#>*\-—–\s]+/, '').replace(/\*\*/g, '').replace(/\s+$/, '');
    }).filter(function (s) {
      if (!s || /^[-=_]{2,}$/.test(s)) return false;
      if (NOISE.test(s)) return false;
      var m = s.match(/^([^：:]{1,14})[：:](.{2,})$/);
      if (!m) return false;
      var key = m[1].trim();
      if (!key || NOISE.test(key)) return false;
      if (dup[key]) return false;
      dup[key] = 1;
      return true;
    }).slice(0, max || 40);
  }
  function importCreationToProject(pid) {
    var base = '/api/projects/' + encodeURIComponent(pid);
    var jobs = [];
    var post = function (coll, body) {
      jobs.push(fetch(base + '/' + coll, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).catch(function () { }));
    };
    pickEntityLines(CREATION.cast, 40).forEach(function (t) {
      var p = t.split(/[：:|｜]/);
      post('characters', { name: (p[0] || t).trim().slice(0, 40), desc: t.slice(0, 2000) });
    });
    pickEntityLines(CREATION.world, 40).forEach(function (t) {
      var p = t.split(/[：:|｜]/);
      post('lore', { name: (p[0] || t).trim().slice(0, 40), content: t.slice(0, 2000) });
    });
    if (String(CREATION.outline || '').trim()) post('notes', { kind: 'outline', title: '大纲', content: String(CREATION.outline).slice(0, 100000) });
    (CREATION.refs || []).forEach(function (r) {
      if (!r || !r.name) return;
      post('materials', { cat: '参考资料', type: '导入书目', title: String(r.name).slice(0, 120), content: '' });
    });
    return Promise.all(jobs);
  }
  function ensureBackendProject() {
    if (ensuringProject) return;
    ensuringProject = true;
    var title = (String(CREATION.title || '').trim() || (BOOK.name && BOOK.name !== '未命名作品' ? BOOK.name : '') || '未命名作品').slice(0, 80);
    fetch('/api/projects', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ title: title, intro: String(CREATION.intro || '').slice(0, 5000), mode: '自由创作' })
    }).then(function (r) { return r.json(); }).then(function (p) {
      if (!p || !p.id) throw new Error('创建项目失败');
      QB_PROJ = p.id;
      QB_READY = true;
      try { localStorage.setItem('qibi.project', p.id); } catch (e) { }
      var importList = CHAPTERS.filter(function (c) {
        if (CHAPTERS.length <= 1) return true;
        var t = String(c.t || '').trim();
        var generic = !t || /^第[0-9一二三四五六七八九十百千]+章\s*[·\-—:：、.]?\s*(未命名)?$/.test(t);
        return !(generic && !plainOf(c.body));
      });
      if (!importList.length) importList = CHAPTERS.slice();
      var payload = { name: BOOK.name || title, chapters: importList.map(function (c) { return { id: c.id, t: c.t, body: c.body }; }) };
      return fetch('/api/projects/' + encodeURIComponent(p.id) + '/book', {
        method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload)
      }).then(function () { return importCreationToProject(p.id); }).then(function () { return p.id; });
    }).then(function (pid) {
      ensuringProject = false;
      crumbBook.textContent = BOOK.name;
      chatPush('启笔', '<div class="cand-note">已自动建立项目并同步 ' + CHAPTERS.length + ' 章与左栏的人物/设定/大纲；AI 现在会实时读取这些内容。</div>');
      if (state.mod === 'files') renderFiles(); else renderPanel();
      renderCtx();
    }).catch(function (e) {
      ensuringProject = false;
      chatPush('启笔', '<div class="cand-note">建立项目失败：' + escHtml(String((e && e.message) || e).slice(0, 80)) + '</div>');
    });
  }
  if (QB_PROJ) {
    apiJSON('/api/projects/' + QB_PROJ).then(function (p) {
      if (!p || p.error) { ensureBackendProject(); return; }
      BOOK.name = p.title || BOOK.name;
      var vols = (p.volumes && p.volumes.length)
        ? p.volumes.map(function (v) { return { v: v.title || '卷', ch: [] }; })
        : [{ v: '第一卷', ch: [] }];
      var vidx = {};
      (p.volumes || []).forEach(function (v, i) { vidx[v.id] = i; });
      var demoCleaned = false;
      (p.chapters || []).forEach(function (c) {
        var i = vidx[c.volumeId];
        if (i == null) i = 0;
        var body = c.content || '';
        if (body === DEMO_BODY) { body = ''; demoCleaned = true; }
        vols[i].ch.push({ id: c.id, t: c.title || '未命名', body: body });
      });
      if (!vols.some(function (v) { return v.ch.length; })) {
        vols[0].ch.push({ id: 'c1', t: '第一章 · 未命名', body: '' });
      }
      BOOK.volumes = vols;
      QB_READY = true;
      rebuildChapters();
      crumbBook.textContent = BOOK.name;
      // 起笔页同步来的人物/设定/大纲/参考，回填到创作台面板（以项目数据为准，修复旧项目左栏丢失）
      var beCast = pickEntityLines((p.characters || []).map(function (c) { return (c.name || '') + '：' + (c.desc || c.role || ''); }).join('\n'), 40).join('\n');
      var beWorld = pickEntityLines((p.lore || []).map(function (l) { return (l.name || '') + '：' + (l.content || l.detail || ''); }).join('\n'), 40).join('\n');
      var beOutline = ((p.notes || []).filter(function (n) { return n && n.kind === 'outline'; })[0] || {}).content || '';
      // 左栏以本地（起笔页写下的那份）为准，只有本地为空时才用后端补
      if (beCast && !String(CREATION.cast || '').trim()) { CREATION.cast = beCast; saveCreationField('cast', beCast); }
      if (beWorld && !String(CREATION.world || '').trim()) { CREATION.world = beWorld; saveCreationField('world', beWorld); }
      if (beOutline) CREATION.outline = beOutline;
      if (String(p.intro || '').trim() && String(CREATION.outline || '').indexOf('简介：') < 0) {
        CREATION.outline = '简介：' + String(p.intro).trim() + (CREATION.outline ? '\n\n' + CREATION.outline : '');
      }
      if (String(CREATION.outline || '').trim()) {
        saveCreationField('outline', CREATION.outline);
        // 项目里还没有大纲笔记时，把当前大纲补写回去，避免“大纲消失”
        if (!beOutline) patchOutlineNote();
      }
      var beMats = (p.materials || []).map(function (m) { return m.title; }).filter(Boolean);
      if (beMats.length) {
        CREATION.refs = beMats.slice(0, 20).map(function (n) { return { name: n, chars: 0 }; });
      }
      if (CREATION.cast || CREATION.world || CREATION.outline) CREATION.has = true;
      // 项目名是“未命名作品”时，尝试用创作页标题补齐
      if ((!p.title || p.title === '未命名作品') && CREATION.title) {
        BOOK.name = CREATION.title;
        crumbBook.textContent = BOOK.name;
        fetch('/api/projects/' + encodeURIComponent(QB_PROJ), { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title: CREATION.title }) }).catch(function () { });
      }
      // 续接上次停留的章节（没有记录就落在最后一章有正文的章），不再一律回到第一章
      if (CHAPTERS.length) loadChapter(preferredChapterId() || CHAPTERS[0].id);
      if (demoCleaned) saveBook();
      // 首页选了「生成 N 章」→ 进创作台立即由 AI 托管开写，不再等用户点
      if (QB_AUTOWRITE > 0 && CHAPTERS.every(function (c) { return !plainOf(c.body); })) {
        setTimeout(function () {
          startAutoWrite(QB_AUTOWRITE, '', {
            review: true,
            every: 20
          });
        }, 450);
      } else {
        // 上次没写完就退出：重新进入后自动接着写（暂停状态不自动续）
        try {
          var savedAw = JSON.parse(localStorage.getItem(awStateKey()) || 'null');
          if (savedAw && !savedAw.paused) {
            var empties = CHAPTERS.filter(function (c) { return !plainOf(c.body); }).length;
            if (empties) {
              var remain = Math.max(1, Math.min(empties, (savedAw.total || empties) - (savedAw.done || 0)));
              setTimeout(function () {
                startAutoWrite(CHAPTERS.length, savedAw.guide || '', {
                  review: savedAw.review !== false,
                  every: savedAw.every || 20,
                  words: savedAw.words || 0,
                  limit: remain
                });
              }, 900);
            } else awClearState();
          }
        } catch (e) { }
      }
      docTag.style.display = 'none';
      if (state.mod === 'files') renderFiles(); else renderPanel();
      renderCtx();
      // 旧项目里「第N章 / 未命名」自动按正文起名（每个项目只自动跑一次）
      setTimeout(function () {
        if (autoWrite.running || QB_AUTOWRITE) return;
        var generic = CHAPTERS.filter(function (c) {
          var t = String(c.t || '').trim();
          return /^第[0-9一二三四五六七八九十百千]+章\s*[·\-—:：、.]?\s*(未命名)?$/.test(t) || /^未命名/.test(t);
        });
        if (!generic.length) return;
        var flagKey = 'qibi.autoname.' + (QB_PROJ || 'local');
        try { if (localStorage.getItem(flagKey)) return; localStorage.setItem(flagKey, '1'); } catch (e) { }
        autoNameChapters(generic);
      }, 2600);
    }).catch(function () { ensureBackendProject(); });
  } else {
    setTimeout(ensureBackendProject, 900);
  }

  /* ── 左栏：文稿目录 ─────────────────────────────────────────────── */
  function renderFiles() {
    var q = String(state.q || '').trim();
    var out = q ? '' : creationCardHtml(), shown = 0, all = 0;
    BOOK.volumes.forEach(function (vol, vi) {
      var key = vol.v;
      all += vol.ch.length;
      var matches = vol.ch.filter(function (c) { return !q || c.t.indexOf(q) !== -1; });
      if (q && !matches.length) return;
      var collapsed = q ? false : !!state.volCollapsed[key];
      out += '<div class="vol' + (collapsed ? ' is-collapsed' : '') + '" data-vol="' + escAttr(key) + '">'
        + '<button class="vol-head" aria-expanded="' + (collapsed ? 'false' : 'true') + '">'
        + '<span class="vol-mark"></span><span class="vol-name">' + escHtml(vol.v) + '</span>'
        + '<span class="vol-line"></span><span class="vol-count">' + matches.length + ' 章</span>'
        + CARET + '</button><div class="vol-list">';
      matches.forEach(function (c) {
        var ci = vol.ch.indexOf(c);

          + '<span class="ch-title">' + escHtml(c.t) + '</span>'

  /* ── 统计面板 ───────────────────────────────────────────────────── */
  function statsData() {
    var total = 0, written = 0, longest = 0, longestT = '—', paras = 0, blank = 0;
    var bars = CHAPTERS.map(function (c) {
      var wc = chapterWordCount(c);
      total += wc;
      if (wc > 0) written++; else blank++;
      if (wc > longest) { longest = wc; longestT = c.t; }
      var wrap = document.createElement('div');
      wrap.innerHTML = c.body || '';
      paras += wrap.querySelectorAll('p').length;
      return { t: c.t, wc: wc, cur: c.id === state.ch };
    });
    return {
      total: total, written: written, chapters: CHAPTERS.length,
      avg: written ? Math.round(total / written) : 0,
      longest: longest, longestT: longestT, paras: paras, blank: blank,
      curWc: chapterWordCount(chapterById(state.ch) || {}), bars: bars
    };
  }
  var QB_MEM = null, memBusy = false;
