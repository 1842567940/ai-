<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>启笔 QIBI · 工具工作页</title>
<link rel="icon" type="image/png" href="app-icon.png" />
<style>
  /* ─── tokens — 沿用工作台 (ai-novel-editor-home.html) 的夜色水墨令牌 ──
        工具工作页 = 左 rail（应用导航）· 同组工具列 · 右侧工作区。
        每一件工具挂载一台「引擎」：按词条给功能，互不重样。
        夜的墨、纸白字、一点朱砂；一屏，仅各栏内部滚动。 */
  :root {
    --bg:      oklch(15% 0.010 262);
    --surface: oklch(23% 0.011 262);
    --fg:      oklch(94% 0.006 90);
    --muted:   oklch(73% 0.010 90);
    --border:  oklch(96% 0.006 90 / 0.13);
    --accent:  oklch(55% 0.17 28);

    --ink-soft:      oklch(96% 0.006 90 / 0.055);
    --ink-hair:      oklch(96% 0.006 90 / 0.16);
    --ink-dash:      oklch(96% 0.006 90 / 0.26);
    --accent-soft:   oklch(60% 0.17 28 / 0.17);
    --accent-line:   oklch(62% 0.17 28 / 0.44);
    --accent-ink:    oklch(98% 0.008 30);
    --accent-deep:   oklch(47% 0.16 28);
    --accent-bright: oklch(73% 0.15 32);
    --scrim:         oklch(11% 0.012 262);

    --font-display: 'Iowan Old Style', 'Charter', Georgia, 'Songti SC', 'STSong', 'Source Han Serif SC', 'Noto Serif SC', 'SimSun', serif;
    --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    --font-mono:    ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;

    --r-sm: 9px; --r-md: 12px; --r-lg: 15px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .bg-photo {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: var(--bg) url("%E6%B0%B4%E5%A2%A8%E5%B0%91%E5%A5%B3-%E5%A4%9C%E8%89%B2.png") center / cover no-repeat;
  }
  .bg-scrim {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      linear-gradient(180deg, oklch(9% 0.012 262 / 0.05), transparent 60%, oklch(10% 0.012 262 / 0.03)),
      linear-gradient(103deg, oklch(8% 0.012 262 / 0.05) 0%, oklch(10% 0.012 262 / 0.02) 52%, oklch(12% 0.012 262 / 0) 100%);
  }
  img, svg { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  h1, h2, h3, h4, h5, p { margin: 0; }
  ::selection { background: var(--accent-soft); }

  /* ─── shell ─────────────────────────────────────────────────────── */
  .app {
    position: relative; z-index: 1; height: 100vh;
    display: grid;
    grid-template-columns: 66px 252px minmax(0, 1fr);
    grid-template-rows: 58px minmax(0, 1fr);
  }
  .appbar {
    grid-column: 1 / -1; grid-row: 1;
    display: flex; align-items: center; gap: 14px; padding: 0 18px 0 20px;
    border-bottom: 1px solid var(--border);
    background: var(--scrim);
  }
  .brand { display: flex; align-items: center; gap: 10px; flex: none; }
  .app-icon { width: 34px; height: 34px; flex: none; border-radius: 9px; object-fit: contain; box-shadow: 0 1px 3px oklch(0% 0 0 / 0.45), 0 0 0 1px var(--border); }
  .brand-name { font-family: var(--font-display); font-size: 16px; font-weight: 600; letter-spacing: 0.02em; line-height: 1.1; }
  .brand-sub { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--muted); letter-spacing: 0.14em; margin-top: 1px; }
  .crumb { display: flex; align-items: center; gap: 8px; flex: none; padding-left: 14px; border-left: 1px solid var(--border); font-size: 12.5px; color: var(--muted); }
  .crumb a:hover { color: var(--fg); }
  .crumb-cur { color: var(--fg); font-weight: 500; }
  .appbar-right { display: flex; align-items: center; gap: 9px; flex: none; margin-left: auto; }
  .search { display: flex; align-items: center; gap: 8px; width: 224px; padding: 6px 11px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); background: var(--surface); }
  .search svg { width: 15px; height: 15px; flex: none; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; font-size: 12.5px; }
  .search input::placeholder { color: var(--muted); }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .icon-btn { width: 36px; height: 36px; border-radius: var(--r-sm); flex: none; display: grid; place-items: center; background: transparent; border: 1px solid var(--border); color: var(--muted); transition: background .14s, color .14s, border-color .14s; }
  .icon-btn:hover { background: var(--ink-soft); color: var(--fg); border-color: var(--ink-hair); }
  .icon-btn svg { width: 17px; height: 17px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 15px; border-radius: var(--r-sm); border: 1px solid transparent; font-size: 13.5px; font-weight: 500; transition: background .15s, border-color .15s, color .15s, transform .05s; }
  .btn:active { transform: translateY(1px); }
  .btn svg { width: 15px; height: 15px; }
  .btn-ghost { background: transparent; border-color: var(--border); color: var(--fg); }
  .btn-ghost:hover { background: var(--ink-soft); border-color: var(--ink-hair); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
  .btn-sm { padding: 6px 12px; font-size: 12.5px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  :where(.btn, .icon-btn, .rail-btn, .rel-item, .chip, .cand-act, .lrow, .tier, .node):focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 2px; }

  /* ─── left rail ──────────────────────────────────────────────────── */
  .rail { grid-column: 1; grid-row: 2; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 12px 0 14px; overflow: hidden; border-right: 1px solid var(--border); background: color-mix(in oklch, var(--scrim) 34%, transparent); }
  .rail-btn { width: 54px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; border-radius: 12px; border: 1px solid transparent; background: transparent; color: var(--muted); font-size: 10px; letter-spacing: 0.02em; transition: background .14s, color .14s, border-color .14s; }
  .rail-btn svg { width: 19px; height: 19px; }
  .rail-btn:hover { background: var(--ink-soft); color: var(--fg); }
  .rail-btn.is-active { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-bright); }
  .rail-spacer { flex: 1; }
  .rail-avatar { width: 34px; height: 34px; border-radius: 999px; flex: none; display: grid; place-items: center; color: var(--muted); background: var(--ink-soft); border: 1px dashed var(--ink-dash); }
  .rail-avatar svg { width: 17px; height: 17px; }

  /* ─── 同组工具列 ─────────────────────────────────────────────────── */
  .relnav { grid-column: 2; grid-row: 2; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: color-mix(in oklch, var(--scrim) 44%, transparent); }
  .relnav-head { flex: none; padding: 15px 16px 12px; border-bottom: 1px solid var(--border); }
  .relnav-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: 0.05em; }
  .relnav-sub { font-family: var(--font-mono); font-size: 9.5px; color: var(--muted); letter-spacing: 0.08em; margin-top: 2px; }
  .relnav-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 8px 10px 14px; scrollbar-width: thin; scrollbar-color: var(--ink-hair) transparent; }
  .relnav-scroll::-webkit-scrollbar { width: 8px; }
  .relnav-scroll::-webkit-scrollbar-thumb { background: var(--ink-hair); border-radius: 999px; }
  .rel-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--fg); transition: background .14s, color .14s; }
  .rel-item:hover { background: var(--ink-soft); }
  .rel-item .ic { width: 26px; height: 26px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--ink-soft); color: var(--muted); transition: color .14s; }
  .rel-item .ic svg { width: 15px; height: 15px; }
  .rel-item:hover .ic { color: var(--fg); }
  .rel-item .t { flex: 1; min-width: 0; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rel-item .n { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
  .rel-item.is-on { background: var(--accent-soft); }
  .rel-item.is-on .ic { color: var(--accent-bright); }
  .rel-item.is-on .t { color: var(--accent-bright); }
  .rel-item.is-on .n { color: var(--accent-bright); opacity: .85; }
  .rel-item.is-hidden { display: none; }
  .relnav-foot { flex: none; padding: 10px; border-top: 1px solid var(--border); }
  .relnav-foot a { display: flex; align-items: center; gap: 9px; padding: 9px; border: 1px dashed var(--ink-dash); border-radius: var(--r-sm); color: var(--accent-bright); font-size: 12.5px; transition: background .14s; }
  .relnav-foot a:hover { background: var(--accent-soft); }
  .relnav-foot svg { width: 15px; height: 15px; }

  /* ─── 工作区 ─────────────────────────────────────────────────────── */
  .work { grid-column: 3; grid-row: 2; min-height: 0; display: flex; flex-direction: column; background: color-mix(in oklch, var(--scrim) 46%, transparent); }
  .work-head { flex: none; display: flex; align-items: flex-end; gap: 14px; padding: 20px 34px 15px; border-bottom: 1px solid var(--border); }
  .work-badge { flex: none; width: 52px; height: 52px; border-radius: var(--r-md); display: grid; place-items: center; gap: 1px; background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent-bright); font-family: var(--font-mono); }
  .work-badge b { font-size: 15px; font-weight: 600; line-height: 1; }
  .work-badge span { font-size: 8.5px; letter-spacing: 0.08em; opacity: .85; }
  .work-head-txt { min-width: 0; }
  .work-h { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: 0.03em; }
  .work-lead { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .work-head .spacer { flex: 1; }
  .work-tools { display: flex; align-items: center; gap: 9px; flex: none; }
  .work-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 20px 34px 52px; scrollbar-width: thin; scrollbar-color: var(--ink-hair) transparent; }
  .work-scroll::-webkit-scrollbar { width: 8px; }
  .work-scroll::-webkit-scrollbar-thumb { background: var(--ink-hair); border-radius: 999px; }

  /* ─── 通用面板 / 表单 ───────────────────────────────────────────── */
  .panel { border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; background: color-mix(in oklch, var(--surface) 82%, transparent); }
  .panel-h { display: flex; align-items: center; gap: 9px; padding: 12px 15px; border-bottom: 1px solid var(--border); }
  .panel-h .dot { width: 6px; height: 6px; border-radius: 1px; background: var(--fg); opacity: .5; transform: rotate(45deg); flex: none; }
  .panel-h .nm { font-family: var(--font-display); font-size: 13.5px; font-weight: 600; letter-spacing: 0.05em; }
  .panel-h .hint { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
  .panel-b { padding: 15px; display: flex; flex-direction: column; gap: 13px; }
  .panel-b.tight { gap: 11px; }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field > .lb { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  .field > .lb .num { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }
  .ta { width: 100%; min-height: 150px; resize: vertical; font-family: var(--font-display); font-size: 14px; line-height: 1.75; color: var(--fg); background: color-mix(in oklch, var(--bg) 55%, var(--surface)); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 12px 13px; }
  .ta.sm { min-height: 92px; }
  .ta::placeholder { color: var(--muted); }
  .ta:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border: 1px solid var(--border); border-radius: 999px; background: color-mix(in oklch, var(--surface) 70%, transparent); color: var(--fg); font-size: 12px; transition: background .14s, border-color .14s, color .14s; }
  .chip:hover { border-color: var(--ink-hair); }
  .chip.is-on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-bright); }
  .chip svg { width: 13px; height: 13px; }
  .row { display: flex; align-items: center; gap: 11px; }
  input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); height: 4px; }
  .sel { font: inherit; font-size: 12.5px; color: var(--fg); background: color-mix(in oklch, var(--bg) 55%, var(--surface)); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 7px 10px; }
  .sel:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .acts { display: flex; flex-wrap: wrap; gap: 9px; }
  .acts .spacer { flex: 1; }

  /* ─── 引擎通用件 ────────────────────────────────────────────────── */
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .cols.a { grid-template-columns: minmax(0, 350px) minmax(0, 1fr); }
  .cols.b { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
  .cols.c { grid-template-columns: minmax(0, 1fr) minmax(0, 300px); }
  @media (max-width: 1180px) { .cols, .cols.a, .cols.b, .cols.c { grid-template-columns: minmax(0, 1fr); } }
  .stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .lrow { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border: 1px solid var(--border); border-radius: var(--r-sm); background: color-mix(in oklch, var(--surface) 58%, transparent); text-align: left; width: 100%; transition: background .14s, border-color .14s; }
  .lrow:hover { background: var(--ink-soft); }
  .lrow.is-on { background: var(--accent-soft); border-color: var(--accent-line); }
  .lrow .nm { flex: 1; min-width: 0; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lrow .sub { font-family: var(--font-mono); font-size: 10px; color: var(--muted); flex: none; }
  .lrow .tagn { font-family: var(--font-mono); font-size: 10px; color: var(--accent-bright); flex: none; }
  .mini { font: inherit; font-size: 12.5px; color: var(--fg); background: color-mix(in oklch, var(--bg) 55%, var(--surface)); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 7px 10px; width: 100%; }
  .mini::placeholder { color: var(--muted); }
  .mini:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 11px; }
  @media (max-width: 820px) { .grid2, .grid3, .grid4 { grid-template-columns: 1fr; } }
  .empty { padding: 22px 16px; text-align: center; font-size: 12px; color: var(--muted); border: 1px dashed var(--ink-dash); border-radius: var(--r-sm); line-height: 1.7; }
  .bar { height: 8px; border-radius: 999px; background: var(--ink-soft); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .2s; }
  .svgbox { width: 100%; border: 1px solid var(--border); border-radius: var(--r-sm); background: color-mix(in oklch, var(--bg) 42%, var(--surface)); display: block; }
  .metric { border: 1px solid var(--border); border-radius: var(--r-sm); padding: 12px; background: color-mix(in oklch, var(--surface) 60%, transparent); }
  .metric b { display: block; font-family: var(--font-display); font-size: 21px; letter-spacing: .02em; }
  .metric span { font-size: 11px; color: var(--muted); }
  .tier { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border: 1px solid var(--border); border-radius: var(--r-sm); background: color-mix(in oklch, var(--surface) 58%, transparent); }
  .tier .h { font-family: var(--font-mono); font-size: 10px; color: var(--accent-bright); width: 28px; flex: none; }
  .card2 { border: 1px solid var(--border); border-radius: var(--r-md); padding: 12px; background: color-mix(in oklch, var(--surface) 60%, transparent); display: flex; flex-direction: column; gap: 8px; text-align: left; }
  .card2 h4 { font-family: var(--font-display); font-size: 13.5px; font-weight: 600; letter-spacing: .03em; }
  .card2 p { font-size: 11.5px; color: var(--muted); line-height: 1.6; }
  .card2 .meta { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
  .bub { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px dashed var(--ink-dash); border-radius: 999px; font-size: 12.5px; color: var(--fg); background: transparent; }
  .diff { font-family: var(--font-mono); font-size: 11.5px; line-height: 1.7; }
  .diff .d { display: block; padding: 2px 8px; border-radius: 5px; white-space: pre-wrap; }
  .diff .del { background: color-mix(in oklch, var(--accent) 24%, transparent); }
  .diff .add { background: var(--accent-soft); }
  .stage { border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px 11px; background: color-mix(in oklch, var(--surface) 58%, transparent); }
  .stage .k { font-family: var(--font-mono); font-size: 10px; color: var(--accent-bright); }
  .stage .nm { font-size: 12.5px; margin-top: 3px; }
  .check { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 12.5px; width: 100%; text-align: left; background: transparent; transition: background .14s, border-color .14s; }
  .check:hover { background: var(--ink-soft); }
  .check.is-done { border-color: var(--accent-line); color: var(--muted); }
  .check.is-done .nm { text-decoration: line-through; }
  .check .box { width: 15px; height: 15px; flex: none; border-radius: 4px; border: 1px solid var(--ink-dash); display: grid; place-items: center; }
  .check.is-done .box { background: var(--accent); border-color: var(--accent); }
  .check.is-done .box svg { width: 11px; height: 11px; color: var(--accent-ink); }
  .check .nm { flex: 1; min-width: 0; }
  .tagrow { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .node.lbl { font-size: 11px; fill: var(--fg); pointer-events: none; }
  .node-g { cursor: grab; }
  .node-g:active { cursor: grabbing; }
  .legend { display: flex; flex-direction: column; gap: 8px; }
  .legend .li { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .legend .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; border: 1px solid var(--border); }
  .minimeta { display: flex; flex-wrap: wrap; gap: 14px; font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }
  .minimeta b { color: var(--fg); font-weight: 600; }
  .split2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; }
  .split2 > * { min-height: 240px; }
  .split2 > :first-child { border-right: 1px solid var(--border); }
  @media (max-width: 820px) { .split2 { grid-template-columns: 1fr; } .split2 > :first-child { border-right: 0; border-bottom: 1px solid var(--border); } }
  .plain { width: 100%; padding: 13px; font-family: var(--font-display); font-size: 14px; line-height: 1.9; color: var(--fg); }
  .plain[contenteditable]:empty::before { content: attr(data-ph); color: var(--muted); }
  .paper { background: color-mix(in oklch, var(--bg) 40%, var(--surface)); white-space: pre-wrap; word-break: break-word; }
  .phone { width: 226px; margin: 0 auto; border: 1px solid var(--border); border-radius: 20px; padding: 14px 12px; background: color-mix(in oklch, var(--bg) 50%, var(--surface)); }
  .phone .ph-h { font-family: var(--font-display); font-size: 13px; font-weight: 600; }
  .phone .ph-b { font-size: 11.5px; color: var(--muted); line-height: 1.7; margin-top: 8px; }
  .timebig { font-family: var(--font-mono); font-size: 44px; letter-spacing: .04em; text-align: center; }

  var TD = (function () {
    var pid = ''; try { pid = new URLSearchParams(location.search).get('project') || localStorage.getItem('qibi.project') || ''; } catch (e) { }
    var KEY = 'qibi.tooldata.v1';
    var cache = null, noteId = '', timer = 0;
    function read() {
      if (!cache) { try { cache = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { cache = {}; } }
      return cache;
    }
    function write() { try { localStorage.setItem(KEY, JSON.stringify(read())); } catch (e) { } }
    function syncNow() {
      if (!pid) return;
      var payload = { kind: 'tooldata', title: '工具数据', content: JSON.stringify(read()) };
      if (noteId) {
        fetch('/api/projects/' + pid + '/notes/' + noteId, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) }).catch(function () { });
      } else {
        fetch('/api/projects/' + pid + '/notes', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) })
          .then(function (r) { return r.json(); }).then(function (n) { if (n && n.id) { noteId = n.id; try { localStorage.setItem('qibi.tooldata.noteId', n.id); } catch (e) { } } }).catch(function () { });
      }
    }
    function loadRemote() {
      if (!pid) return;
      try { noteId = localStorage.getItem('qibi.tooldata.noteId') || ''; } catch (e) { }
      try {
        var x = new XMLHttpRequest();
        x.open('GET', '/api/projects/' + pid, false);
        x.send();
        if (x.status === 200) {
          var p = JSON.parse(x.responseText);
          var n = (p.notes || []).filter(function (it) { return it.kind === 'tooldata'; })[0];
          if (n) {
            noteId = n.id; try { localStorage.setItem('qibi.tooldata.noteId', n.id); } catch (e) { }
            var remote = {}; try { remote = JSON.parse(n.content || '{}'); } catch (e) { }
            var local = read();
            Object.keys(remote).forEach(function (k) { if (!(k in local)) local[k] = remote[k]; });
            write();
          }
        }
      } catch (e) { }
    }
    loadRemote();
    return {
      pid: pid,
      load: function (name, def) { var a = read(); return (name in a) ? a[name] : def; },
      save: function (name, val) {
        var a = read(); a[name] = val; write();
        clearTimeout(timer); timer = setTimeout(syncNow, 700);
      }
    };
  })();

    },
    bind: function (t, root) {
      var host = $('#curveHost', root);
      var W = 560, H = 300, pad = 30;
      var pts = [{ x: 0.1, y: 0.4 }, { x: 0.3, y: 0.6 }, { x: 0.5, y: 0.35 }, { x: 0.7, y: 0.8 }, { x: 0.9, y: 0.5 }];
      function render() {
        var ve = (0.5) ;
        var s = '<svg class="svgbox" viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '">';
        for (var gy = 0; gy <= 4; gy++) { var yy = pad + (H - 2 * pad) * gy / 4; s += '<line x1="' + pad + '" y1="' + yy + '" x2="' + (W - pad) + '" y2="' + yy + '" stroke="var(--ink-hair)" stroke-width="0.7"/>'; }
        var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + (pad + p.x * (W - 2 * pad)).toFixed(1) + ' ' + (H - pad - p.y * (H - 2 * pad)).toFixed(1); }).join(' ');
        s += '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>';
        pts.forEach(function (p, i) {
          var cx = pad + p.x * (W - 2 * pad), cy = H - pad - p.y * (H - 2 * pad);
          s += '<circle class="cvpt" data-i="' + i + '" cx="' + cx + '" cy="' + cy + '" r="7" fill="var(--accent-bright)" stroke="var(--scrim)" stroke-width="2" style="cursor:grab"/>';
        });
        host.innerHTML = s + '</svg>';
        var ys = pts.map(function (p) { return p.y; });
        $('#cvN', root).textContent = pts.length;
        $('#cvMax', root).textContent = Math.round(Math.max.apply(null, ys) * 100);
        $('#cvMin', root).textContent = Math.round(Math.min.apply(null, ys) * 100);
      }
      var drag = null;
      host.addEventListener('pointerdown', function (e) {
        var c = e.target.closest ? e.target.closest('.cvpt') : null; if (!c) return;
        drag = +c.getAttribute('data-i'); host.setPointerCapture && host.setPointerCapture(e.pointerId);
      });
      host.addEventListener('pointermove', function (e) {
        if (drag == null) return;
        var r = host.getBoundingClientRect();
        var x = (e.clientX - r.left) / r.width, y = 1 - (e.clientY - r.top) / r.height;
        pts[drag].y = Math.max(0.02, Math.min(0.98, y)); pts[drag].x = Math.max(0.03, Math.min(0.97, x));
        render(); drag = drag;
      });
      host.addEventListener('pointerup', function () { drag = null; });
      host.addEventListener('pointerleave', function () { drag = null; });
      $('#cvAdd', root).addEventListener('click', function () { var last = pts[pts.length - 1]; var nx = Math.min(0.96, last.x + 0.1); pts.push({ x: nx, y: Math.max(0.05, last.y + (Math.random() - 0.5) * 0.4) }); render(); });

    }

      });
      else if (k === 'cover') $('#pbCoverGo', root).addEventListener('click', function () {
        var genre = ($('#pbGenre', root) || {}).value || '';
        var tone = ($('#pbTone', root) || {}).value || '';
        var subject = ($('#pbSubject', root) || {}).value || '';
        var out = $('#pbCoverOut', root);
        if (!genre.trim() && !subject.trim()) { showToast('至少填「题材」或「主体」'); return; }
        var prompt = '中文网络小说封面设计，题材：' + (genre.trim() || '东方玄幻') + '，主色调：' + (tone.trim() || '水墨黑金') + '，主体：' + (subject.trim() || '人物剪影') + '，竖版构图，高级质感，书法标题留白区域，无水印';
        out.innerHTML = '<div class="empty">qwen-image 生成中…</div>';
        fetch('/api/ai/image', {
          method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ prompt: prompt, size: '768x1024' })
        }).then(function (r) { return r.json(); }).then(function (j) {
          if (!j || !j.url) throw new Error((j && j.error) || '生成失败');
          out.innerHTML = '<img src="' + j.url + '" alt="封面" style="max-width:100%;border-radius:10px;display:block"><div class="minimeta" style="margin-top:8px"><span>qwen-image-3.0-pro</span><a href="' + j.url + '" download style="margin-left:auto">下载</a></div>';
          showToast('封面已生成');
        }).catch(function (err) { out.innerHTML = '<div class="empty">生成失败：' + esc(err.message || '网络错误') + '</div>'; });
      });
      else if (k === 'blurb') $('#pbBlurbGo', root).addEventListener('click', function () {
        var srcText = ($('#pbSrc2', root) || {}).value || '';
        var out = $('#pbBlurbOut', root);
        if (!srcText.trim()) { showToast('先输入故事大意'); return; }
        out.innerHTML = '<div class="empty">DeepSeek 生成中…</div>';
        fetch('/api/ai/chat', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ messages: [
            { role: 'system', content: '你是中文网络小说简介写手。写一段 80~140 字的简介：一句钩子开场，中间给冲突与悬念，结尾留一个想看下去的扣子。只输出简介正文。' },
            { role: 'user', content: srcText.slice(0, 3000) }
          ], maxTokens: 1500, temperature: 0.9 })
        }).then(function (r) { return r.json(); }).then(function (j) {
          var txt = (j && j.text) || '';
          if (!txt) throw new Error((j && j.error) || '空响应');
          out.innerHTML = '<pre style="white-space:pre-wrap;font-family:inherit;line-height:1.9;margin:0">' + esc(txt) + '</pre><div class="acts" style="margin-top:9px"><button class="btn btn-ghost btn-sm" id="pbBlurbCopy" type="button">复制</button></div>';
          $('#pbBlurbCopy', root).addEventListener('click', function () { copyText(txt); showToast('简介已复制'); });
        }).catch(function (err) { out.innerHTML = '<div class="empty">生成失败：' + esc(err.message || '网络错误') + '</div>'; });
      });
      else $('#pbTagGo', root).addEventListener('click', function () {
        var pid = ''; try { pid = new URLSearchParams(location.search).get('project') || localStorage.getItem('qibi.project') || ''; } catch (e) { }
        var tagRow = root.querySelector('.tagrow');
        if (!pid) { showToast('未选择作品'); return; }
        fetch('/api/projects/' + pid).then(function (r) { return r.json(); }).then(function (p) {
          var head = (p.chapters[0] && (p.chapters[0].content || '').slice(0, 1200)) || '';
          return fetch('/api/ai/chat', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ messages: [
              { role: 'system', content: '你是网文编辑。根据书名与开头正文推荐 6 个标签，只输出标签，用中文逗号分隔，不要解释。' },
              { role: 'user', content: '书名：' + p.title + '\n类型：' + (p.genre || '未定') + '\n开头：' + head }
            ], maxTokens: 1200, temperature: 0.6 })
          });
        }).then(function (r) { return r.json(); }).then(function (j) {
          var tags = ((j && j.text) || '').split(/[,，、\s]+/).filter(Boolean).slice(0, 8);
          if (!tags.length) throw new Error('无结果');
          tagRow.innerHTML = tags.map(function (x) { return '<span class="tag">' + esc(x) + '</span>'; }).join('');
          showToast('已按作品内容推荐标签');
        }).catch(function (err) { showToast('标签推荐失败：' + (err.message || '网络错误')); });
      });
    }
  };

  /* ════════════════════════════════════════════════════════════════
     调度：找工具 → 交引擎
     ════════════════════════════════════════════════════════════════ */
  var el = {
    crumbTool: document.getElementById('crumbTool'),
    relGroup: document.getElementById('relGroup'), relSub: document.getElementById('relSub'), relList: document.getElementById('relList'),
    wbNo: document.getElementById('wbNo'), wbOf: document.getElementById('wbOf'),
    workTitle: document.getElementById('workTitle'), workLead: document.getElementById('workLead'),
    workTools: document.getElementById('workTools'), workBody: document.getElementById('workBody'),
    q: document.getElementById('q'), toast: document.getElementById('toast'), toastText: document.getElementById('toastText')
  };

  function groupsOf(name) { for (var i = 0; i < TOOLS.length; i++) if (TOOLS[i].g === name) return TOOLS[i]; return null; }
  function findTool(name) {
    for (var i = 0; i < TOOLS.length; i++) {
      var g = TOOLS[i];
      for (var j = 0; j < g.items.length; j++) if (g.items[j].n === name) {
        var it = g.items[j]; it.group = g.g; it.gi = i; it.index = j; it.total = g.items.length; return it;
      }
    }
    return null;
  }
  function showToast(msg) {
    el.toastText.textContent = msg; el.toast.classList.add('show');
    clearTimeout(showToast._t); showToast._t = setTimeout(function () { el.toast.classList.remove('show'); }, 2000);
  }

  var S = { tool: null, group: '', gi: 0 };

  function renderRelList() {
    var g = groupsOf(S.group); if (!g) { el.relList.innerHTML = ''; return; }
    el.relList.innerHTML = g.items.map(function (it, i) {
      var on_ = it.n === S.tool.n;
      return '<button type="button" class="rel-item' + (on_ ? ' is-on' : '') + '" data-name="' + esc(it.n) + '" title="' + esc(it.n) + '">'
        + '<span class="ic">' + ic(i) + '</span><span class="t">' + esc(it.n) + '</span><span class="n">' + pad(i + 1) + '</span></button>';
    }).join('');
    el.relGroup.textContent = g.g; el.relSub.textContent = '同组 ' + g.items.length + ' 件 · 各具功能';
  }

  function mount(t, push) {
    S.tool = t; S.group = t.group; S.gi = t.gi;
    el.crumbTool.textContent = t.n; el.workTitle.textContent = t.n; el.workLead.textContent = t.d || '独立工作页 · 按本工具的功能使用';
    el.wbNo.textContent = pad(t.index + 1); el.wbOf.textContent = '/' + pad(t.total);
    document.title = '启笔 QIBI · ' + t.n;
    el.workTools.innerHTML = '<a class="btn btn-ghost btn-sm" href="ai-novel-editor-home.html#works" title="回到作品"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>带入作品</a>';
    renderRelList();
    var engine = E[t.e] || E.setting;
    el.workBody.innerHTML = engine.view(t);
    engine.bind(t, el.workBody);
    el.workBody.scrollTop = 0;
    if (push !== false) {
      var url = 'qibi-tool.html?tool=' + encodeURIComponent(t.n) + '&g=' + encodeURIComponent(t.group) + (t.k ? '&k=' + encodeURIComponent(t.k) : '');
      try { history.replaceState(null, '', url); } catch (e) {}
    }
  }

  on(el.relList, '.rel-item', 'click', function (e, b) {
    var info = findTool(b.getAttribute('data-name'));
    if (info) mount(info);
  });

  /* 同组搜索 */
  el.q.addEventListener('input', function () {
    var term = (el.q.value || '').trim().toLowerCase();
    each($$('.rel-item', el.relList), function (it) {
      it.classList.toggle('is-hidden', !!term && (it.getAttribute('data-name') || '').toLowerCase().indexOf(term) < 0);
    });
  });

  /* 通知 popover */
  var bell = document.getElementById('bell'), pop = document.getElementById('bellPop');
  bell.addEventListener('click', function (e) { e.stopPropagation(); var o = pop.classList.toggle('open'); bell.setAttribute('aria-expanded', o ? 'true' : 'false'); });
  document.addEventListener('click', function (e) { if (!pop.contains(e.target) && e.target !== bell) { pop.classList.remove('open'); bell.setAttribute('aria-expanded', 'false'); } });

  /* 初次载入：?tool= & ?g= & ?k=（k 仅用于续写引擎子型） */
  (function boot() {
    var params = new URLSearchParams(location.search);
    var tool = params.get('tool'), group = params.get('g'), sub = params.get('k');
    var info = tool ? findTool(tool) : null;
    if (info && sub && info.e === 'continue') info.k = sub;
    if (!info && group) { var g = groupsOf(group); if (g) { var it = g.items[0]; it.group = g.g; it.gi = TOOLS.indexOf(g); it.index = 0; it.total = g.items.length; info = it; } }
    if (!info) { var g0 = TOOLS[0], it0 = g0.items[0]; it0.group = g0.g; it0.gi = 0; it0.index = 0; it0.total = g0.items.length; info = it0; }
    mount(info, false);
  })();
})();
</script>
  <script src="qibi-avatar.js?v=3"></script>
