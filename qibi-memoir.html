          </div>
          <input class="chapter-title" id="chapterTitle" type="text" placeholder="第一章 · 章节名" aria-label="章节名" autocomplete="off" />
          <textarea class="manuscript" id="manuscript" placeholder="从这里开始写。也可以先在左侧讲一段，再用「整理访谈」把你说过的话搬进来。" aria-label="自传正文"></textarea>
        </div>
        <footer class="write-foot">
          <span><b id="wordCount">0</b> 字</span>
          <span class="write-dot" aria-hidden="true"></span>
          <span>仅保存在本机</span>
          <span class="write-dot" aria-hidden="true"></span>
          <span class="save-stamp" id="saveStamp">自动保存</span>
          <input class="save-name" id="saveName" type="text" placeholder="存档名（可选）" aria-label="存档名" autocomplete="off" />
          <button class="save-now" id="saveNowBtn" type="button">保存</button>
          <button class="save-lib" id="saveLibBtn" type="button" aria-haspopup="true" aria-expanded="false" title="查看书稿存档">存档 <b id="saveCount">0</b></button>
        </footer>
        <div class="save-pop" id="savePop" hidden></div>
      </section>

      <div class="side">
        <section class="pane setup" data-od-id="memoir-setup">
          <header class="pane-head"><span class="pane-k"><b>03</b>调整风格</span><span class="pane-note">STYLE</span></header>
          <div class="setup-body">
            <div class="chip-row" id="styleRow"></div>
            <div class="tone-row" id="toneRow"></div>
            <p class="style-hint" id="styleHint"></p>
          </div>
        </section>

        <section class="pane roles" data-od-id="memoir-roles">
          <header class="pane-head">
            <span class="pane-k"><b>04</b>对话角色</span>
            <button class="role-add" id="roleAdd" type="button" aria-label="添加自定义人设">添加人设</button>
          </header>
          <div class="role-list" id="roleGrid"></div>
        </section>

        <section class="pane stats" data-od-id="memoir-stats">
          <header class="pane-head"><span class="pane-k"><b>05</b>对话统计</span><span class="pane-note" id="statNote">按年代</span></header>
          <div class="sort-row" id="sortTabs" role="group" aria-label="统计排序方式">
            <button type="button" class="sort-b is-on" data-sort="year" aria-label="按年代排序">年代</button>
            <button type="button" class="sort-b" data-sort="kind" aria-label="按类型排序">类型</button>
            <button type="button" class="sort-b" data-sort="weight" aria-label="按重要程度排序">重要</button>
            <button type="button" class="sort-b" data-sort="impact" aria-label="按影响排序">影响</button>
          </div>
          <div class="stat-sum" id="statSum"></div>
          <div class="stat-list" id="statList"></div>
        </section>
      </div>
    </div>
  </main>
</div>

<div class="mem-modal" id="roleModal" role="dialog" aria-modal="true" aria-labelledby="roleModalTitle" hidden>
  <div class="modal-card">
    <span class="modal-kicker">CUSTOM ROLE</span>
    <h2 class="modal-title" id="roleModalTitle">添加人设</h2>
    <div class="modal-field">
      <label for="roleNameInput">称呼</label>
      <input id="roleNameInput" type="text" placeholder="例如：三叔、刘老师、陈医生" autocomplete="off" />
    </div>
    <div class="modal-field">
      <label for="roleRelInput">身份 / 关系</label>
      <input id="roleRelInput" type="text" placeholder="例如：中学班主任、家里长辈" autocomplete="off" />
    </div>
    <div class="modal-field">
      <label for="roleToneInput">说话方式</label>
      <textarea id="roleToneInput" rows="2" placeholder="例如：慢条斯理，爱从旧事问起"></textarea>
    </div>
    <p class="modal-err" id="roleErr" role="alert"></p>
    <div class="modal-actions">
      <button class="modal-b" id="roleCancel" type="button">取消</button>
      <button class="modal-b primary" id="roleSave" type="button">添加</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var KEY = 'qibi.memoir.state';
  var QB_PROJ = ''; try { QB_PROJ = new URLSearchParams(location.search).get('project') || localStorage.getItem('qibi.project') || ''; } catch (e) { }

  var STYLES = [
    { id: 'auto', label: '自动', hint: '按你的讲述习惯自动调整追问方式' },
    { id: 'chat', label: '聊天', hint: '像拉家常，先聊起来' },
    { id: 'ask', label: '提问', hint: '一问一答，信息更具体' },
    { id: 'guide', label: '引导', hint: '帮你顺时间线，慢慢展开' },
    { id: 'empathy', label: '共情', hint: '先接住情绪，再往下问' }
  ];

  var TONES = [
    { id: 'warm', label: '温和' },
    { id: 'direct', label: '直接' },
    { id: 'restrained', label: '克制' }
  ];

  var ROLES = [
    { id: 'teacher', name: '老师', desc: '严谨提问，帮你理清时间线' },
    { id: 'friend', name: '老友', desc: '松弛闲聊，偶尔打趣' },
    { id: 'family', name: '家人', desc: '熟悉的口吻，记得那些旧事' },
    { id: 'editor', name: '编辑', desc: '像整理书稿一样追问细节' },
    { id: 'reporter', name: '记者', desc: '采访式提问，重视时间地点' },
    { id: 'doctor', name: '医生', desc: '关注身体与情绪的真实感受' },
    { id: 'shrink', name: '心理师', desc: '先接住情绪，再慢慢回看' },
    { id: 'classmate', name: '同窗', desc: '一起想起校园与旧同学' },
    { id: 'mentor', name: '导师', desc: '从学业与选择谈起' }
  ];

  var KINDS = ['回忆', '人物', '地点', '转折', '细节', '其他'];
  var KIND_ORDER = { '回忆': 0, '人物': 1, '地点': 2, '转折': 3, '细节': 4, '其他': 5 };
  var SORTS = { year: '年代', kind: '类型', weight: '重要程度', impact: '影响' };

  var REPLY_EXTRA = {
    short: '',
    normal: '',
    long: ' 不用急着一次说完，我们可以停在任意一个细节上。'
  };

  var state = {
    style: 'auto',
    tone: 'warm',
    role: 'teacher',
    customRoles: [],
    model: 'DeepSeek Chat',
    replyLen: 'auto',
    autoArchive: true,
    sort: 'year',
    books: [],
    activeBook: '',
    turns: [],
    meta: {},
    saves: [],
    draft: null
  };

  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p === 'object') {
        if (STYLES.some(function (s) { return s.id === p.style; })) state.style = p.style;
        if (TONES.some(function (t) { return t.id === p.tone; })) state.tone = p.tone;
        if (typeof p.role === 'string') state.role = p.role;
        if (Array.isArray(p.customRoles)) state.customRoles = p.customRoles.filter(function (r) { return r && r.name; });
        if (typeof p.model === 'string') state.model = p.model;
        if (p.replyLen === 'auto' || p.replyLen === 'short' || p.replyLen === 'normal' || p.replyLen === 'long') state.replyLen = p.replyLen;
        if (typeof p.autoArchive === 'boolean') state.autoArchive = p.autoArchive;
        if (SORTS[p.sort]) state.sort = p.sort;
        if (Array.isArray(p.books) && p.books.length) {
          var seenB = {};
          p.books.forEach(function (b) {
            var bk = cleanBook(b);
            if (!bk) return;
            while (seenB[bk.id]) bk.id = newBookId();
            seenB[bk.id] = true;
            state.books.push(bk);
          });
          state.books = state.books.slice(0, 12);
          if (state.books.some(function (b) { return b.id === p.activeBook; })) state.activeBook = p.activeBook;
        } else {
          var legacy = { book: '', chapters: [{ id: 'c1', title: '', text: '' }], active: 0, gathered: {} };
          if (p.draft && typeof p.draft === 'object') {
            if (typeof p.draft.book === 'string') legacy.book = p.draft.book.slice(0, 60);
            if (Array.isArray(p.draft.chapters) && p.draft.chapters.length) {
              var seenIds = {}, list = [];
              p.draft.chapters.forEach(function (c) {
                if (!c || typeof c !== 'object') return;
                var cid = typeof c.id === 'string' && c.id ? c.id.slice(0, 24) : '';
                while (!cid || seenIds[cid]) cid = 'c' + Math.random().toString(36).slice(2, 8);
                seenIds[cid] = true;
                list.push({
                  id: cid,
                  title: typeof c.title === 'string' ? c.title.slice(0, 80) : '',
                  text: typeof c.text === 'string' ? c.text.slice(0, 200000) : ''
                });
              });
              if (list.length) legacy.chapters = list;
              if (typeof p.draft.active === 'number' && p.draft.active >= 0 && p.draft.active < legacy.chapters.length) {
                legacy.active = Math.floor(p.draft.active);
              }
              if (p.draft.gathered && typeof p.draft.gathered === 'object') {
                legacy.chapters.forEach(function (c) {
                  var g = p.draft.gathered[c.id];
                  if (typeof g === 'number' && g >= 0) legacy.gathered[c.id] = Math.floor(g);
                });
              }
            } else {
              var first = legacy.chapters[0];
              if (typeof p.draft.chapter === 'string') first.title = p.draft.chapter.slice(0, 80);
              if (typeof p.draft.text === 'string') first.text = p.draft.text.slice(0, 200000);
              if (typeof p.draft.gathered === 'number' && p.draft.gathered >= 0) {
                legacy.gathered[first.id] = Math.floor(p.draft.gathered);
              }
            }
          }
          state.books = [{
            id: 'b1',
            at: Date.now(),
            draft: cleanDraft(legacy),
            turns: cleanTurns(p.turns),
            meta: cleanMeta(p.meta),
            saves: cleanSaves(p.saves)
          }];
        }
        if (!state.activeBook && state.books.length) state.activeBook = state.books[0].id;
      }
    }
  } catch (e) {}
  if (!state.books.length) {
    state.books = [{ id: 'b1', at: Date.now(), draft: cleanDraft(null), turns: [], meta: {}, saves: [] }];
    state.activeBook = 'b1';
  }
  if (!allRoles().some(function (r) { return r.id === state.role; })) state.role = 'teacher';

  function newBookId() { return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
  function cleanTurns(list) {
    var out = [];
    if (!Array.isArray(list)) return out;
    list.forEach(function (t) {
      if (!t || (t.who !== 'me' && t.who !== 'ai' && t.who !== 'sys') || typeof t.text !== 'string') return;
      out.push({
        id: typeof t.id === 'string' && t.id ? t.id.slice(0, 40) : uid(),
        who: t.who,
        text: t.text,
        ts: Math.max(0, parseInt(t.ts, 10) || 0)
      });
    });
    return out;
  }
  function cleanMeta(obj) {
    var out = {};
    if (!obj || typeof obj !== 'object') return out;
    Object.keys(obj).forEach(function (k) {
      var m = obj[k];
      if (!m || typeof m !== 'object') return;
      out[k] = {
        year: typeof m.year === 'string' ? m.year.slice(0, 10) : '',
        kind: KINDS.indexOf(m.kind) >= 0 ? m.kind : '回忆',
        weight: m.weight >= 0 && m.weight <= 3 ? Math.floor(m.weight) : 0,
        impact: m.impact >= 0 && m.impact <= 3 ? Math.floor(m.impact) : 0
      };
    });
    return out;
  }
  function cleanSaves(list) {
    var out = [];
    if (!Array.isArray(list)) return out;
    list.forEach(function (s) {
      if (!s || typeof s !== 'object' || !s.draft) return;
      out.push({
        id: typeof s.id === 'string' && s.id ? s.id.slice(0, 32) : 's' + Math.random().toString(36).slice(2, 8),
        name: typeof s.name === 'string' && s.name.trim() ? s.name.trim().slice(0, 24) : '未命名存档',
        at: Math.max(0, parseInt(s.at, 10) || 0),
        words: Math.max(0, parseInt(s.words, 10) || 0),
        draft: cleanDraft(s.draft)
      });
    });
    return out.slice(0, 20);
  }
  function cleanBook(b) {
    if (!b || typeof b !== 'object') return null;
    return {
      id: typeof b.id === 'string' && b.id ? b.id.slice(0, 32) : newBookId(),
      at: Math.max(0, parseInt(b.at, 10) || 0),
      draft: cleanDraft(b.draft),
      turns: cleanTurns(b.turns),
      meta: cleanMeta(b.meta),
      saves: cleanSaves(b.saves)
    };
  }
  function activeBookObj() {
    for (var i = 0; i < state.books.length; i++) if (state.books[i].id === state.activeBook) return state.books[i];
    return state.books[0];
  }
  function syncActive() {
    var b = activeBookObj();
    state.activeBook = b.id;
    state.draft = b.draft;
    state.turns = b.turns;
    state.meta = b.meta;
    state.saves = b.saves;
  }
  function bookName(b) {
    var t = b && b.draft ? String(b.draft.book || '').trim() : '';
    return t || '未命名自传';
  }
  function save() {
    var b = activeBookObj();
    if (b) b.at = Date.now();
    var snapshot = {
      style: state.style, tone: state.tone, role: state.role, customRoles: state.customRoles,
      model: state.model, replyLen: state.replyLen, autoArchive: state.autoArchive, sort: state.sort,
      activeBook: state.activeBook, books: state.books
    };
    try { localStorage.setItem(KEY, JSON.stringify(snapshot)); } catch (e) {}
    if (QB_PROJ) {
      try {
        var nidKey = 'qibi.memoir.noteId.' + QB_PROJ;
        var nid = ''; try { nid = localStorage.getItem(nidKey) || ''; } catch (er) { }
        var payload = { kind: 'memoir', title: '自传', content: JSON.stringify(snapshot) };
        var createNote = function () {
          fetch('/api/projects/' + QB_PROJ + '/notes', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) })
            .then(function (r) { return r.json(); }).then(function (n) { if (n && n.id) localStorage.setItem(nidKey, n.id); }).catch(function () { });
        };
        if (nid) {
          fetch('/api/projects/' + QB_PROJ + '/notes/' + nid, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) })
            .then(function (r) { if (r.status === 404) { try { localStorage.removeItem(nidKey); } catch (e) { } createNote(); } })
            .catch(function () { });
        } else {
          createNote();
        }
      } catch (er) { }
    }
  }
  syncActive();
  function cleanDraft(d) {
    var out = { book: '', chapters: [{ id: 'c1', title: '', text: '' }], active: 0, gathered: {}, autoAt: 0, structAt: 0, outline: null };
    if (!d || typeof d !== 'object') return out;
    if (typeof d.book === 'string') out.book = d.book.slice(0, 60);
    if (typeof d.autoAt === 'number' && d.autoAt >= 0) out.autoAt = Math.floor(d.autoAt);
    if (typeof d.structAt === 'number' && d.structAt >= 0) out.structAt = Math.floor(d.structAt);
    if (Array.isArray(d.outline)) {
      out.outline = d.outline.slice(0, 15).map(function (c) {
        if (!c || typeof c !== 'object') return null;
        return { title: typeof c.title === 'string' ? c.title.slice(0, 80) : '', brief: typeof c.brief === 'string' ? c.brief.slice(0, 200) : '' };
      }).filter(Boolean);
    }
    if (Array.isArray(d.chapters) && d.chapters.length) {
      var seen = {}, list = [];
      d.chapters.forEach(function (c) {
        if (!c || typeof c !== 'object') return;
        var id = typeof c.id === 'string' && c.id ? c.id.slice(0, 24) : '';
        while (!id || seen[id]) id = 'c' + Math.random().toString(36).slice(2, 8);
        seen[id] = true;
        list.push({
          id: id,
          title: typeof c.title === 'string' ? c.title.slice(0, 80) : '',
          text: typeof c.text === 'string' ? c.text.slice(0, 200000) : ''
        });
      });
      if (list.length) out.chapters = list;
      if (typeof d.active === 'number' && d.active >= 0 && d.active < out.chapters.length) out.active = Math.floor(d.active);
      if (d.gathered && typeof d.gathered === 'object') {
        out.chapters.forEach(function (c) {
          var g = d.gathered[c.id];
          if (typeof g === 'number' && g >= 0) out.gathered[c.id] = Math.floor(g);
        });
      }
    }
    return out;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function uid() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function styleById(id) { for (var i = 0; i < STYLES.length; i++) if (STYLES[i].id === id) return STYLES[i]; return STYLES[0]; }
  function toneById(id) { for (var i = 0; i < TONES.length; i++) if (TONES[i].id === id) return TONES[i]; return TONES[0]; }
  function allRoles() { return ROLES.concat(state.customRoles.map(function (r) { return { id: r.id, name: r.name, desc: r.desc, custom: true }; })); }
  function roleById(id) {
    var rs = allRoles();
    for (var i = 0; i < rs.length; i++) if (rs[i].id === id) return rs[i];
    return ROLES[0];
  }
  function curRole() { return roleById(state.role); }

  var EMO_WORDS = ['难受', '难过', '开心', '高兴', '遗憾', '后悔', '害怕', '担心', '想念', '惦记', '委屈', '骄傲', '释然', '愧疚', '孤独'];
  var TIME_WORDS = ['那年', '小时候', '当时', '后来', '之前', '之后', '时候', '那年', '岁'];

  function autoPick() {
    var mine = [];
    for (var i = state.turns.length - 1; i >= 0 && mine.length < 4; i--) {
      if (state.turns[i].who === 'me') mine.unshift(state.turns[i]);
    }
    if (!mine.length) return 'chat';
    var joined = mine.map(function (t) { return t.text; }).join(' ');
    var hasEmo = EMO_WORDS.some(function (w) { return joined.indexOf(w) >= 0; });
    var timeHits = 0;
    TIME_WORDS.forEach(function (w) { timeHits += joined.split(w).length - 1; });
    var avg = joined.replace(/\s+/g, '').length / mine.length;
    if (hasEmo) return 'empathy';
    if (timeHits >= 3) return 'guide';
    if (avg < 18) return 'ask';
    return 'chat';
  }
  function activeStyle() { return state.style === 'auto' ? autoPick() : state.style; }

  var $ = function (id) { return document.getElementById(id); };
  var el = {
    chatLog: $('chatLog'), chatRole: $('chatRole'), composeStyle: $('composeStyle'),
    input: $('memInput'), send: $('memSend'), model: $('memModel'), lenRow: $('lenRow'), lenNote: $('lenNote'),
    autoArc: $('autoArc'), setBtn: $('memSetBtn'), memSet: $('memSet'),
    styleRow: $('styleRow'), toneRow: $('toneRow'), styleHint: $('styleHint'),
    roleGrid: $('roleGrid'), roleAdd: $('roleAdd'), roleModal: $('roleModal'),
    roleName: $('roleNameInput'), roleRel: $('roleRelInput'), roleTone: $('roleToneInput'), roleErr: $('roleErr'),
    roleCancel: $('roleCancel'), roleSave: $('roleSave'),
    sortTabs: $('sortTabs'), statNote: $('statNote'), statSum: $('statSum'), statList: $('statList'), chatClear: $('chatClear'),
    saveNote: $('saveNote'),
    bookTitle: $('bookTitle'), chapterTitle: $('chapterTitle'), manuscript: $('manuscript'),
    wordCount: $('wordCount'), writeNote: $('writeNote'), gatherBtn: $('gatherBtn'),
    tocBtn: $('tocBtn'), tocPop: $('tocPop'),
    bookBtn: $('bookBtn'), bookCount: $('bookCount'), bookPop: $('bookPop'),
    saveStamp: $('saveStamp'), saveName: $('saveName'), saveNowBtn: $('saveNowBtn'),
    saveLibBtn: $('saveLibBtn'), saveCount: $('saveCount'), savePop: $('savePop')
  };

  var typingOn = false;
  var replyTimer = 0;
  var lastMeText = '';

  function renderLenNote(probeText) {
    if (!el.lenNote) return;
    if (state.replyLen === 'auto') {
      var t = probeText != null ? probeText : lastMeText;
      el.lenNote.textContent = t
        ? '自适应：上一条按「' + lenLabel(autoLen(t)) + '」回应'
        : '自适应：按讲述长短与情绪调整详略';
    } else {
      el.lenNote.textContent = '固定为「' + lenLabel(state.replyLen) + '」';
    }
  }

  function welcome() {
    var r = curRole().name;
    return '我是' + r + '，今天做你的访谈者。想从哪一段讲起都可以——哪一年、在哪里、和谁在一起。';
  }

  function renderChat() {
    var out = '<div class="msg ai"><span class="who">' + esc(curRole().name) + ' · 访谈</span>' + esc(welcome()) + '</div>';
    for (var i = 0; i < state.turns.length; i++) {
      var t = state.turns[i];
      if (t.who === 'sys') out += '<div class="msg sys">' + esc(t.text) + '</div>';
      else out += '<div class="msg ' + (t.who === 'me' ? 'me' : 'ai') + '"><span class="who">' + (t.who === 'me' ? '我' : esc(curRole().name) + ' · 访谈') + '</span>' + esc(t.text) + '</div>';
    }
    if (typingOn) out += '<div class="typing" aria-label="正在追问"><i></i><i></i><i></i></div>';
    el.chatLog.innerHTML = out;
    el.chatLog.scrollTop = el.chatLog.scrollHeight;
    el.chatRole.textContent = '与「' + curRole().name + '」对话';
    el.composeStyle.textContent = state.style === 'auto'
      ? '自动 · 偏' + styleById(autoPick()).label
      : '风格 · ' + styleById(state.style).label;
  }

  var POOLS = {
    chat: ['嗯，我在听。这一段里，最先浮上来的是哪个画面？', '你提到「%s」。那时你多大，身边还有谁？', '再放慢一点：当时你先看见了什么，又听见了什么？', '这段里有没有一句话，是你到现在还记得的？'],
    ask: ['这件事大概发生在哪一年、什么地方？', '当时还有谁在场？他们知道你的想法吗？', '如果只保留一个细节，你会留下哪个？', '那时候的你，几岁，在做什么？'],
    guide: ['我们先顺一条时间线：在这件事之前，你正在做什么？', '试着用一句话概括那时的你——你会怎么写？', '这段经历之后，你对哪件事的看法变了？', '如果分成前、中、后三段，你会怎么切？'],
    empathy: ['听起来那一段并不轻松。你当时是怎么撑过去的？', '这份感受，后来还出现过吗？', '如果今天可以对那时的自己说一句话，你会说什么？', '有没有谁在那时候接住了你？']
  };
  var probePool = ['可以停在这个细节上，多讲一点。', '不着急，慢慢想。', '换个角度说也可以。', '嗯，我在听。', '这个细节好，往下说。', '然后呢？'];

  function autoLen(userText) {
    var t = String(userText == null ? '' : userText).replace(/\s+/g, '');
    if (!t) return 'normal';
    var hasEmo = EMO_WORDS.some(function (w) { return t.indexOf(w) >= 0; });
    if (t.length >= 56 || (hasEmo && t.length >= 22)) return 'long';
    if (t.length <= 12) return 'short';
    return 'normal';
  }
  function replyLenFor(userText) {
    return state.replyLen === 'auto' ? autoLen(userText) : state.replyLen;
  }
  function lenLabel(len) {
    return len === 'auto' ? '自适应' : len === 'short' ? '短' : len === 'long' ? '长' : '标准';
  }

  var replyTick = 0;
  function aiReply(userText) {
    var len = replyLenFor(userText);
    if (len === 'short') return probePool[replyTick++ % probePool.length];
    var pool = POOLS[activeStyle()] || POOLS.chat;
    var tpl = pool[replyTick++ % pool.length];
    var snip = String(userText).replace(/\s+/g, '').slice(0, 12);
    var text = tpl.indexOf('%s') >= 0 ? (snip.length >= 4 ? tpl.replace('%s', snip) : pool[(replyTick++) % pool.length]) : tpl;
    if (len === 'long') {
      text += REPLY_EXTRA.long;
      text += probePool[replyTick++ % probePool.length];
    }
    return text;
  }

  function memoirContext() {
    var b = activeBookObj();
    var d = (b && b.draft) || {};
    var lastTurns = state.turns.slice(-8).map(function (t) { return (t.who === 'me' ? '我：' : 'AI：') + t.text; }).join('\n');
    var chapters = (d.chapters || []).map(function (c) { return '《' + (c.title || '未命名') + '》' + String(c.text || '').slice(-200); }).join('\n').slice(-1200);
    return '自传名：' + bookName(b)
      + '\n角色设定：' + curRole().name + ' · ' + curRole().desc
      + '\n访谈语气：' + toneById(state.tone).label + ' · 风格：' + styleById(state.style).label
      + '\n最近对话：\n' + lastTurns
      + (chapters ? '\n书稿节选：\n' + chapters : '');
  }
  function aiReplyAsync(userText) {
    var len = replyLenFor(userText);
    var task = len === 'short' ? '追问一句短的，不超过 40 字。'
      : len === 'long' ? '先接住情绪，再给一个更具体的追问，120~180 字。'
        : '接住对方的话，再追问一个问题，60~100 字。';
    var sys = '你是自传访谈助手，用温和、具体、不评判的方式采访作者，帮他把记忆讲清楚。' + task + '只输出你对作者说的话，不要分析、不要标题。';
    var user = memoirContext() + '\n作者刚说：' + userText;
    return fetch('/api/ai/chat', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ messages: [{ role: 'system', content: sys }, { role: 'user', content: user }], maxTokens: 500, temperature: 0.85 })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.text) throw new Error((j && j.error) || '空响应');
      return j.text;
    }).catch(function () { return aiReply(userText); });
  }

  function send() {
    var text = el.input.value.trim();
    if (!text) return;
    var turn = { id: uid(), who: 'me', text: text, ts: Date.now() };
    state.turns.push(turn);
    if (state.autoArchive) state.meta[turn.id] = { year: '', kind: '回忆', weight: 0, impact: 0 };
    lastMeText = text;
    renderLenNote(text);
    el.input.value = '';
    save();
    renderChat();
    renderStats();
    if (state.style === 'auto') renderSetup();
    typingOn = true;
    renderChat();
    clearTimeout(replyTimer);
    replyTimer = setTimeout(function () {
      aiReplyAsync(text).then(function (out) {
        typingOn = false;
        state.turns.push({ id: uid(), who: 'ai', text: out, ts: Date.now() });
        save();
        renderChat();
        maybeAutoWrite();
      });
    }, 620);
  }

  /* ── 自动书写：每 5 段访谈自动写正文；每 50 段重排整体结构 ── */
  var autoBusy = false;
  function maybeAutoWrite() {
    if (autoBusy) return;
    var book = activeBookObj();
    var draft = book.draft;
    var users = state.turns.filter(function (t) { return t.who === 'me'; });
    if (!draft.autoAt) draft.autoAt = 0;
    if (!draft.structAt) draft.structAt = 0;
    if (users.length - draft.autoAt >= 5) { autoWrite(users, draft); return; }
    if (users.length - draft.structAt >= 50) { autoStructure(users, draft); return; }
  }
  function collectExchanges(from) {
    var seen = 0, out = [];
    state.turns.forEach(function (t) {
      if (t.who === 'me') {
        seen++;
        if (seen > from) out.push('我：' + String(t.text || '').trim());
      } else if (t.who === 'ai' && seen > from) {
        out.push('访谈者：' + String(t.text || '').trim());
      }
    });
    return out.join('\n').slice(-6000);
  }
  function autoWrite(users, draft) {
    autoBusy = true;
    var from = draft.autoAt || 0;
    var ch = activeChapter();
    if (countChars(ch.text) > 3000) {
      var n = draft.chapters.length + 1;
      ch = { id: cid(), title: '第' + cnNum(n) + '章 · ', text: '' };
      draft.chapters.push(ch);
      draft.active = draft.chapters.length - 1;
      el.bookTitle.value = state.draft.book;
      el.chapterTitle.value = ch.title;
    }
    if (!ch.title.trim()) {
      ch.title = '第' + cnNum(draft.chapters.indexOf(ch) + 1) + '章 · 未命名';
      el.chapterTitle.value = ch.title;
    }
    var exchanges = collectExchanges(from);
    noteWrite('正在根据最近 ' + (users.length - from) + ' 段访谈自动书写…');
    var sys = '你是自传代笔编辑。根据访谈记录，用第一人称把作者讲述的内容写成连贯、克制的自传正文。保留事实、人名、时间与细节；不虚构，不添加访谈里没有的信息。只输出正文，不要标题、不要解释。';
    var user = '自传名：' + (state.draft.book || '未命名') + '\n当前章节：' + (ch.title || '未命名') + '\n访谈记录：\n' + exchanges;
    fetch('/api/ai/chat', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ messages: [{ role: 'system', content: sys }, { role: 'user', content: user }], maxTokens: 1200, temperature: 0.7 })
    }).then(function (r) { return r.json(); }).then(function (j) {
      var text = (j && j.text) || '';
      if (!text) throw new Error((j && j.error) || '空响应');
      var base = String(ch.text || '').replace(/\s+$/, '');
      ch.text = (base ? base + '\n\n' : '') + text.trim();
      draft.gathered[ch.id] = users.length;
      draft.autoAt = users.length;
      if (state.draft.active === draft.chapters.indexOf(ch)) {
        el.manuscript.value = ch.text;
        updateWordCount();
      }
      save();
      if (!el.tocPop.hidden) renderTOC();
      sysNote('已根据最近 ' + (users.length - from) + ' 段访谈自动写入「' + (ch.title || '当前章节') + '」');
      renderChat();
      noteWrite('已自动书写');
    }).catch(function (e) {
      noteWrite('自动书写失败：' + (e.message || '网络错误'));
    }).then(function () { autoBusy = false; maybeAutoWrite(); });
  }
  function autoStructure(users, draft) {
    autoBusy = true;
    noteWrite('正在根据最近 50 段访谈重新生成整体结构…');
    var chapters = draft.chapters.map(function (c) { return { title: c.title, words: countChars(c.text) }; });
    var recent = users.slice(-50).map(function (t) { return String(t.text || '').trim(); }).join('\n').slice(-6000);
    var sys = '你是自传编辑。根据作者最近 50 段访谈与现有章节，重新规划整本自传的结构。只输出 JSON：{"intro":"一句话简介","chapters":[{"title":"第X章 · 标题","brief":"本章写什么"}]}，8~15 章，标题要具体、有画面。';
    var user = '自传名：' + (state.draft.book || '未命名') + '\n现有章节：' + JSON.stringify(chapters) + '\n最近讲述：\n' + recent;
    fetch('/api/ai/chat', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ messages: [{ role: 'system', content: sys }, { role: 'user', content: user }], maxTokens: 1600, temperature: 0.8 })
    }).then(function (r) { return r.json(); }).then(function (j) {
      var text = (j && j.text) || '';
      var obj = null;
      try { obj = JSON.parse(text); } catch (e) {
        var s = text.indexOf('{'), e2 = text.lastIndexOf('}');
        if (s >= 0 && e2 > s) { try { obj = JSON.parse(text.slice(s, e2 + 1)); } catch (e3) { } }
      }
      if (!obj || !Array.isArray(obj.chapters) || !obj.chapters.length) throw new Error('结构解析失败');
      var list = obj.chapters.slice(0, 15);
      for (var i = 0; i < list.length; i++) {
        var title = String((list[i] && list[i].title) || ('第' + cnNum(i + 1) + '章')).slice(0, 80);
        var ch = draft.chapters[i];
        if (!ch) { draft.chapters.push({ id: cid(), title: title, text: '' }); continue; }
        if (!ch.title.trim() || /^第[一二三四五六七八九十百0-9]+章/.test(ch.title.trim())) ch.title = title;
      }
      draft.outline = list.map(function (c) { return { title: String(c.title || ''), brief: String(c.brief || '') }; });
      draft.structAt = users.length;
      save();
      loadSheet();
      if (!el.tocPop.hidden) renderTOC();
      renderChat();
      sysNote('已按最近 50 段访谈重新生成整体结构：' + list.length + ' 章' + (obj.intro ? ' · ' + obj.intro : ''));
      noteWrite('整体结构已更新');
    }).catch(function (e) {
      noteWrite('结构生成失败：' + (e.message || '网络错误'));
    }).then(function () { autoBusy = false; maybeAutoWrite(); });
  }

  function renderSetup() {
    var s = styleById(state.style), t = toneById(state.tone);
    if (state.style === 'auto') {
      var lean = styleById(autoPick());
      el.styleHint.innerHTML = '<b>自动 · 偏' + lean.label + '</b>　按你最近几轮讲述的长短、情绪与时间线索选择追问方式；当前语气：' + t.label + '。';
    } else {
      el.styleHint.innerHTML = '现在：<b>' + s.label + ' · ' + t.label + '</b>　' + s.hint + '。';
    }
    var out = '';
    for (var i = 0; i < STYLES.length; i++) {
      out += '<button type="button" class="s-chip' + (state.style === STYLES[i].id ? ' is-on' : '') + '" data-style="' + STYLES[i].id + '" aria-pressed="' + (state.style === STYLES[i].id) + '">' + STYLES[i].label + '</button>';
    }
    el.styleRow.innerHTML = out;
    out = '';
    for (var j = 0; j < TONES.length; j++) {
      out += '<button type="button" class="tone-b' + (state.tone === TONES[j].id ? ' is-on' : '') + '" data-tone="' + TONES[j].id + '" aria-pressed="' + (state.tone === TONES[j].id) + '">' + TONES[j].label + '</button>';
    }
    el.toneRow.innerHTML = out;
    out = '';
    var roles = allRoles();
    for (var k = 0; k < roles.length; k++) {
      var r = roles[k];
      out += '<div class="role-card' + (state.role === r.id ? ' is-on' : '') + '" role="button" tabindex="0" data-role="' + esc(r.id) + '" aria-pressed="' + (state.role === r.id) + '">'
        + '<span class="role-av">' + esc(r.name.slice(0, 1)) + '</span>'
        + '<span class="role-txt"><span class="role-name">' + esc(r.name) + '</span><span class="role-desc">' + esc(r.desc) + '</span></span>'
        + (r.custom ? '<button type="button" class="role-x" data-role-del="' + esc(r.id) + '" aria-label="删除人设 ' + esc(r.name) + '">×</button>' : '')
        + '</div>';
    }
    el.roleGrid.innerHTML = out;
  }

  function yearNum(y) { var m = String(y).match(/(1[89]\d{2}|20\d{2})/); return m ? parseInt(m[0], 10) : Infinity; }

  function entries() {
    var arr = [];
    for (var i = 0; i < state.turns.length; i++) {
      var t = state.turns[i];
      if (t.who !== 'me') continue;
      var m = state.meta[t.id] || { year: '', kind: '回忆', weight: 0, impact: 0 };
      arr.push({ t: t, m: m, idx: i });
    }
    if (state.sort === 'year') {
      arr.sort(function (a, b) { var d = yearNum(a.m.year) - yearNum(b.m.year); return d || a.idx - b.idx; });
    } else if (state.sort === 'kind') {
      arr.sort(function (a, b) { return (KIND_ORDER[a.m.kind] || 0) - (KIND_ORDER[b.m.kind] || 0) || (yearNum(a.m.year) - yearNum(b.m.year)) || a.idx - b.idx; });
    } else if (state.sort === 'weight') {
      arr.sort(function (a, b) { return (b.m.weight || 0) - (a.m.weight || 0) || a.idx - b.idx; });
    } else {
      arr.sort(function (a, b) { return (b.m.impact || 0) - (a.m.impact || 0) || a.idx - b.idx; });
    }
    return arr;
  }

  function renderStats() {
    var arr = entries();
    var years = [], marked = 0;
    for (var i = 0; i < arr.length; i++) {
      var y = yearNum(arr[i].m.year);
      if (isFinite(y)) years.push(y);
      if (arr[i].m.year || arr[i].m.weight || arr[i].m.impact) marked++;
    }
    var span = years.length ? (Math.min.apply(null, years) === Math.max.apply(null, years) ? Math.min.apply(null, years) + ' 年' : Math.min.apply(null, years) + '–' + Math.max.apply(null, years) + ' 年') : '年代未标';
    el.statSum.innerHTML = '共 <b>' + arr.length + '</b> 条 · 已标注 <b>' + marked + '</b> · 跨度 <b>' + span + '</b>';
    el.statNote.textContent = '按' + SORTS[state.sort];

    if (!arr.length) {
      el.statList.innerHTML = '<div class="stat-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 20V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v14"/><path d="M9 8h6M9 12h4"/><path d="M3 20h18"/></svg><p>还没有可统计的对话。在左侧访谈里说一段，条目会自动归档到这里。</p></div>';
      return;
    }

    var out = '';
    for (var j = 0; j < arr.length; j++) {
      var it = arr[j], m = it.m;
      var dotsW = '', dotsI = '';
      for (var w = 1; w <= 3; w++) {
        dotsW += '<button type="button" class="dot' + ((m.weight || 0) >= w ? ' is-on' : '') + '" data-dot="weight" data-v="' + w + '" aria-label="重要程度 ' + w + '"></button>';
        dotsI += '<button type="button" class="dot' + ((m.impact || 0) >= w ? ' is-on' : '') + '" data-dot="impact" data-v="' + w + '" aria-label="影响 ' + w + '"></button>';
      }
      var kindOpts = '';
      for (var k = 0; k < KINDS.length; k++) kindOpts += '<option' + (m.kind === KINDS[k] ? ' selected' : '') + '>' + KINDS[k] + '</option>';
      out += '<div class="stat-row" data-tid="' + esc(it.t.id) + '">'
        + '<div class="sr-top"><span class="sr-no">' + (j + 1 < 10 ? '0' : '') + (j + 1) + '</span>'
        + '<p class="sr-quote" title="' + esc(it.t.text) + '">' + esc(it.t.text) + '</p></div>'
        + '<div class="sr-meta">'
        + '<input class="sr-year" type="text" placeholder="年代" value="' + esc(m.year) + '" data-f="year" aria-label="年代" />'
        + '<select class="sr-kind" data-f="kind" aria-label="类型">' + kindOpts + '</select>'
        + '<div class="dots" title="重要程度"><span class="dot-k">重</span>' + dotsW + '</div>'
        + '<div class="dots" title="影响"><span class="dot-k">影</span>' + dotsI + '</div>'
        + '</div></div>';
    }
    el.statList.innerHTML = out;
  }

  function renderSortTabs() {
    Array.prototype.forEach.call(el.sortTabs.querySelectorAll('.sort-b'), function (b) {
      var on = b.getAttribute('data-sort') === state.sort;
      b.classList.toggle('is-on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  function syncControls() {
    renderSortTabs();
    el.model.value = state.model;
    el.autoArc.checked = state.autoArchive;
    Array.prototype.forEach.call(el.lenRow.querySelectorAll('.ms-b'), function (b) {
      b.classList.toggle('is-on', b.getAttribute('data-len') === state.replyLen);
    });
    renderLenNote();
  }

  /* ─── 书写页 ─────────────────────────────────────────────────── */
  function countChars(s) { return String(s == null ? '' : s).replace(/\s+/g, '').length; }
  function activeChapter() {
    var list = state.draft.chapters;
    if (!list.length) list.push({ id: 'c1', title: '', text: '' });
    if (state.draft.active < 0 || state.draft.active >= list.length) state.draft.active = 0;
    return list[state.draft.active];
  }
  function updateWordCount() { el.wordCount.textContent = countChars(activeChapter().text); }
  function cid() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
  function cnNum(n) {
    var d = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
    if (n <= 9) return d[n];
    if (n === 10) return '十';
    if (n < 20) return '十' + d[n % 10];
    if (n < 100) return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
    return String(n);
  }

  var draftTimer = 0, noteTimer = 0, stampTimer = 0;
  function noteWrite(text) {
    el.writeNote.textContent = text;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { el.writeNote.textContent = '本机自动保存'; }, 1800);
  }
  function setSaveStamp(text) {
    if (!el.saveStamp) return;
    el.saveStamp.textContent = text;
    el.saveStamp.classList.add('is-live');
    clearTimeout(stampTimer);
    stampTimer = setTimeout(function () {
      el.saveStamp.textContent = '自动保存';
      el.saveStamp.classList.remove('is-live');
    }, 2200);
  }
  function saveDraftSoon() {
    clearTimeout(draftTimer);
    draftTimer = setTimeout(function () {
      save();
      noteWrite('已保存');
      setSaveStamp('已自动保存');
    }, 500);
  }

  function draftWords(d) {
    var n = 0;
    (d.chapters || []).forEach(function (c) { n += countChars(c.text); });
    return n;
  }
  function fmtSaveTime(t) {
    var d = new Date(t || Date.now());
    var p = function (n) { return ('0' + n).slice(-2); };
    return p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function updateSaveMeta() {
    if (el.saveCount) el.saveCount.textContent = state.saves.length;
    if (el.saveLibBtn) el.saveLibBtn.title = '书稿存档 · 共 ' + state.saves.length + ' 份';
  }
  function renderSavePop() {
    if (!el.savePop) return;
    var out = '<div class="save-pop-head"><span>书稿存档</span><em>最多 20 份</em></div>';
    if (!state.saves.length) {
      out += '<div class="save-empty">还没有手动存档<br><span>点「保存」会把当前书稿存成一份快照</span></div>';
    } else {
      out += '<div class="save-list">';
      state.saves.forEach(function (s) {
        out += '<div class="save-row"><div class="save-row-main"><b>' + esc(s.name) + '</b>'
          + '<em>' + fmtSaveTime(s.at) + ' · ' + s.words + ' 字 · ' + s.draft.chapters.length + ' 章</em></div>'
          + '<div class="save-row-acts"><button type="button" data-save-load="' + esc(s.id) + '">读取</button>'
          + '<button type="button" data-save-del="' + esc(s.id) + '">删除</button></div></div>';
      });
      out += '</div>';
    }
    out += '<p class="save-pop-note">读取会覆盖当前书稿，访谈对话不受影响。</p>';
    el.savePop.innerHTML = out;
  }
  function setSavePop(open) {
    if (!el.savePop) return;
    if (open) {
      if (!el.bookPop.hidden) setBookPop(false);
      if (!el.tocPop.hidden) setTOC(false);
      renderSavePop();
    }
    el.savePop.hidden = !open;
    el.saveLibBtn.classList.toggle('is-on', open);
    el.saveLibBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  function saveNow() {
    save();
    var nm = el.saveName ? el.saveName.value.trim().replace(/\s+/g, ' ').slice(0, 24) : '';
    var now = Date.now();
    if (!nm) nm = '手动存档 · ' + fmtSaveTime(now);
    state.saves.unshift({
      id: 's' + now.toString(36) + Math.random().toString(36).slice(2, 5),
      name: nm,
      at: now,
      words: draftWords(state.draft),
      draft: cleanDraft(JSON.parse(JSON.stringify(state.draft)))
    });
    if (state.saves.length > 20) state.saves.length = 20;
    save();
    if (el.saveName) el.saveName.value = '';
    updateSaveMeta();
    renderSavePop();
    noteWrite('已保存 · ' + nm);
    setSaveStamp('已手动保存');
  }
  function loadSave(id) {
    var s = null;
    for (var i = 0; i < state.saves.length; i++) if (state.saves[i].id === id) s = state.saves[i];
    if (!s) return;
    if (!confirm('读取「' + s.name + '」？当前书稿会被覆盖，访谈对话不受影响。')) return;
    state.draft = cleanDraft(JSON.parse(JSON.stringify(s.draft)));
    activeBookObj().draft = state.draft;
    save();
    loadSheet();
    renderSavePop();
    updateSaveMeta();
    updateBookMeta();
    setSavePop(false);
    noteWrite('已读取 · ' + s.name);
    setSaveStamp('已读取存档');
  }
  function deleteSave(id) {
    var idx = -1;
    for (var i = 0; i < state.saves.length; i++) if (state.saves[i].id === id) idx = i;
    if (idx < 0) return;
    if (!confirm('删除存档「' + state.saves[idx].name + '」？')) return;
    state.saves.splice(idx, 1);
    save();
    renderSavePop();
    updateSaveMeta();
    noteWrite('已删除存档');
  }

  /* ─── 自传书架 ───────────────────────────────────────────────── */
  function updateBookMeta() {
    if (!el.bookBtn) return;
    var b = activeBookObj();
    var idx = state.books.indexOf(b) + 1;
    el.bookCount.textContent = idx + '/' + state.books.length;
    el.bookBtn.title = '切换自传 · 第 ' + idx + ' / ' + state.books.length + ' 本';
  }
  function renderBookPop() {
    if (!el.bookPop) return;
    var out = '<div class="book-pop-head"><span>自传书架</span><em>共 ' + state.books.length + ' 本 · 最多 12 本</em></div><div class="book-list">';
    state.books.forEach(function (b) {
      var cur = b.id === state.activeBook;
      out += '<div class="book-row' + (cur ? ' is-on' : '') + '" role="button" tabindex="0" data-book="' + esc(b.id) + '" aria-pressed="' + cur + '">'
        + '<span class="book-main"><b>' + esc(bookName(b)) + '</b>'
        + '<em>' + b.draft.chapters.length + ' 章 · ' + draftWords(b.draft) + ' 字 · ' + (b.at ? fmtSaveTime(b.at) : '新自传') + '</em></span>'
        + (cur ? '<span class="book-cur">在写</span>' : '')
        + (state.books.length > 1 ? '<button type="button" class="book-x" data-book-del="' + esc(b.id) + '" aria-label="删除' + esc(bookName(b)) + '" title="删除这本自传">×</button>' : '')
        + '</div>';
    });
    out += '</div><div class="book-new"><input id="bookNewName" type="text" placeholder="新自传名字（可选）" aria-label="新自传名字" autocomplete="off" /><button type="button" class="book-add" id="bookAdd">＋ 新建</button></div>';
    out += '<p class="book-pop-note">每本自传各有独立的书稿、访谈与存档，切换不会丢失内容。</p>';
    el.bookPop.innerHTML = out;
  }
  function setBookPop(open) {
    if (!el.bookPop) return;
    if (open) {
      if (!el.tocPop.hidden) setTOC(false);
      if (!el.savePop.hidden) setSavePop(false);
      renderBookPop();
    }
    el.bookPop.hidden = !open;
    el.bookBtn.classList.toggle('is-on', open);
    el.bookBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  function refreshBookView() {
    loadSheet();
    renderChat();
    renderStats();
    renderSetup();
    renderSortTabs();
    renderLenNote();
    updateSaveMeta();
    renderSavePop();
    updateBookMeta();
  }
  function switchBook(id) {
    var target = null;
    for (var i = 0; i < state.books.length; i++) if (state.books[i].id === id) target = state.books[i];
    if (!target) { setBookPop(false); return; }
    if (target.id !== state.activeBook) {
      clearTimeout(replyTimer);
      typingOn = false;
      save();
      state.activeBook = target.id;
      syncActive();
      lastMeText = '';
      for (var j = state.turns.length - 1; j >= 0; j--) {
        if (state.turns[j].who === 'me') { lastMeText = state.turns[j].text; break; }
      }
      save();
      if (el.saveName) el.saveName.value = '';
      refreshBookView();
      noteWrite('已切换到「' + bookName(target) + '」');
      setSaveStamp('已切换自传');
    }
    setBookPop(false);
  }
  function addBook() {
    var nameEl = $('bookNewName');
    var nm = nameEl ? nameEl.value.trim().replace(/\s+/g, ' ').slice(0, 24) : '';
    if (state.books.length >= 12) {
      noteWrite('最多 12 本自传');
      if (nameEl) nameEl.focus();
      return;
    }
    clearTimeout(replyTimer);
    typingOn = false;
    lastMeText = '';
    save();
    var id = newBookId();
    while (state.books.some(function (b) { return b.id === id; })) id = newBookId();
    var b = {
      id: id,
      at: Date.now(),
      draft: cleanDraft({ book: nm }),
      turns: [],
      meta: {},
      saves: []
    };
    state.books.push(b);
    state.activeBook = b.id;
    syncActive();
    save();
    if (el.saveName) el.saveName.value = '';
    refreshBookView();
    setBookPop(false);
    noteWrite('已新建自传');
    setSaveStamp('已新建自传');
    el.bookTitle.focus();
    try { el.bookTitle.setSelectionRange(el.bookTitle.value.length, el.bookTitle.value.length); } catch (err) {}
  }
  function deleteBook(id) {
    if (state.books.length <= 1) return;
    var idx = -1;
    for (var i = 0; i < state.books.length; i++) if (state.books[i].id === id) idx = i;
    if (idx < 0) return;
    var b = state.books[idx];
    if (!confirm('删除自传「' + bookName(b) + '」？其中的书稿、访谈与存档都会删除。')) return;
    var wasActive = b.id === state.activeBook;
    state.books.splice(idx, 1);
    if (wasActive) {
      clearTimeout(replyTimer);
      typingOn = false;
      lastMeText = '';
      var next = state.books[Math.min(idx, state.books.length - 1)];
      state.activeBook = next.id;
      syncActive();
      if (el.saveName) el.saveName.value = '';
      refreshBookView();
    }
    save();
    updateBookMeta();
    renderBookPop();
    noteWrite('已删除自传');
  }

  function loadSheet() {
    var ch = activeChapter();
    el.bookTitle.value = state.draft.book;
    el.chapterTitle.value = ch.title;
    el.manuscript.value = ch.text;
    updateWordCount();
    if (!el.tocPop.hidden) renderTOC();
  }

  function renderTOC() {
    var list = state.draft.chapters, total = 0;
    var rows = '';
    for (var i = 0; i < list.length; i++) {
      var ch = list[i];
      total += countChars(ch.text);
      var n = i + 1;
      rows += '<div class="toc-row' + (i === state.draft.active ? ' is-on' : '') + '" role="button" tabindex="0" data-ch="' + i + '" aria-pressed="' + (i === state.draft.active) + '">'
        + '<span class="toc-no">' + (n < 10 ? '0' : '') + n + '</span>'
        + '<span class="toc-name">' + esc(ch.title || '未命名章节') + '</span>'
        + '<span class="toc-words">' + countChars(ch.text) + '</span>'
        + (list.length > 1 ? '<button type="button" class="toc-x" data-toc-del="' + i + '" aria-label="删除' + esc(ch.title || '未命名章节') + '">×</button>' : '')
        + '</div>';
    }
    el.tocPop.innerHTML = '<div class="toc-head"><span class="toc-title">目录 · <b>' + list.length + '</b> 章</span><span class="toc-total">共 ' + total + ' 字</span></div>'
      + '<div class="toc-list">' + rows + '</div>'
      + '<button type="button" class="toc-add" id="tocAdd">+ 新建章节</button>';
  }

  function setTOC(open) {
    if (open) {
      if (!el.bookPop.hidden) setBookPop(false);
      if (!el.savePop.hidden) setSavePop(false);
      renderTOC();
    }
    el.tocPop.hidden = !open;
    el.tocBtn.classList.toggle('is-on', open);
    el.tocBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  el.bookTitle.addEventListener('input', function () {
    state.draft.book = el.bookTitle.value;
    updateBookMeta();
    saveDraftSoon();
  });
  el.chapterTitle.addEventListener('input', function () {
    activeChapter().title = el.chapterTitle.value;
    if (!el.tocPop.hidden) renderTOC();
    saveDraftSoon();
  });
  el.manuscript.addEventListener('input', function () {
    activeChapter().text = el.manuscript.value;
    updateWordCount();
    if (!el.tocPop.hidden) renderTOC();
    saveDraftSoon();
  });

  el.tocBtn.addEventListener('click', function () {
    setTOC(el.tocPop.hidden);
  });
  el.tocPop.addEventListener('click', function (e) {
    var del = e.target.closest && e.target.closest('[data-toc-del]');
    if (del) {
      var di = parseInt(del.getAttribute('data-toc-del'), 10);
      var target = state.draft.chapters[di];
      if (!target || state.draft.chapters.length <= 1) return;
      if (!confirm('删除「' + (target.title || '未命名章节') + '」？这一章的正文也会删除。')) return;
      state.draft.chapters.splice(di, 1);
      delete state.draft.gathered[target.id];
      if (state.draft.active > di) state.draft.active--;
      else if (state.draft.active === di) state.draft.active = Math.max(0, di - 1);
      if (state.draft.active >= state.draft.chapters.length) state.draft.active = state.draft.chapters.length - 1;
      save(); loadSheet(); renderTOC(); noteWrite('已删除章节');
      return;
    }
    if (e.target.closest && e.target.closest('#tocAdd')) {
      var n = state.draft.chapters.length + 1;
      state.draft.chapters.push({ id: cid(), title: '第' + cnNum(n) + '章 · ', text: '' });
      state.draft.active = state.draft.chapters.length - 1;
      save(); loadSheet(); renderTOC();
      el.chapterTitle.focus();
      try { el.chapterTitle.setSelectionRange(el.chapterTitle.value.length, el.chapterTitle.value.length); } catch (err) {}
      return;
    }
    var row = e.target.closest && e.target.closest('[data-ch]');
    if (!row) return;
    var idx = parseInt(row.getAttribute('data-ch'), 10);
    if (idx === state.draft.active) { setTOC(false); return; }
    state.draft.active = idx;
    save(); loadSheet(); setTOC(false);
  });
  el.tocPop.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var row = e.target.closest && e.target.closest('[data-ch]');
    if (!row || e.target !== row) return;
    e.preventDefault(); row.click();
  });
  document.addEventListener('click', function (e) {
    if (el.tocPop.hidden) return;
    if (e.target.closest && (e.target.closest('#tocPop') || e.target.closest('#tocBtn'))) return;
    setTOC(false);
  });

  el.saveNowBtn.addEventListener('click', saveNow);
  el.saveLibBtn.addEventListener('click', function () { setSavePop(el.savePop.hidden); });
  el.saveName.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); saveNow(); }
  });
  el.savePop.addEventListener('click', function (e) {
    var loadBtn = e.target.closest && e.target.closest('[data-save-load]');
    if (loadBtn) { loadSave(loadBtn.getAttribute('data-save-load')); return; }
    var delBtn = e.target.closest && e.target.closest('[data-save-del]');
    if (delBtn) deleteSave(delBtn.getAttribute('data-save-del'));
  });
  document.addEventListener('click', function (e) {
    if (el.savePop.hidden) return;
    if (e.target.closest && (e.target.closest('#savePop') || e.target.closest('#saveLibBtn'))) return;
    setSavePop(false);
  });

  el.bookBtn.addEventListener('click', function () { setBookPop(el.bookPop.hidden); });
  el.bookPop.addEventListener('click', function (e) {
    var del = e.target.closest && e.target.closest('[data-book-del]');
    if (del) { deleteBook(del.getAttribute('data-book-del')); return; }
    if (e.target.closest && e.target.closest('#bookAdd')) { addBook(); return; }
    var row = e.target.closest && e.target.closest('[data-book]');
    if (row) switchBook(row.getAttribute('data-book'));
  });
  el.bookPop.addEventListener('keydown', function (e) {
    if (e.target && e.target.id === 'bookNewName') {
      if (e.key === 'Enter') { e.preventDefault(); addBook(); }
      return;
    }
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var row = e.target.closest && e.target.closest('[data-book]');
    if (!row || e.target !== row) return;
    e.preventDefault();
    switchBook(row.getAttribute('data-book'));
  });
  document.addEventListener('click', function (e) {
    if (el.bookPop.hidden) return;
    if (e.target.closest && (e.target.closest('#bookPop') || e.target.closest('#bookBtn'))) return;
    setBookPop(false);
  });

  el.gatherBtn.addEventListener('click', function () {
    var ch = activeChapter();
    var users = state.turns.filter(function (t) { return t.who === 'me'; });
    var from = Math.min(state.draft.gathered[ch.id] || 0, users.length);
    var fresh = users.slice(from);
    if (!fresh.length) {
      noteWrite('没有新的讲述可整理');
      return;
    }
    if (!confirm('把访谈里你自己的 ' + fresh.length + ' 段讲述整理进「' + (ch.title || '当前章节') + '」？')) return;
    var add = fresh.map(function (t) { return t.text.trim(); }).filter(Boolean).join('\n\n');
    var base = ch.text.replace(/\s+$/, '');
    ch.text = add ? (base ? base + '\n\n' : '') + add : base;
    state.draft.gathered[ch.id] = users.length;
    el.manuscript.value = ch.text;
    updateWordCount();
    if (!el.tocPop.hidden) renderTOC();
    save();
    noteWrite('已整理 ' + fresh.length + ' 段访谈');
  });

  loadSheet();
  updateSaveMeta();
  renderSavePop();
  updateBookMeta();

  function renderAll() {
    renderSetup();
    renderChat();
    renderStats();
    renderSortTabs();
  }

  function sysNote(text) {
    state.turns.push({ id: uid(), who: 'sys', text: text, ts: Date.now() });
  }

  el.styleRow.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-style]');
    if (!b) return;
    state.style = b.getAttribute('data-style');
    save(); renderSetup(); renderChat();
  });
  el.toneRow.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-tone]');
    if (!b) return;
    state.tone = b.getAttribute('data-tone');
    save(); renderSetup();
  });

  el.roleGrid.addEventListener('click', function (e) {
    var del = e.target.closest && e.target.closest('[data-role-del]');
    if (del) {
      var rid = del.getAttribute('data-role-del');
      state.customRoles = state.customRoles.filter(function (r) { return r.id !== rid; });
      if (state.role === rid) state.role = 'teacher';
      save(); renderSetup(); renderChat(); renderStats();
      return;
    }
    var card = e.target.closest && e.target.closest('[data-role]');
    if (!card) return;
    var id = card.getAttribute('data-role');
    if (id === state.role) return;
    state.role = id;
    sysNote('对话角色切换为「' + roleById(id).name + '」');
    save(); renderSetup(); renderChat();
  });
  el.roleGrid.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var card = e.target.closest && e.target.closest('[data-role]');
    if (!card) return;
    e.preventDefault(); card.click();
  });

  var lastFocus = null;
  function openModal() {
    lastFocus = document.activeElement;
    el.roleModal.hidden = false;
    el.roleErr.textContent = '';
    el.roleName.value = ''; el.roleRel.value = ''; el.roleTone.value = '';
    setTimeout(function () { el.roleName.focus(); }, 30);
  }
  function closeModal() {
    el.roleModal.hidden = true;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  el.roleAdd.addEventListener('click', openModal);
  el.roleCancel.addEventListener('click', closeModal);
  el.roleModal.addEventListener('click', function (e) { if (e.target === el.roleModal) closeModal(); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!el.roleModal.hidden) closeModal();
    else if (!el.bookPop.hidden) setBookPop(false);
    else if (!el.savePop.hidden) setSavePop(false);
    else if (!el.tocPop.hidden) setTOC(false);
  });
  el.roleSave.addEventListener('click', function () {
    var name = el.roleName.value.trim();
    if (!name) { el.roleErr.textContent = '先给这个人设一个称呼。'; el.roleName.focus(); return; }
    var rel = el.roleRel.value.trim();
    var tone = el.roleTone.value.trim();
    var desc = (rel || '自定义角色') + (tone ? ' · ' + tone : '');
    var id = 'c' + Date.now().toString(36);
    state.customRoles.push({ id: id, name: name, desc: desc });
    state.role = id;
    sysNote('已添加人设「' + name + '」并切换');
    save(); closeModal(); renderSetup(); renderChat();
  });

  el.send.addEventListener('click', send);
  el.input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  el.chatClear.addEventListener('click', function () {
    if (!state.turns.length) return;
    if (confirm('清空当前访谈与统计标注？书写页内容会保留。')) {
      var book = activeBookObj();
      state.turns = []; state.meta = {}; state.draft.gathered = {};
      book.turns = state.turns;
      book.meta = state.meta;
      lastMeText = '';
      typingOn = false; clearTimeout(replyTimer);
      save(); renderChat(); renderStats(); renderLenNote();
    }
  });

  el.model.addEventListener('change', function () {
    state.model = el.model.value;
    save();
    el.saveNote && (el.saveNote.innerHTML = '<i></i>已保存 · ' + esc(state.model));
    setTimeout(function () { if (el.saveNote) el.saveNote.innerHTML = '<i></i>访谈与书稿 · 本机'; }, 1600);
  });

  el.setBtn.addEventListener('click', function () {
    var open = el.memSet.hidden;
    el.memSet.hidden = !open;
    el.setBtn.classList.toggle('is-on', open);
    el.setBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  el.lenRow.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-len]');
    if (!b) return;
    state.replyLen = b.getAttribute('data-len');
    save(); syncControls();
  });
  el.autoArc.addEventListener('change', function () {
    state.autoArchive = el.autoArc.checked;
    save();
  });
  document.addEventListener('click', function (e) {
    if (el.memSet.hidden) return;
    if (e.target.closest && (e.target.closest('#memSet') || e.target.closest('#memSetBtn'))) return;
    el.memSet.hidden = true;
    el.setBtn.classList.remove('is-on');
    el.setBtn.setAttribute('aria-expanded', 'false');
  });

  el.sortTabs.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-sort]');
    if (!b) return;
    state.sort = b.getAttribute('data-sort');
    save(); renderSortTabs(); renderStats();
  });

  el.statList.addEventListener('change', function (e) {
    var f = e.target;
    var row = f.closest && f.closest('.stat-row');
    if (!row) return;
    var tid = row.getAttribute('data-tid');
    var m = state.meta[tid] || (state.meta[tid] = { year: '', kind: '回忆', weight: 0, impact: 0 });
    var key = f.getAttribute('data-f');
    if (key === 'year') m.year = f.value.trim();
    else if (key === 'kind') m.kind = f.value;
    else return;
    save(); renderStats();
  });
  el.statList.addEventListener('click', function (e) {
    var dot = e.target.closest && e.target.closest('[data-dot]');
    if (!dot) return;
    var row = dot.closest('.stat-row');
    var tid = row.getAttribute('data-tid');
    var m = state.meta[tid] || (state.meta[tid] = { year: '', kind: '回忆', weight: 0, impact: 0 });
    var key = dot.getAttribute('data-dot');
    var v = parseInt(dot.getAttribute('data-v'), 10) || 0;
    m[key] = (m[key] || 0) === v ? 0 : v;
    save(); renderStats();
  });

  renderAll();
  syncControls();
  if (QB_PROJ) {
    fetch('/api/projects/' + QB_PROJ).then(function (r) { return r.json(); }).then(function (p) {
      if (!p || !Array.isArray(p.notes)) return;
      var n = p.notes.filter(function (x) { return x && x.kind === 'memoir'; })[0];
      if (!n) return;
      try { localStorage.setItem('qibi.memoir.noteId.' + QB_PROJ, n.id); } catch (e) { }
      try {
        var st = JSON.parse(n.content || '{}');
        if (st && Array.isArray(st.books) && st.books.length) {
          state = st;
          syncActive();
          renderAll();
          syncControls();
        }
      } catch (e) { }
    }).catch(function () { });
  }
})();
</script>
  <script src="qibi-avatar.js?v=3"></script>
</body>
</html>
