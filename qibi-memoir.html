<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>启笔 QIBI · 自传</title>
<link rel="icon" type="image/png" href="app-icon.png" />
<style>
  :root {
    --bg:      oklch(15% 0.010 262);
    --surface: oklch(23% 0.011 262);
    --fg:      oklch(94% 0.006 90);
    --muted:   oklch(73% 0.010 90);
    --border:  oklch(96% 0.006 90 / 0.13);
    --accent:  oklch(55% 0.17 28);

    --ink-soft:      oklch(96% 0.006 90 / 0.055);
    --ink-hair:      oklch(96% 0.006 90 / 0.16);
    --ink-dash:      oklch(96% 0.006 90 / 0.26);
    --accent-soft:   oklch(60% 0.17 28 / 0.17);
    --accent-line:   oklch(62% 0.17 28 / 0.44);
    --accent-bright: oklch(73% 0.15 32);
    --accent-ink:    oklch(98% 0.008 30);
    --scrim:         oklch(11% 0.012 262);

    --font-display: 'Iowan Old Style', 'Charter', Georgia, 'Songti SC', 'STSong', 'Source Han Serif SC', 'Noto Serif SC', 'SimSun', serif;
    --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    --font-mono:    ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;

    --r-sm: 9px; --r-md: 12px; --r-lg: 15px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .bg-photo {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: var(--bg) url("%E6%B0%B4%E5%A2%A8%E5%B0%91%E5%A5%B3-%E5%A4%9C%E8%89%B2.png") center / cover no-repeat;
  }
  .bg-scrim {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      linear-gradient(180deg, oklch(9% 0.012 262 / 0.05), transparent 60%, oklch(10% 0.012 262 / 0.03)),
      linear-gradient(103deg, oklch(8% 0.012 262 / 0.05) 0%, oklch(10% 0.012 262 / 0.02) 52%, oklch(12% 0.012 262 / 0) 100%);
  }
  img, svg { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  h1, h2, h3, h4, p { margin: 0; }
  :where(button, select, input, textarea, [tabindex]):focus-visible {
    outline: 2px solid var(--accent-bright); outline-offset: 2px;
  }

  .app {
    position: relative; z-index: 1; height: 100vh;
    display: grid;
    grid-template-columns: 66px minmax(0, 1fr);
    grid-template-rows: 58px minmax(0, 1fr);
  }
  .appbar {
    grid-column: 1 / -1; grid-row: 1;
    display: flex; align-items: center; gap: 14px; padding: 0 18px 0 20px;
    border-bottom: 1px solid var(--border);
    background: var(--scrim);
  }
  .brand { display: flex; align-items: center; gap: 10px; flex: none; }
  .app-icon { width: 34px; height: 34px; flex: none; border-radius: 9px; object-fit: contain; box-shadow: 0 1px 3px oklch(0% 0 0 / 0.45), 0 0 0 1px var(--border); }
  .brand-name { font-family: var(--font-display); font-size: 16px; font-weight: 600; letter-spacing: 0.02em; line-height: 1.1; }
  .brand-sub { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--muted); letter-spacing: 0.14em; margin-top: 1px; }
  .crumb { display: flex; align-items: center; gap: 8px; flex: none; padding-left: 14px; border-left: 1px solid var(--border); font-size: 12.5px; color: var(--muted); }
  .crumb-sep { color: var(--ink-dash); }
  .crumb-cur { color: var(--fg); font-weight: 500; }
  .app-note { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.08em; color: var(--muted); }
  .app-note i { width: 6px; height: 6px; border-radius: 999px; background: var(--accent-bright); }

  .rail { grid-column: 1; grid-row: 2; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 12px 0 14px; overflow: hidden; border-right: 1px solid var(--border); background: color-mix(in oklch, var(--scrim) 26%, transparent); }
  .rail-btn { width: 54px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; border-radius: 12px; border: 1px solid transparent; background: transparent; color: var(--muted); font-size: 10px; letter-spacing: 0.02em; transition: background .14s, color .14s, border-color .14s; }
  .rail-btn svg { width: 19px; height: 19px; }
  .rail-btn:hover { background: var(--ink-soft); color: var(--fg); }
  .rail-btn.is-active { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-bright); }
  .rail-spacer { flex: 1; }
  .rail-avatar { width: 34px; height: 34px; border-radius: 999px; flex: none; display: grid; place-items: center; color: var(--muted); background: var(--ink-soft); border: 1px dashed var(--ink-dash); }
  .rail-avatar svg { width: 17px; height: 17px; }

  .canvas { grid-column: 2; grid-row: 2; min-height: 0; overflow: hidden; }

  /* 1/5 访谈 · 3/5 书写 · 1/5 设定与统计 —— 面板不做背景虚化 */
  .mem {
    height: 100%; min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 3fr) minmax(0, 1fr);
    gap: 12px; padding: 14px 16px 16px;
  }

  .pane {
    min-height: 0; display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid var(--border); border-radius: var(--r-md);
    background: color-mix(in oklch, var(--scrim) 46%, transparent);
  }
  .pane-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--border); }
  .pane-k { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: 0.14em; color: var(--muted); white-space: nowrap; }
  .pane-k b { color: var(--accent-bright); font-weight: 600; margin-right: 4px; }
  .pane-note { margin-left: auto; font-family: var(--font-mono); font-size: 8.5px; color: var(--muted); letter-spacing: 0.06em; white-space: nowrap; }

  /* ─── 左 1/5：访谈对话 ────────────────────────────────────────── */
  .chat { position: relative; }
  .chat-head { flex: none; display: flex; align-items: flex-start; gap: 8px; padding: 11px 12px 9px; border-bottom: 1px solid var(--border); }
  .chat-kicker { display: block; font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.16em; color: var(--muted); margin-bottom: 3px; }
  .chat-title { font-family: var(--font-display); font-size: 16.5px; font-weight: 600; letter-spacing: 0.02em; line-height: 1.2; }
  .chat-role { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 10.5px; color: var(--muted); }
  .chat-role i { width: 5px; height: 5px; border-radius: 999px; background: var(--accent-bright); flex: none; }
  .chat-clear { margin-left: auto; width: 26px; height: 26px; flex: none; display: grid; place-items: center; border-radius: 7px; border: 1px solid transparent; background: transparent; color: var(--muted); transition: .14s; }
  .chat-clear:hover { background: var(--ink-soft); border-color: var(--border); color: var(--fg); }
  .chat-clear svg { width: 14px; height: 14px; }

  .chat-log { flex: 1; min-height: 0; overflow-y: auto; padding: 11px 10px 12px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; scrollbar-color: var(--ink-dash) transparent; }
  .msg { max-width: 92%; padding: 7px 9px; border-radius: 11px; font-size: 12px; line-height: 1.62; word-break: break-word; }
  .msg .who { display: block; font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 3px; }
  .msg.ai { align-self: flex-start; background: var(--ink-soft); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .msg.me { align-self: flex-end; background: var(--accent-soft); border: 1px solid var(--accent-line); border-top-right-radius: 4px; }
  .msg.me .who { color: var(--accent-bright); }
  .msg.sys { align-self: center; max-width: 92%; padding: 3px 10px; border-radius: 999px; border: 1px dashed var(--ink-hair); background: transparent; color: var(--muted); font-size: 9.5px; text-align: center; }
  .typing { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; padding: 9px 11px; border-radius: 11px; border-top-left-radius: 4px; background: var(--ink-soft); border: 1px solid var(--border); }
  .typing i { width: 5px; height: 5px; border-radius: 999px; background: var(--muted); animation: blink 1s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .16s; }
  .typing i:nth-child(3) { animation-delay: .32s; }
  @keyframes blink { 0%, 70%, 100% { opacity: .25; } 35% { opacity: 1; } }

  .chat-compose { position: relative; flex: none; padding: 8px 10px 10px; border-top: 1px solid var(--border); background: color-mix(in oklch, var(--scrim) 30%, transparent); }
  .compose-top { display: flex; align-items: center; gap: 5px; margin-bottom: 7px; flex-wrap: wrap; }
  .model-pick { display: inline-flex; align-items: center; gap: 5px; flex: none; font-size: 9.5px; color: var(--muted); }
  .model-pick select {
    max-width: 112px; font-family: var(--font-body); font-size: 10px; color: var(--fg);
    background: var(--ink-soft); border: 1px solid var(--border); border-radius: 7px;
    padding: 3px 5px; cursor: pointer;
  }
  .model-pick select option { background: var(--surface); color: var(--fg); }
  .set-btn { width: 23px; height: 23px; flex: none; display: grid; place-items: center; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--muted); }
  .set-btn:hover, .set-btn.is-on { background: var(--ink-soft); border-color: var(--border); color: var(--fg); }
  .set-btn svg { width: 13px; height: 13px; }
  .compose-style { margin-left: auto; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--ink-soft); font-size: 9px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52%; }

  .compose-box { display: flex; align-items: flex-end; gap: 7px; }
  .compose-box textarea {
    flex: 1; min-width: 0; height: 54px; max-height: 96px; resize: none;
    padding: 8px 9px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--ink-soft); color: var(--fg); font: inherit; font-size: 12px; line-height: 1.55;
  }
  .compose-box textarea::placeholder { color: var(--muted); opacity: .8; }
  .compose-box textarea:focus { outline: 0; border-color: var(--accent-line); box-shadow: 0 0 0 2px var(--accent-soft); }
  .send-btn { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 9px; border: 1px solid var(--accent-line); background: var(--accent); color: var(--accent-ink); transition: background .14s; }
  .send-btn:hover { background: color-mix(in oklch, var(--accent) 84%, oklch(0% 0 0)); }
  .send-btn svg { width: 15px; height: 15px; }
  .compose-hint { margin-top: 6px; font-size: 8.5px; line-height: 1.5; color: var(--muted); opacity: .78; }

  .mem-set {
    position: absolute; right: 8px; bottom: calc(100% + 6px); z-index: 40; width: 206px;
    padding: 10px; border-radius: 11px; border: 1px solid var(--border);
    background: var(--surface); box-shadow: 0 18px 48px oklch(6% 0.01 262 / 0.55);
  }
  .mem-set[hidden] { display: none; }
  .ms-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ms-label { font-size: 10px; color: var(--muted); }
  .ms-chips { display: flex; gap: 3px; }
  .ms-b { padding: 2px 6px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 9.5px; }
  .ms-b.is-on { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-bright); }
  .ms-len-note { margin-top: 5px; font-size: 8.5px; line-height: 1.5; color: var(--muted); opacity: .78; }
  .ms-toggle { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 10px; color: var(--muted); cursor: pointer; }
  .ms-toggle input { accent-color: var(--accent); width: 13px; height: 13px; }
  .ms-note { margin-top: 7px; font-size: 8.5px; color: var(--muted); opacity: .7; }

  /* ─── 中 3/5：书写页 ──────────────────────────────────────────── */
  .write { position: relative; background: color-mix(in oklch, var(--scrim) 55%, transparent); }
  .write-head { flex: none; }
  .gather-btn {
    margin-left: 2px; flex: none; padding: 4px 11px; border-radius: 999px;
    border: 1px solid var(--accent-line); background: var(--accent-soft);
    color: var(--accent-bright); font-size: 10.5px; transition: .14s;
  }
  .gather-btn:hover { background: color-mix(in oklch, var(--accent) 22%, transparent); }
  .write-sheet { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 16px 30px 6px; }
  .title-row { flex: none; display: flex; align-items: center; gap: 10px; }
  .toc-wrap { position: relative; flex: none; display: flex; align-items: center; align-self: stretch; }
  .toc-btn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--border); background: var(--ink-soft); color: var(--muted); transition: .14s; }
  .toc-btn:hover, .toc-btn.is-on { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-bright); }
  .toc-btn svg { width: 15px; height: 15px; }
  .toc-pop {
    position: absolute; top: calc(100% + 8px); left: 0; z-index: 45; width: 288px;
    display: flex; flex-direction: column; padding: 8px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface);
    box-shadow: 0 20px 60px oklch(5% 0.01 262 / 0.58);
  }
  .toc-pop[hidden] { display: none; }
  .toc-head { flex: none; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 2px 4px 7px; border-bottom: 1px solid var(--border); }
  .toc-title { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: 0.12em; color: var(--muted); }
  .toc-title b { color: var(--fg); font-weight: 600; }
  .toc-total { font-family: var(--font-mono); font-size: 8px; color: var(--muted); }
  .toc-list { min-height: 0; max-height: 252px; overflow-y: auto; padding-top: 5px; scrollbar-width: thin; scrollbar-color: var(--ink-dash) transparent; }
  .toc-row { position: relative; display: flex; align-items: baseline; gap: 7px; width: 100%; padding: 6px 24px 6px 7px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--fg); text-align: left; cursor: pointer; }
  .toc-row:hover { background: var(--ink-soft); }
  .toc-row.is-on { border-color: var(--accent-line); background: var(--accent-soft); }
  .toc-no { flex: none; font-family: var(--font-mono); font-size: 8px; color: var(--muted); }
  .toc-row.is-on .toc-no { color: var(--accent-bright); }
  .toc-name { flex: 1; min-width: 0; font-family: var(--font-display); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toc-words { flex: none; font-family: var(--font-mono); font-size: 8px; color: var(--muted); }
  .toc-x { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; display: grid; place-items: center; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-size: 12px; line-height: 1; opacity: 0; }
  .toc-row:hover .toc-x { opacity: 1; }
  .toc-x:hover { color: var(--accent-bright); background: var(--ink-soft); }
  .toc-add { flex: none; width: 100%; margin-top: 6px; padding: 6px 0; border-radius: 8px; border: 1px dashed var(--ink-dash); background: transparent; color: var(--muted); font-size: 10.5px; }
  .toc-add:hover { border-color: var(--accent-line); color: var(--accent-bright); }
  .book-wrap { position: relative; flex: none; }
  .book-btn {
    height: 30px; display: inline-flex; align-items: center; gap: 4px; padding: 0 9px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--ink-soft);
    color: var(--muted); font-size: 9.5px; transition: .14s; white-space: nowrap;
  }
  .book-btn:hover, .book-btn.is-on { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-bright); }
  .book-btn svg { width: 13px; height: 13px; }
  .book-btn b { font-family: var(--font-mono); font-size: 8.5px; font-weight: 600; letter-spacing: .02em; }
  .book-pop {
    position: absolute; top: calc(100% + 8px); left: 0; z-index: 46; width: 302px;
    display: flex; flex-direction: column; padding: 8px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface);
    box-shadow: 0 20px 60px oklch(5% 0.01 262 / 0.58);
  }
  .book-pop[hidden] { display: none; }
  .book-pop-head { flex: none; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 2px 4px 7px; border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .12em; color: var(--muted); }
  .book-pop-head em { font-style: normal; font-size: 8px; letter-spacing: .06em; }
  .book-list { min-height: 0; max-height: 246px; overflow-y: auto; padding-top: 5px; scrollbar-width: thin; scrollbar-color: var(--ink-dash) transparent; }
  .book-row { position: relative; display: flex; align-items: center; gap: 7px; padding: 7px 22px 7px 8px; border-radius: 9px; border: 1px solid transparent; cursor: pointer; }
  .book-row:hover { background: var(--ink-soft); }
  .book-row.is-on { border-color: var(--accent-line); background: var(--accent-soft); }
  .book-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .book-main b { font-family: var(--font-display); font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .book-main em { font-family: var(--font-mono); font-style: normal; font-size: 8px; letter-spacing: .04em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .book-cur { flex: none; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--accent-line); color: var(--accent-bright); font-family: var(--font-mono); font-size: 7.5px; letter-spacing: .08em; }
  .book-x { position: absolute; top: 50%; right: 4px; transform: translateY(-50%); width: 17px; height: 17px; display: grid; place-items: center; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-size: 12px; line-height: 1; opacity: 0; }
  .book-row:hover .book-x { opacity: 1; }
  .book-x:hover { color: var(--accent-bright); background: var(--ink-soft); }
  .book-new { flex: none; display: flex; gap: 5px; margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--border); }
  .book-new input { flex: 1; min-width: 0; padding: 5px 8px; border-radius: 7px; border: 1px solid var(--border); background: var(--ink-soft); color: var(--fg); font: inherit; font-size: 10.5px; }
  .book-new input::placeholder { color: var(--muted); opacity: .75; }
  .book-new input:focus { outline: 0; border-color: var(--accent-line); }
  .book-add { flex: none; padding: 4px 10px; border-radius: 7px; border: 1px solid var(--accent-line); background: var(--accent-soft); color: var(--accent-bright); font-size: 10px; }
  .book-add:hover { background: color-mix(in oklch, var(--accent) 22%, transparent); }
  .book-pop-note { flex: none; margin: 6px 2px 0; padding-top: 7px; border-top: 1px solid var(--border); font-size: 8.5px; line-height: 1.5; color: var(--muted); opacity: .85; }
  .book-title {
    flex: 1 1 auto; min-width: 0; background: transparent; border: 0; border-bottom: 1px solid transparent;
    color: var(--fg); font-family: var(--font-display); font-size: 23px; font-weight: 600;
    letter-spacing: 0.03em; padding: 2px 0 7px; transition: border-color .14s;
  }
  .book-title::placeholder { color: var(--muted); opacity: .55; }
  .book-title:focus { outline: 0; border-bottom-color: var(--accent-line); }
  .chapter-title {
    width: 100%; flex: none; background: transparent; border: 0;
    color: var(--muted); font-family: var(--font-display); font-size: 13.5px;
    letter-spacing: 0.02em; padding: 7px 0 8px; border-bottom: 1px solid var(--border);
  }
  .chapter-title::placeholder { color: var(--muted); opacity: .65; }
  .chapter-title:focus { outline: 0; color: var(--fg); border-bottom-color: var(--accent-line); }
  .manuscript {
    flex: 1; min-height: 0; width: 100%; resize: none; border: 0; background: transparent;
    color: var(--fg); font-family: var(--font-display); font-size: 15.5px; line-height: 2.05;
    letter-spacing: 0.012em; padding: 15px 0 8px;
  }
  .manuscript::placeholder { color: var(--muted); opacity: .6; }
  .manuscript:focus { outline: 0; }
  .write-foot { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 9px; padding: 8px 30px 12px; border-top: 1px solid var(--border); font-family: var(--font-mono); font-size: 8.5px; letter-spacing: 0.06em; color: var(--muted); }
  .write-foot b { color: var(--fg); font-weight: 600; }
  .write-dot { width: 3px; height: 3px; border-radius: 999px; background: var(--ink-dash); }
  .save-stamp { transition: color .16s; }
  .save-stamp.is-live { color: var(--accent-bright); }
  .save-name {
    margin-left: auto; width: 118px; min-width: 76px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--ink-soft); color: var(--fg);
    font-family: var(--font-body); font-size: 9.5px; letter-spacing: 0;
  }
  .save-name::placeholder { color: var(--muted); opacity: .75; }
  .save-name:focus { outline: 0; border-color: var(--accent-line); }
  .save-now, .save-lib {
    flex: none; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-family: var(--font-body);
    font-size: 9.5px; letter-spacing: 0; transition: .14s;
  }
  .save-now { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-bright); }
  .save-now:hover { background: color-mix(in oklch, var(--accent) 22%, transparent); }
  .save-lib:hover, .save-lib.is-on { border-color: var(--accent-line); background: var(--ink-soft); color: var(--accent-bright); }
  .save-lib b { color: inherit; }
  .save-pop {
    position: absolute; right: 24px; bottom: 56px; z-index: 55; width: 304px; max-height: min(360px, 64%);
    display: flex; flex-direction: column; padding: 8px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface);
    box-shadow: 0 20px 60px oklch(5% 0.01 262 / 0.58);
  }
  .save-pop[hidden] { display: none; }
  .save-pop-head { flex: none; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 2px 4px 7px; border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .12em; color: var(--muted); }
  .save-pop-head em { font-style: normal; font-size: 8px; letter-spacing: .06em; }
  .save-list { min-height: 0; overflow-y: auto; padding-top: 5px; scrollbar-width: thin; scrollbar-color: var(--ink-dash) transparent; }
  .save-row { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 8px; border-radius: 8px; }
  .save-row:hover { background: var(--ink-soft); }
  .save-row-main { flex: 1; min-width: 0; }
  .save-row-main b { display: block; font-size: 11px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .save-row-main em { display: block; margin-top: 2px; font-family: var(--font-mono); font-style: normal; font-size: 8px; letter-spacing: .04em; color: var(--muted); }
  .save-row-acts { flex: none; display: flex; gap: 3px; }
  .save-row-acts button { padding: 2px 6px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 8.5px; }
  .save-row-acts button:hover { border-color: var(--accent-line); color: var(--accent-bright); }
  .save-empty { padding: 18px 8px 13px; text-align: center; font-size: 10px; line-height: 1.75; color: var(--muted); }
  .save-empty span { font-size: 8.5px; opacity: .78; }
  .save-pop-note { flex: none; margin: 6px 2px 0; padding-top: 7px; border-top: 1px solid var(--border); font-size: 8.5px; line-height: 1.5; color: var(--muted); opacity: .85; }

  /* ─── 右 1/5：风格 / 角色 / 统计 ──────────────────────────────── */
  .side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) minmax(0, 1.15fr); gap: 12px; }

  .setup-body { padding: 10px 12px 12px; display: flex; flex-direction: column; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .s-chip { padding: 4px 11px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 11px; transition: .14s; }
  .s-chip:hover { border-color: var(--ink-hair); color: var(--fg); }
  .s-chip.is-on { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-bright); }
  .tone-row { display: flex; gap: 4px; margin-top: 8px; }
  .tone-b { flex: 1; padding: 4px 0; border-radius: 7px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 10px; }
  .tone-b:hover { border-color: var(--ink-hair); color: var(--fg); }
  .tone-b.is-on { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-bright); }
  .style-hint { margin-top: 8px; font-size: 9.5px; line-height: 1.6; color: var(--muted); }
  .style-hint b { color: var(--fg); font-weight: 600; }

  .role-add { margin-left: auto; padding: 2px 9px; border-radius: 999px; border: 1px dashed var(--ink-dash); background: transparent; color: var(--muted); font-size: 9.5px; }
  .role-add:hover { border-color: var(--accent-line); color: var(--accent-bright); }
  .role-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; padding: 8px 10px 10px; scrollbar-width: thin; scrollbar-color: var(--ink-dash) transparent; }
  .role-card { position: relative; flex: none; min-width: 0; display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 9px; border: 1px solid var(--border); background: transparent; text-align: left; cursor: pointer; transition: .14s; }
  .role-card:hover { border-color: var(--ink-hair); background: var(--ink-soft); }
  .role-card.is-on { border-color: var(--accent-line); background: var(--accent-soft); }
  .role-av { width: 23px; height: 23px; flex: none; display: grid; place-items: center; border-radius: 999px; border: 1px solid var(--border); background: var(--ink-soft); font-family: var(--font-display); font-size: 11px; color: var(--fg); }
  .role-card.is-on .role-av { border-color: var(--accent-line); color: var(--accent-bright); }
  .role-txt { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .role-name { font-size: 10.5px; font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .role-desc { font-size: 8.5px; line-height: 1.4; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .role-x { position: absolute; top: 3px; right: 3px; width: 15px; height: 15px; display: grid; place-items: center; border-radius: 999px; border: 0; background: transparent; color: var(--muted); font-size: 11px; line-height: 1; opacity: 0; }
  .role-card:hover .role-x { opacity: 1; }
  .role-x:hover { color: var(--accent-bright); background: var(--ink-soft); }

  .sort-row { flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; padding: 7px 10px 0; }
  .sort-b { padding: 3px 0; border-radius: 7px; border: 1px solid transparent; background: transparent; color: var(--muted); font-size: 9.5px; text-align: center; white-space: nowrap; }
  .sort-b:hover { color: var(--fg); background: var(--ink-soft); }
  .sort-b.is-on { border-color: var(--border); background: var(--ink-soft); color: var(--fg); }
  .stat-sum { flex: none; padding: 6px 11px; border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: 8px; line-height: 1.65; letter-spacing: 0.03em; color: var(--muted); }
  .stat-sum b { color: var(--fg); font-weight: 600; }
  .stat-list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 6px 6px; scrollbar-width: thin; scrollbar-color: var(--ink-dash) transparent; }
  .stat-row { padding: 6px; border-radius: 8px; border: 1px solid transparent; }
  .stat-row:hover { background: var(--ink-soft); border-color: var(--border); }
  .sr-top { display: flex; align-items: flex-start; gap: 6px; }
  .sr-no { flex: none; width: 14px; padding-top: 1px; font-family: var(--font-mono); font-size: 8px; color: var(--muted); }
  .sr-quote { flex: 1; min-width: 0; font-size: 10.8px; line-height: 1.55; color: var(--fg); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sr-meta { display: flex; align-items: center; gap: 4px; margin-top: 4px; padding-left: 20px; flex-wrap: wrap; }
  .sr-year { width: 48px; padding: 2px 4px; border-radius: 5px; border: 1px solid var(--border); background: var(--ink-soft); color: var(--fg); font-family: var(--font-mono); font-size: 8.5px; }
  .sr-kind { width: 56px; padding: 2px 2px; border-radius: 5px; border: 1px solid var(--border); background: var(--ink-soft); color: var(--fg); font-size: 8.5px; cursor: pointer; }
  .sr-kind option { background: var(--surface); }
  .dots { display: flex; align-items: center; gap: 2px; }
  .dot-k { font-family: var(--font-mono); font-size: 7px; color: var(--muted); margin-right: 1px; }
  .dot { width: 7px; height: 7px; padding: 0; border-radius: 999px; border: 1px solid var(--ink-dash); background: transparent; }
  .dot:hover { border-color: var(--accent-bright); }
  .dot.is-on { border-color: var(--accent); background: var(--accent); }
  .stat-empty { height: 100%; min-height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; padding: 14px 12px; text-align: center; color: var(--muted); }
  .stat-empty svg { width: 22px; height: 22px; opacity: .55; }
  .stat-empty p { font-size: 9.8px; line-height: 1.7; }

  /* ─── 人设弹窗 ─────────────────────────────────────────────────── */
  .mem-modal { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 20px; background: oklch(6% 0.01 262 / 0.72); }
  .mem-modal[hidden] { display: none; }
  .modal-card { width: min(380px, 100%); padding: 16px; border-radius: var(--r-lg); border: 1px solid var(--border); background: var(--surface); box-shadow: 0 28px 80px oklch(4% 0.01 262 / 0.6); }
  .modal-kicker { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.16em; color: var(--muted); }
  .modal-title { margin: 3px 0 12px; font-family: var(--font-display); font-size: 19px; font-weight: 600; }
  .modal-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 9px; }
  .modal-field label { font-size: 10.5px; color: var(--muted); }
  .modal-field input, .modal-field textarea { width: 100%; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--ink-soft); color: var(--fg); font: inherit; font-size: 12px; resize: none; }
  .modal-field input:focus, .modal-field textarea:focus { outline: 0; border-color: var(--accent-line); box-shadow: 0 0 0 2px var(--accent-soft); }
  .modal-err { min-height: 15px; margin: 2px 0 4px; font-size: 10px; color: var(--accent-bright); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 4px; }
  .modal-b { padding: 6px 13px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--fg); font-size: 11.5px; }
  .modal-b:hover { background: var(--ink-soft); }
  .modal-b.primary { border-color: var(--accent-line); background: var(--accent); color: var(--accent-ink); }
  .modal-b.primary:hover { background: color-mix(in oklch, var(--accent) 84%, oklch(0% 0 0)); }

  @media (max-width: 1220px) {
    .mem { gap: 10px; padding: 12px; }
    .write-sheet { padding: 14px 20px 6px; }
    .write-foot { padding: 8px 20px 10px; }
    .manuscript { font-size: 15px; }
    .role-desc { font-size: 8px; }
  }
  @media (max-width: 980px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100vh; }
    .mem { height: auto; grid-template-columns: 1fr; padding: 10px; }
    .chat { height: 62vh; }
    .write { height: 66vh; }
    .side { grid-template-rows: auto auto auto; }
    .role-list { max-height: 240px; }
    .stat-list { max-height: 320px; }
  }
</style>
</head>
