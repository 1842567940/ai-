<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>启笔 QIBI · 设置</title>
<link rel="icon" type="image/png" href="app-icon.png" />
<style>
  /* ─── tokens — 沿用工作台 (ai-novel-editor-home.html) 的夜色水墨令牌 ──
        设置页 = 左 rail（应用导航）· 中分区栏（六组设置项）· 右实际设置面板。
        夜的墨、纸白字、一点朱砂；默认夜色，可切到宣纸（浅色）。一屏，仅面板自身滚动。 */
  :root {
    --bg:      oklch(15% 0.010 262);
    --surface: oklch(23% 0.011 262);
    --fg:      oklch(94% 0.006 90);
    --muted:   oklch(73% 0.010 90);
    --border:  oklch(96% 0.006 90 / 0.13);
    --accent:  oklch(55% 0.17 28);

    --ink-soft:      oklch(96% 0.006 90 / 0.055);
    --ink-hair:      oklch(96% 0.006 90 / 0.16);
    --ink-dash:      oklch(96% 0.006 90 / 0.26);
    --accent-soft:   oklch(60% 0.17 28 / 0.17);
    --accent-line:   oklch(62% 0.17 28 / 0.44);
    --accent-ink:    oklch(98% 0.008 30);
    --accent-deep:   oklch(47% 0.16 28);
    --accent-bright: oklch(73% 0.15 32);
    --scrim:         oklch(11% 0.012 262);

    --font-display: 'Iowan Old Style', 'Charter', Georgia, 'Songti SC', 'STSong', 'Source Han Serif SC', 'Noto Serif SC', 'SimSun', serif;
    --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    --font-mono:    ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;

    --r-sm: 9px; --r-md: 12px; --r-lg: 15px;
  }
  /* 宣纸主题 — 同一套结构换浅色纸面 */
  .theme-paper {
    --bg:      oklch(94.6% 0.010 84);
    --surface: oklch(97.4% 0.008 84);
    --fg:      oklch(24% 0.014 62);
    --muted:   oklch(47% 0.012 62);
    --border:  oklch(52% 0.020 70 / 0.22);
    --accent:  oklch(52% 0.17 28);
    --ink-soft:      oklch(50% 0.02 70 / 0.06);
    --ink-hair:      oklch(42% 0.02 70 / 0.16);
    --ink-dash:      oklch(42% 0.02 70 / 0.26);
    --accent-soft:   oklch(58% 0.17 28 / 0.14);
    --accent-line:   oklch(55% 0.17 28 / 0.42);
    --accent-ink:    oklch(98% 0.008 30);
    --accent-deep:   oklch(47% 0.16 28);
    --accent-bright: oklch(52% 0.17 28);
    --scrim:         oklch(96% 0.007 84);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .bg-photo {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: var(--bg) url("%E6%B0%B4%E5%A2%A8%E5%B0%91%E5%A5%B3-%E5%A4%9C%E8%89%B2.png") center / cover no-repeat;
  }
  .bg-scrim {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      linear-gradient(180deg, oklch(9% 0.012 262 / 0.05), transparent 60%, oklch(10% 0.012 262 / 0.03)),
      linear-gradient(103deg, oklch(8% 0.012 262 / 0.05) 0%, oklch(10% 0.012 262 / 0.02) 52%, oklch(12% 0.012 262 / 0) 100%);
  }
  .bg-video {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    width: 100%; height: 100%; object-fit: cover; display: none;
  }
  .theme-paper .bg-photo, .theme-paper .bg-scrim, .theme-paper .bg-video { display: none; }
  img, svg { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  h1, h2, h3, h4, p { margin: 0; }
  ::selection { background: var(--accent-soft); }

  /* ─── shell ─────────────────────────────────────────────────────── */
  .app {
    position: relative; z-index: 1; height: 100vh;
    display: grid;
    grid-template-columns: 66px 288px minmax(0, 1fr);
    grid-template-rows: 58px minmax(0, 1fr);
  }
  .appbar {
    grid-column: 1 / -1; grid-row: 1;
    display: flex; align-items: center; gap: 14px; padding: 0 18px 0 20px;
    border-bottom: 1px solid var(--border);
    background: var(--scrim);
  }
  .brand { display: flex; align-items: center; gap: 10px; flex: none; }
  .app-icon { width: 34px; height: 34px; flex: none; border-radius: 9px; object-fit: contain; box-shadow: 0 1px 3px oklch(0% 0 0 / 0.45), 0 0 0 1px var(--border); }
  .brand-name { font-family: var(--font-display); font-size: 16px; font-weight: 600; letter-spacing: 0.02em; line-height: 1.1; }
  .brand-sub { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--muted); letter-spacing: 0.14em; margin-top: 1px; }
  .home-link { display: inline-flex; align-items: center; gap: 6px; flex: none; padding: 6px 10px; border-radius: var(--r-sm); border: 1px solid var(--border); color: var(--muted); font-size: 12px; transition: background .14s, color .14s, border-color .14s; }
  .home-link:hover { background: var(--ink-soft); color: var(--fg); border-color: var(--ink-hair); }
  .home-link svg { width: 14px; height: 14px; }
  .crumb { display: flex; align-items: center; gap: 8px; flex: none; padding-left: 14px; border-left: 1px solid var(--border); font-size: 12.5px; color: var(--muted); }
  .crumb-cur { color: var(--fg); font-weight: 500; }
  .appbar-right { display: flex; align-items: center; gap: 9px; flex: none; margin-left: auto; }
  .search { display: flex; align-items: center; gap: 8px; width: 230px; padding: 6px 11px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); background: var(--surface); }
  .search svg { width: 15px; height: 15px; flex: none; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; font-size: 12.5px; }
  .search input::placeholder { color: var(--muted); }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .save-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; color: var(--muted); background: var(--surface); }
  .save-chip i { width: 6px; height: 6px; border-radius: 999px; background: var(--ink-dash); transition: background .2s; }
  .save-chip.is-dirty i { background: var(--accent-bright); }

  .icon-btn { width: 36px; height: 36px; border-radius: var(--r-sm); flex: none; position: relative; display: grid; place-items: center; background: transparent; border: 1px solid var(--border); color: var(--muted); transition: background .14s, color .14s, border-color .14s; }
  .icon-btn:hover { background: var(--ink-soft); color: var(--fg); border-color: var(--ink-hair); }
  .icon-btn svg { width: 17px; height: 17px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 15px; border-radius: var(--r-sm); border: 1px solid transparent; font-size: 13.5px; font-weight: 500; transition: background .15s, border-color .15s, color .15s, transform .05s; }
  .btn:active { transform: translateY(1px); }
  .btn svg { width: 15px; height: 15px; }
  .btn-ghost { background: transparent; border-color: var(--border); color: var(--fg); }
  .btn-ghost:hover { background: var(--ink-soft); border-color: var(--ink-hair); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
  .btn-sm { padding: 6px 12px; font-size: 12.5px; }
  :where(.btn, .icon-btn, .rail-btn, .home-link, .snav-item, .sw, .seg-btn, .reset-link):focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 2px; }

  /* ─── left rail ──────────────────────────────────────────────────── */
  .rail { grid-column: 1; grid-row: 2; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 12px 0 14px; overflow: hidden; border-right: 1px solid var(--border); background: color-mix(in oklch, var(--scrim) 34%, transparent); }
  .rail-btn { width: 54px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; border-radius: 12px; border: 1px solid transparent; background: transparent; color: var(--muted); font-size: 10px; letter-spacing: 0.02em; transition: background .14s, color .14s, border-color .14s; }
  .rail-btn svg { width: 19px; height: 19px; }
  .rail-btn:hover { background: var(--ink-soft); color: var(--fg); }
  .rail-btn.is-active { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-bright); }
  .rail-spacer { flex: 1; }
  .rail-avatar { width: 34px; height: 34px; border-radius: 999px; flex: none; display: grid; place-items: center; color: var(--muted); background: var(--ink-soft); border: 1px dashed var(--ink-dash); }
  .rail-avatar svg { width: 17px; height: 17px; }

  /* ─── settings nav column ────────────────────────────────────────── */
  .snav { grid-column: 2; grid-row: 2; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: color-mix(in oklch, var(--scrim) 44%, transparent); }
  .snav-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 15px 16px 12px; border-bottom: 1px solid var(--border); }
  .snav-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; letter-spacing: 0.06em; }
  .snav-sub { font-family: var(--font-mono); font-size: 9.5px; color: var(--muted); letter-spacing: 0.1em; }
  .snav-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 8px 10px 20px; scrollbar-width: thin; scrollbar-color: var(--ink-hair) transparent; }
  .snav-scroll::-webkit-scrollbar { width: 8px; }
  .snav-scroll::-webkit-scrollbar-thumb { background: var(--ink-hair); border-radius: 999px; }
  /* 汇总 → 打开：分组标题默认收起，点开才列出该组设置项 */
  .grp { margin-bottom: 2px; }
  .grp-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 11px 9px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--fg); transition: background .14s; }
  .grp-head:hover { background: var(--ink-soft); }
  .grp-mark { width: 6px; height: 6px; flex: none; border-radius: 1px; background: var(--fg); opacity: .5; transform: rotate(45deg); }
  .grp-name { font-family: var(--font-display); font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; color: var(--fg); }
  .grp-line { flex: 1; min-width: 8px; height: 1px; background: var(--border); }
  .grp-count { font-family: var(--font-mono); font-size: 9px; color: var(--muted); }
  .grp-caret { flex: none; display: grid; place-items: center; color: var(--muted); transition: transform .18s; }
  .grp-caret svg { width: 13px; height: 13px; }
  .grp.is-open .grp-caret { transform: rotate(180deg); }
  .grp-list { display: none; padding: 2px 0 7px; }
  .grp.is-open .grp-list { display: block; }
  .snav-scroll.is-search .grp-list { display: block; }
  .snav-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 9px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--fg); transition: background .14s, color .14s; }
  .snav-item:hover { background: var(--ink-soft); }
  .snav-item .ic { width: 26px; height: 26px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--ink-soft); color: var(--muted); transition: color .14s; }
  .snav-item .ic svg { width: 15px; height: 15px; }
  .snav-item:hover .ic { color: var(--fg); }
  .snav-item .tx { flex: 1; min-width: 0; display: block; }
  .snav-item .t { display: block; font-size: 13px; }
  .snav-item .d { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .snav-item.is-on { background: var(--accent-soft); }
  .snav-item.is-on .ic { color: var(--accent-bright); }
  .snav-item.is-on .t { color: var(--accent-bright); }
  .snav-item.is-on .d { color: var(--accent-bright); opacity: .8; }

  /* ─── settings panes ─────────────────────────────────────────────── */
  .panes { grid-column: 3; grid-row: 2; min-height: 0; display: flex; flex-direction: column; background: color-mix(in oklch, var(--scrim) 46%, transparent); }
  .panes-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 30px 44px 70px; scrollbar-width: thin; scrollbar-color: var(--ink-hair) transparent; }
  .panes-scroll::-webkit-scrollbar { width: 8px; }
  .panes-scroll::-webkit-scrollbar-thumb { background: var(--ink-hair); border-radius: 999px; }
  .pane { display: none; max-width: 760px; }
  .pane.is-on { display: block; }
  .pane-head { display: flex; align-items: flex-end; gap: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .pane-h { font-family: var(--font-display); font-size: 24px; font-weight: 600; letter-spacing: 0.03em; }
  .pane-desc { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .pane-head .spacer { flex: 1; }
  .reset-link { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--muted); font-size: 11.5px; }
  .reset-link:hover { background: var(--ink-soft); color: var(--fg); border-color: var(--ink-hair); }
  .reset-link svg { width: 12px; height: 12px; }

  .block { margin-top: 26px; }
  .block-title { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
  .row { display: flex; align-items: center; gap: 18px; padding: 15px 2px; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: 0; }
  .row-tx { flex: 1; min-width: 0; }
  .row-label { font-size: 13.5px; color: var(--fg); }
  .row-sub { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.55; }
  .row-ctl { flex: none; display: flex; align-items: center; gap: 10px; }

  /* switch */
  .sw { width: 42px; height: 24px; flex: none; border-radius: 999px; border: 1px solid var(--border); background: var(--ink-soft); position: relative; transition: background .16s, border-color .16s; }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 999px; background: var(--muted); transition: left .16s ease, background .16s; }
  .sw[aria-checked="true"] { background: var(--accent-soft); border-color: var(--accent-line); }
  .sw[aria-checked="true"]::after { left: 20px; background: var(--accent-bright); }

  /* inputs */
  .inp, .sel, .area { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 8px 11px; transition: border-color .14s, box-shadow .14s; }
  .inp { width: 250px; }
  .area { width: 250px; resize: none; line-height: 1.6; }
  .sel { width: 200px; appearance: none; background-image: none; padding-right: 30px; cursor: pointer; }
  .sel-wrap { position: relative; }
  .sel-wrap::after { content: ''; position: absolute; right: 12px; top: 50%; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
  .inp:focus, .sel:focus, .area:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  /* segmented */
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; background: var(--surface); }
  .seg-btn { padding: 7px 14px; border: 0; background: transparent; color: var(--muted); font-size: 12.5px; transition: background .14s, color .14s; }
  .seg-btn:hover { background: var(--ink-soft); color: var(--fg); }
  .seg-btn.is-on { background: var(--accent-soft); color: var(--accent-bright); }

  /* slider */
  .sld { display: flex; align-items: center; gap: 12px; width: 250px; }
  .sld input[type="range"] { flex: 1; min-width: 0; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 999px; background: var(--ink-hair); cursor: pointer; }
  .sld input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 999px; background: var(--accent-bright); border: 0; box-shadow: 0 0 0 1px var(--accent-deep); }
  .sld input[type="range"]::-moz-range-thumb { width: 15px; height: 15px; border: 0; border-radius: 999px; background: var(--accent-bright); }
  .sld-val { flex: none; width: 54px; text-align: right; font-family: var(--font-mono); font-size: 11.5px; color: var(--fg); font-variant-numeric: tabular-nums; }

  /* avatar + badges */
  .avatar-edit { display: flex; align-items: center; gap: 14px; }
  .avatar-lg { width: 60px; height: 60px; border-radius: 999px; flex: none; display: grid; place-items: center; color: var(--muted); background: var(--ink-soft); border: 1px dashed var(--ink-dash); }
  .avatar-lg svg { width: 26px; height: 26px; }
  .keytag { font-family: var(--font-mono); font-size: 11px; color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; background: var(--surface); }
  .devrow, .verrow, .collabrow { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--border); }
  .devrow:last-child, .verrow:last-child, .collabrow:last-child { border-bottom: 0; }
  .devrow .ic, .collabrow .ic { width: 30px; height: 30px; flex: none; border-radius: 9px; display: grid; place-items: center; background: var(--ink-soft); color: var(--muted); }
  .devrow .ic svg, .collabrow .ic svg { width: 16px; height: 16px; }
  .devrow .tx, .collabrow .tx { flex: 1; min-width: 0; }
  .devrow .t, .collabrow .t { font-size: 13px; }
  .devrow .d, .collabrow .d { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .pill { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.05em; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 3px 9px; }
  .pill.ok { color: var(--accent-bright); border-color: var(--accent-line); }
  .ver-tag { font-family: var(--font-mono); font-size: 10px; color: var(--muted); width: 54px; flex: none; }
  .ver-tx { flex: 1; min-width: 0; }
  .ver-tx .t { font-size: 13px; }
  .ver-tx .d { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.6; }
  .status-line { font-size: 12px; color: var(--muted); }
  .status-line.ok { color: var(--accent-bright); }
  .status-line b { color: var(--fg); font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* 模型库 · 本地模型 */
  .modlib-head { display: flex; align-items: center; gap: 14px; padding: 14px 2px; border-bottom: 1px solid var(--border); }
  .modlib-head .tx { flex: 1; min-width: 0; }
  .modlib-head .t { font-size: 13.5px; }
  .modlib-head .d { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.55; }
  .modrow { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--border); }
  .modrow .ic { width: 30px; height: 30px; flex: none; border-radius: 9px; display: grid; place-items: center; background: var(--ink-soft); color: var(--muted); }
  .modrow .ic svg { width: 16px; height: 16px; }
  .modrow .tx { flex: 1; min-width: 0; }
  .modrow .t { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-family: var(--font-mono); }
  .modrow .d { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .modrow .btn svg { width: 13px; height: 13px; }

  .pop { position: absolute; top: 46px; right: 0; width: 280px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: 0 16px 40px oklch(0% 0 0 / 0.45); padding: 7px; z-index: 60; display: none; }
  .pop.open { display: block; }
  .pop-empty { padding: 22px 16px; text-align: center; font-size: 12.5px; color: var(--muted); border: 1px dashed var(--ink-dash); border-radius: var(--r-sm); }
  .rel { position: relative; }

  .toast { position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 14px); z-index: 80; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--accent-line); background: color-mix(in oklch, var(--scrim) 88%, var(--accent-soft)); color: var(--fg); font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast i { width: 6px; height: 6px; border-radius: 999px; background: var(--accent-bright); }

  /* ─── adapt ──────────────────────────────────────────────────────── */
  @media (max-width: 1240px) { .app { grid-template-columns: 62px 250px minmax(0, 1fr); } }
  @media (max-width: 1040px) {
    .app { grid-template-columns: 62px minmax(0, 1fr); }
    .snav { display: none; }
    .panes { grid-column: 2; }

    backupOn: true, backupFreq: '每日', backupCount: 10,
    syncOn: true, syncConflict: '以最新为准',
    telemetry: false, crashReport: true, twoFactor: false, lockOnIdle: true,

    dev: {}, ver: '', local: {}

  var S = JSON.parse(JSON.stringify(DEF));
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p === 'object') {

  if (!S.view) S.view = 'account';

    } catch (e) {}
  }
  function unitOf(k) { return (k === 'fontSize') ? ' px' : (k === 'lineHeight') ? ' 倍' : (k === 'maxLen') ? ' 字' : (k === 'autosaveSec') ? ' 秒' : (k === 'wallDim') ? ' %' : ''; }

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

    var vid = document.getElementById('bgVideo');
    var show = !!S.showPhoto && S.theme !== '宣纸';
    var usingVideo = show && S.wallpaper === '动态视频' && !!wallVideo;
    var usingImage = show && S.wallpaper === '自定义图片' && !!wallImage;
    var dim = 1 - (S.wallDim / 100);
    if (ph) {
      ph.style.display = show ? '' : 'none';
      ph.style.backgroundImage = usingImage ? 'url("' + wallImage + '")' : '';
      ph.style.filter = 'brightness(' + dim + ')';
    }
    if (sc) sc.style.display = show ? '' : 'none';

      if (usingVideo) { if (!vid.getAttribute('src')) vid.setAttribute('src', wallVideo); vid.style.display = 'block'; var p = vid.play(); if (p && p.catch) p.catch(function () {}); }

    if (ws) ws.textContent = S.wallpaper === '内置夜色' ? '内置夜色水墨'

    document.getElementById('toastTx').textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove('show'); }, 1900);
  }

  function refreshPreview() {
    var el = document.getElementById('typePreview');
    if (el) { el.style.fontSize = S.fontSize + 'px'; el.style.lineHeight = S.lineHeight; }
  }

  function updateLen() {
    var wrap = document.getElementById('lenSld');
    var lab = paneWrap.querySelector('[data-val="maxLen"]');
    if (wrap) { wrap.style.opacity = S.maxLenUnlimited ? '.4' : ''; wrap.style.pointerEvents = S.maxLenUnlimited ? 'none' : ''; }
    if (lab) lab.textContent = S.maxLenUnlimited ? '无上限' : S.maxLen + ' 字';
  }

  paneWrap.addEventListener('click', function (e) {
    var sw = e.target.closest('[data-sw]');
    if (sw) {
      var k = sw.getAttribute('data-sw'); S[k] = !S[k];
      sw.setAttribute('aria-checked', String(S[k])); persist(); flashSave();
      if (k === 'maxLenUnlimited') updateLen();
      return;
    }
    var seg = e.target.closest('[data-seg]');
    if (seg) {
      var key = seg.getAttribute('data-seg'), val = seg.getAttribute('data-val');
      S[key] = val; persist(); flashSave();
      Array.prototype.forEach.call(seg.parentNode.querySelectorAll('.seg-btn'), function (b) {
        var on = b === seg; b.classList.toggle('is-on', on); b.setAttribute('aria-checked', String(on));
      });
      if (key === 'theme') { applyTheme(); toast('已切换到' + val + '主题'); }
      else if (key === 'wallpaper') { applyTheme(); toast('壁纸来源：' + val); }
      return;
    }
    var rst = e.target.closest('[data-reset]');
    if (rst) { resetPane(rst.getAttribute('data-reset')); return; }
    var act = e.target.closest('[data-act]');
    if (act) {
      doAction(act.getAttribute('data-act')); return;
    }
    var id = e.target.id;
    if (id === 'aiTest') { testAI(); return; }
    if (id === 'backupNow') { backupNow(); return; }
    if (id === 'checkUpdate') { toast('当前已是最新版本'); return; }
  });

  paneWrap.addEventListener('input', function (e) {
    var t = e.target;
    if (t.hasAttribute && t.hasAttribute('data-rng')) {
      var k = t.getAttribute('data-rng'); S[k] = parseFloat(t.value); persist();
      var lab = paneWrap.querySelector('[data-val="' + k + '"]');
      if (lab) lab.textContent = S[k] + unitOf(k);
      if (k === 'fontSize' || k === 'lineHeight') refreshPreview();
      if (k === 'wallDim') applyTheme();
      flashSave();
    }
  });
  paneWrap.addEventListener('change', function (e) {
    var t = e.target;
    if (t.hasAttribute && t.hasAttribute('data-inp')) {
      var k = t.getAttribute('data-inp'); S[k] = t.value; persist();
      var dep = CAT_DEP[k];
      if (dep) {
        var list = (CATALOG[dep[1]][S[k]]) || [];
        if (list.length && list.indexOf(S[dep[0]]) < 0) { S[dep[0]] = list[0]; persist(); }
        buildPanes(); bindPaneState(); setView('ai', true);
        toast('已切换到 ' + S[k] + '，默认模型随之更新');
      }
      flashSave();
    }
    else if (t.hasAttribute && t.hasAttribute('data-num')) { S[t.getAttribute('data-num')] = parseInt(t.value, 10) || 0; persist(); flashSave(); }
  });

  function resetPane(id) {
    var keys = Object.keys(DEF).filter(function (k) { return k !== 'view'; });
    if (id === 'account') keys = ['nickname', 'signature'];
    else if (id === 'ai') keys = ['provider', 'apiKey', 'baseUrl', 'model', 'imgProvider', 'imgKey', 'imgModel', 'ttsProvider', 'ttsKey', 'ttsVoice', 'local'];
    else if (id === 'collab') keys = ['inviteRole', 'allowComment'];
    else if (id === 'pref') keys = ['defGenre', 'autosave', 'autosaveSec', 'dailyGoal'];
    else if (id === 'model') keys = ['temperature', 'topP', 'freqPenalty', 'maxLen', 'maxLenUnlimited', 'style'];
    else if (id === 'keys') keys = ['keyScheme', 'vimMode'];
    else if (id === 'type') keys = ['fontFamily', 'fontSize', 'lineHeight', 'indent'];
    else if (id === 'theme') { keys = ['theme', 'showPhoto', 'density', 'wallpaper', 'wallDim']; wallImage = ''; wallVideo = ''; }
    else if (id === 'backup') keys = ['backupOn', 'backupFreq', 'backupCount'];
    else if (id === 'sync') keys = ['syncOn', 'syncConflict'];
    else if (id === 'privacy') keys = ['telemetry', 'crashReport', 'twoFactor', 'lockOnIdle'];
    else if (id === 'export') keys = ['exportFmt', 'exportMeta', 'exportSplit'];
    else if (id === 'region') keys = ['lang', 'convert', 'term'];
    keys.forEach(function (k) { if (k in DEF) S[k] = (DEF[k] && typeof DEF[k] === 'object') ? JSON.parse(JSON.stringify(DEF[k])) : DEF[k]; });
    persist();
    buildPanes(); bindPaneState(); setView(id, true); applyTheme();
    toast('已恢复「' + PANE_META[id][0] + '」默认');
  }

  /* 重新渲染后，把已保存状态写回控件 */
  function bindPaneState() {
    Array.prototype.forEach.call(paneWrap.querySelectorAll('[data-sw]'), function (b) {
      b.setAttribute('aria-checked', String(!!S[b.getAttribute('data-sw')]));
    });
    Array.prototype.forEach.call(paneWrap.querySelectorAll('[data-inp]'), function (b) {
      var k = b.getAttribute('data-inp'); if (k in S) b.value = S[k];
    });
    Array.prototype.forEach.call(paneWrap.querySelectorAll('[data-num]'), function (b) {
      var k = b.getAttribute('data-num'); if (k in S) b.value = S[k];
    });
    Array.prototype.forEach.call(paneWrap.querySelectorAll('[data-seg]'), function (b) {
      b.classList.toggle('is-on', S[b.getAttribute('data-seg')] === b.getAttribute('data-val'));
    });
    Array.prototype.forEach.call(paneWrap.querySelectorAll('[data-rng]'), function (b) {
      var k = b.getAttribute('data-rng'); if (k in S) { b.value = S[k]; var lab = paneWrap.querySelector('[data-val="' + k + '"]'); if (lab) lab.textContent = S[k] + unitOf(k); }
    });
    refreshPreview();
  }

  function doAction(act) {
    if (act === 'avatar') {
      var av = document.getElementById('accAvatarFile');
      if (av) av.click();
      return;
    }
    if (act === 'removeAvatar') {
      S.avatar = '';
      persist();
      setView('account', true);
      toast('头像已移除');
      return;
    }
    if (act === 'pickImage') { pickWall('image'); return; }
    if (act === 'pickVideo') { pickWall('video'); return; }
    if (act === 'clearWall') {
      wallImage = ''; wallVideo = ''; S.wallpaper = '内置夜色'; persist();
      buildPanes(); bindPaneState(); applyTheme(); setView('theme', true);
      toast('已恢复内置夜色水墨');
      return;
    }
    var map = {
      avatar: '选择一张图片作为头像', bind: '打开邮箱绑定流程', invite: '复制邀请链接到剪贴板',
      exportData: '数据打包中，稍后可在下载中查看', clearCache: '本地缓存已清除', doExport: '作品已开始导出',
      guide: '打开使用指南', feedback: '打开反馈表单'
    };
    toast(map[act] || '已执行');
  }

  var wallPick = document.getElementById('wallPick');
  var pickMode = 'image';
  function pickWall(mode) { pickMode = mode; wallPick.value = ''; wallPick.accept = mode === 'video' ? 'video/*' : 'image/*'; wallPick.click(); }
  wallPick.addEventListener('change', function () {
    var f = wallPick.files && wallPick.files[0]; if (!f) return;
    var url = URL.createObjectURL(f);
    if (pickMode === 'video') { wallVideo = url; S.wallpaper = '动态视频'; }
    else { wallImage = url; S.wallpaper = '自定义图片'; }
    persist(); buildPanes(); bindPaneState(); applyTheme(); setView('theme', true);
    toast(pickMode === 'video' ? '已应用动态视频壁纸' : '已应用自定义图片壁纸');
  });

  function avatarFile(input) {
    var f = input.files && input.files[0];
    input.value = '';
    if (!f) return;
    if (!/^image\//.test(f.type || '')) { toast('请选择图片文件'); return; }
    if (f.size > 3 * 1024 * 1024) { toast('图片超过 3MB'); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        try {
          var cv = document.createElement('canvas');
          cv.width = 128; cv.height = 128;
          var ctx = cv.getContext('2d');
          var side = Math.min(img.width || 128, img.height || 128);
          ctx.drawImage(img, ((img.width || side) - side) / 2, ((img.height || side) - side) / 2, side, side, 0, 0, 128, 128);
          S.avatar = cv.toDataURL('image/jpeg', 0.82);
          persist();
          buildPanes(); bindPaneState();
          setView('account', true);
          toast('头像已更新');
        } catch (e) { toast('头像处理失败'); }
      };
      img.onerror = function () { toast('图片读取失败'); };
      img.src = String(reader.result || '');
    };
    reader.onerror = function () { toast('图片读取失败'); };
    reader.readAsDataURL(f);
  }
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'accAvatarFile') avatarFile(e.target);
  });

  function testAI() {
    var st = document.getElementById('aiStatus');
    st.classList.remove('ok');
    st.textContent = '正在连接启笔后端 AI …';
    fetch('/api/ai/chat', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ messages: [{ role: 'user', content: '请回复：OK' }], maxTokens: 1200, temperature: 0 })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.text) { st.textContent = '连接正常 · DeepSeek 可用（后端实际配置）'; st.classList.add('ok'); }
      else { st.textContent = '连接失败：' + ((j && j.error) || '空响应'); }
    }).catch(function (e) { st.textContent = '连接失败：' + (e.message || '网络错误'); });
  }
  function backupNow() {
    var st = document.getElementById('backupStatus');
    st.textContent = '正在生成快照…';
    fetch('/api/backup', { method: 'POST' }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.ok) throw new Error((j && j.error) || '备份失败');
      var now = new Date();
      var hh = ('0' + now.getHours()).slice(-2), mm = ('0' + now.getMinutes()).slice(-2);
      st.textContent = '上次备份：刚刚（' + hh + ':' + mm + '）· ' + j.file;
      toast('已生成后端快照 ' + j.file);
    }).catch(function (e) {
      st.textContent = '备份失败：' + (e.message || '网络错误');
      toast('备份失败');
    });
  }

  /* appbar 交互 */
  var bell = document.getElementById('bell'), bellPop = document.getElementById('bellPop');
  bell.addEventListener('click', function () {
    var open = bellPop.classList.toggle('open');
    bell.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#bell') && !e.target.closest('#bellPop')) { bellPop.classList.remove('open'); bell.setAttribute('aria-expanded', 'false'); }
  });
  document.getElementById('resetAll').addEventListener('click', function () {
    Object.keys(DEF).forEach(function (k) { if (k !== 'view') S[k] = (DEF[k] && typeof DEF[k] === 'object') ? JSON.parse(JSON.stringify(DEF[k])) : DEF[k]; });
    wallImage = ''; wallVideo = '';
    persist(); buildPanes(); bindPaneState(); applyTheme();
    toast('已恢复全部默认设置');
  });
  document.getElementById('search').addEventListener('input', function (e) {
    var q = e.target.value.trim().toLowerCase();
    var items = snavWrap.querySelectorAll('.snav-item');
    var first = null;
    Array.prototype.forEach.call(items, function (b) {
      var hit = !q || b.textContent.toLowerCase().indexOf(q) >= 0;
      b.style.display = hit ? '' : 'none';
      if (hit && !first) first = b;
    });
    snavWrap.classList.toggle('is-search', !!q);
    Array.prototype.forEach.call(snavWrap.querySelectorAll('.grp-head'), function (h) { h.style.display = q ? 'none' : ''; });
    if (q && first) setView(first.getAttribute('data-view'), true);
    else if (!q) openGroup(groupOfItem(S.view));
  });

  /* ── init ───────────────────────────────────────────────────────── */
  function applyHash() {
    var h = (location.hash || '').replace(/^#/, '');
    setView(IDS.indexOf(h) >= 0 ? h : (S.view || 'account'), true);
  }
  window.addEventListener('hashchange', function () {
    var h = (location.hash || '').replace(/^#/, '');
    if (IDS.indexOf(h) >= 0) setView(h);
  });
  buildNav();
  buildPanes();
  bindPaneState();
  applyTheme();
  applyHash();
  fetch('/api/settings').then(function (r) { return r.json(); }).then(function (b) {
    if (!b || typeof b !== 'object') return;
    var changed = false;
    Object.keys(b).forEach(function (k) {
      if (k in DEF && JSON.stringify(S[k]) !== JSON.stringify(b[k])) { S[k] = b[k]; changed = true; }
    });
    var beforeModels = JSON.stringify([S.provider, S.model, S.imgProvider, S.imgModel, S.ttsProvider, S.ttsVoice]);
    normalizeModels();
    if (beforeModels !== JSON.stringify([S.provider, S.model, S.imgProvider, S.imgModel, S.ttsProvider, S.ttsVoice])) {
      changed = true;
      try {
        fetch('/api/settings', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(S) }).catch(function () { });
      } catch (e) { }
    }
    if (changed) { buildPanes(); bindPaneState(); applyTheme(); }
  }).catch(function () {});
})();
</script>
